{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/presentation-message-binding.v1.schema.json",
  "title": "Kokoro presentation message binding v1",
  "description": "A complete browser-safe Session-owned presentation message binding. Agent/internal message refs are forbidden from this wire schema.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "bindingRef", "profileRevision", "sessionId", "presentationRunBindingRef",
    "presentationMessageId", "sessionMessageId", "sessionTextPartId", "resumeSegmentOrdinal", "state", "openedBySourceEventId", "endedBySourceEventId",
    "openedAt", "endedAt"
  ],
  "properties": {
    "bindingRef": {"$ref": "#/$defs/messageBindingRef"},
    "profileRevision": {"const": "kokoro-agui-presentation.v1"},
    "sessionId": {"$ref": "#/$defs/id"},
    "presentationRunBindingRef": {"$ref": "#/$defs/runBindingRef"},
    "presentationMessageId": {"$ref": "#/$defs/presentationMessageId"},
    "sessionMessageId": {
      "description": "The browser-safe Session message identity when Session has materialized this presentation message. Null is explicit and forbids consumer-side identity guessing.",
      "oneOf": [{"$ref": "#/$defs/id"}, {"type": "null"}]
    },
    "sessionTextPartId": {
      "description": "The browser-safe Session text part identity paired with sessionMessageId. Null exactly when sessionMessageId is null.",
      "oneOf": [{"$ref": "#/$defs/id"}, {"type": "null"}]
    },
    "resumeSegmentOrdinal": {"type": "integer", "minimum": 0, "maximum": 65535},
    "state": {"enum": ["open", "ended"]},
    "openedBySourceEventId": {"$ref": "#/$defs/publicSourceEventId"},
    "endedBySourceEventId": {"oneOf": [{"$ref": "#/$defs/publicSourceEventId"}, {"type": "null"}]},
    "openedAt": {"$ref": "#/$defs/dateTime"},
    "endedAt": {"oneOf": [{"$ref": "#/$defs/dateTime"}, {"type": "null"}]}
  },
  "allOf": [
    {
      "if": {"properties": {"sessionMessageId": {"type": "null"}}, "required": ["sessionMessageId"]},
      "then": {"properties": {"sessionTextPartId": {"type": "null"}}},
      "else": {"properties": {"sessionTextPartId": {"$ref": "#/$defs/id"}}}
    },
    {
      "if": {"properties": {"state": {"const": "open"}}, "required": ["state"]},
      "then": {"properties": {"endedBySourceEventId": {"type": "null"}, "endedAt": {"type": "null"}}},
      "else": {"properties": {"endedBySourceEventId": {"$ref": "#/$defs/publicSourceEventId"}, "endedAt": {"$ref": "#/$defs/dateTime"}}}
    }
  ],
  "$defs": {
    "id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "runBindingRef": {"type": "string", "pattern": "^presentation\\.run-binding:[0-9a-f]{64}$"},
    "messageBindingRef": {"type": "string", "pattern": "^presentation\\.message-binding:[0-9a-f]{64}$"},
    "presentationMessageId": {"type": "string", "pattern": "^presentation\\.message:[0-9a-f]{64}$"},
    "publicSourceEventId": {"type": "string", "minLength": 20, "maxLength": 128, "pattern": "^presentation\\.event:(?![A-Za-z0-9._:-]*agent\\.event)[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "dateTime": {"type": "string", "minLength": 20, "maxLength": 35, "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"}
  }
}
