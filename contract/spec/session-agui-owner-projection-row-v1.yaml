{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/session-agui-owner-projection-row.v1.schema.json",
  "title": "Kokoro Session AG-UI owner projection row v1",
  "description": "One complete owner replacement retained in a Session HTTP snapshot. It is owner-only state, carries no cursor or durable sequence, and is reduced through the same identity/version/terminal rules as a live owner event.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "profileRevision", "schemaRevision", "presentationOwnerBindingRef",
    "sourceEventId", "projectionVersion", "recordedAt", "event"
  ],
  "properties": {
    "profileRevision": {"const": "kokoro-agui-presentation.v1"},
    "schemaRevision": {"const": 1},
    "presentationOwnerBindingRef": {"$ref": "#/$defs/ownerBindingRef"},
    "sourceEventId": {"$ref": "#/$defs/publicSourceEventId"},
    "projectionVersion": {"$ref": "#/$defs/positiveUint64"},
    "recordedAt": {"$ref": "#/$defs/canonicalUtcMs"},
    "event": {
      "oneOf": [
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activitySafeSummary"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityToolPreview"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityHitl"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityPlan"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activitySubagent"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityMedia"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityArtifact"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityCost"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityNotice"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityError"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/customControl"},
        {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/customReceipt"}
      ]
    }
  },
  "$defs": {
    "ownerBindingRef": {"type": "string", "pattern": "^presentation\\.owner-binding:[0-9a-f]{64}$"},
    "publicSourceEventId": {"type": "string", "minLength": 20, "maxLength": 128, "pattern": "^presentation\\.event:(?![A-Za-z0-9._:-]*agent\\.event)[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "canonicalUtcMs": {"type": "string", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"},
    "positiveUint64": {
      "type": "string", "minLength": 1, "maxLength": 20,
      "oneOf": [
        {"pattern": "^[1-9][0-9]{0,18}$"}, {"pattern": "^1[0-7][0-9]{18}$"},
        {"pattern": "^18[0-3][0-9]{17}$"}, {"pattern": "^184[0-3][0-9]{16}$"},
        {"pattern": "^1844[0-5][0-9]{15}$"}, {"pattern": "^18446[0-6][0-9]{14}$"},
        {"pattern": "^184467[0-3][0-9]{13}$"}, {"pattern": "^1844674[0-3][0-9]{12}$"},
        {"pattern": "^184467440[0-6][0-9]{10}$"}, {"pattern": "^1844674407[0-2][0-9]{9}$"},
        {"pattern": "^18446744073[0-6][0-9]{8}$"}, {"pattern": "^1844674407370[0-8][0-9]{6}$"},
        {"pattern": "^18446744073709[0-4][0-9]{5}$"}, {"pattern": "^184467440737095[0-4][0-9]{4}$"},
        {"pattern": "^18446744073709550[0-9]{3}$"}, {"pattern": "^18446744073709551[0-5][0-9]{2}$"},
        {"pattern": "^1844674407370955160[0-9]$"}, {"pattern": "^1844674407370955161[0-4]$"},
        {"const": "18446744073709551615"}
      ]
    }
  }
}
