{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json",
  "title": "Kokoro strict AG-UI presentation event v1",
  "description": "A fail-closed subset of the pinned AG-UI EventType vocabulary. The upstream passthrough schema is never the Kokoro trust boundary.",
  "oneOf": [
    {"$ref": "#/$defs/runStarted"},
    {"$ref": "#/$defs/runFinished"},
    {"$ref": "#/$defs/runError"},
    {"$ref": "#/$defs/textStart"},
    {"$ref": "#/$defs/textContent"},
    {"$ref": "#/$defs/textEnd"},
    {"$ref": "#/$defs/activitySafeSummary"},
    {"$ref": "#/$defs/activityToolPreview"},
    {"$ref": "#/$defs/activityHitl"},
    {"$ref": "#/$defs/activityPlan"},
    {"$ref": "#/$defs/activitySubagent"},
    {"$ref": "#/$defs/activityMedia"},
    {"$ref": "#/$defs/activityArtifact"},
    {"$ref": "#/$defs/activityCost"},
    {"$ref": "#/$defs/activityNotice"},
    {"$ref": "#/$defs/activityError"},
    {"$ref": "#/$defs/customSession"},
    {"$ref": "#/$defs/customBranch"},
    {"$ref": "#/$defs/customMessage"},
    {"$ref": "#/$defs/customRun"},
    {"$ref": "#/$defs/customControl"},
    {"$ref": "#/$defs/customReceipt"}
  ],
  "$defs": {
    "id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "presentationThreadId": {"type": "string", "pattern": "^presentation\\.thread:[0-9a-f]{64}$"},
    "presentationRunId": {"type": "string", "pattern": "^presentation\\.run:[0-9a-f]{64}$"},
    "presentationMessageId": {"type": "string", "pattern": "^presentation\\.message:[0-9a-f]{64}$"},
    "positiveUint64": {
      "type": "string", "minLength": 1, "maxLength": 20,
      "oneOf": [
        {"pattern": "^[1-9][0-9]{0,18}$"}, {"pattern": "^1[0-7][0-9]{18}$"},
        {"pattern": "^18[0-3][0-9]{17}$"}, {"pattern": "^184[0-3][0-9]{16}$"},
        {"pattern": "^1844[0-5][0-9]{15}$"}, {"pattern": "^18446[0-6][0-9]{14}$"},
        {"pattern": "^184467[0-3][0-9]{13}$"}, {"pattern": "^1844674[0-3][0-9]{12}$"},
        {"pattern": "^184467440[0-6][0-9]{10}$"}, {"pattern": "^1844674407[0-2][0-9]{9}$"},
        {"pattern": "^18446744073[0-6][0-9]{8}$"}, {"pattern": "^1844674407370[0-8][0-9]{6}$"},
        {"pattern": "^18446744073709[0-4][0-9]{5}$"}, {"pattern": "^184467440737095[0-4][0-9]{4}$"},
        {"pattern": "^18446744073709550[0-9]{3}$"}, {"pattern": "^18446744073709551[0-5][0-9]{2}$"},
        {"pattern": "^1844674407370955160[0-9]$"}, {"pattern": "^1844674407370955161[0-4]$"},
        {"const": "18446744073709551615"}
      ]
    },
    "shortText": {"type": "string", "minLength": 1, "maxLength": 1024},
    "safeText": {"type": "string", "maxLength": 16384},
    "timestamp": {"type": "integer", "minimum": 0, "maximum": 8640000000000000},
    "dateTime": {"type": "string", "minLength": 20, "maxLength": 35, "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"},
    "creditDecimal": {"type": "string", "minLength": 1, "maxLength": 40, "pattern": "^(0|[1-9][0-9]{0,39})$"},
    "mediaFailure": {
      "type": "object", "additionalProperties": false,
      "required": ["code", "retryClass"],
      "properties": {
        "code": {"enum": ["provider_rejected", "provider_unavailable", "invalid_output", "policy_restricted", "artifact_unavailable", "usage_unavailable", "unknown_terminal"]},
        "retryClass": {"enum": ["never", "after-delay", "after-user-action", "reconcile-receipt"]},
        "safeMessage": {"$ref": "#/$defs/safeText"}
      }
    },
    "mediaCandidate": {
      "type": "object", "additionalProperties": false,
      "required": ["candidateRef", "ordinal", "ownerVersion", "state"],
      "properties": {
        "candidateRef": {"$ref": "#/$defs/id"}, "ordinal": {"type": "integer", "minimum": 0, "maximum": 3},
        "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
        "state": {"enum": ["allocated", "producing", "output-received", "validating", "ready", "restricted", "failed", "unknown", "cancel-requested", "canceled"]},
        "artifactRef": {"$ref": "#/$defs/id"}, "artifactVersionRef": {"$ref": "#/$defs/id"},
        "safeFailure": {"$ref": "#/$defs/mediaFailure"}
      },
      "allOf": [
        {
          "if": {"properties": {"state": {"const": "ready"}}, "required": ["state"]},
          "then": {"required": ["artifactRef", "artifactVersionRef"], "properties": {
            "artifactRef": {"$ref": "#/$defs/id"}, "artifactVersionRef": {"$ref": "#/$defs/id"}, "safeFailure": false
          }},
          "else": {"properties": {"artifactRef": false, "artifactVersionRef": false}}
        },
        {
          "if": {"properties": {"state": {"enum": ["restricted", "failed"]}}, "required": ["state"]},
          "then": {"required": ["safeFailure"], "properties": {"safeFailure": {"$ref": "#/$defs/mediaFailure"}}},
          "else": {"properties": {"safeFailure": false}}
        }
      ]
    },
    "costProjectionLink": {
      "type": "object", "additionalProperties": false,
      "required": ["costProjectionRef", "ownerVersion"],
      "properties": {"costProjectionRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"}}
    },
    "artifactDisplay": {
      "oneOf": [
        {
          "type": "object", "additionalProperties": false,
          "required": ["kind", "format", "width", "height", "byteSize"],
          "properties": {
            "kind": {"const": "image"}, "format": {"enum": ["png", "jpeg", "webp"]},
            "width": {"type": "integer", "minimum": 1, "maximum": 65535},
            "height": {"type": "integer", "minimum": 1, "maximum": 65535}, "byteSize": {"$ref": "#/$defs/positiveUint64"}
          }
        },
        {
          "type": "object", "additionalProperties": false,
          "required": ["kind", "format", "durationMs", "byteSize"],
          "properties": {
            "kind": {"const": "audio"}, "format": {"enum": ["mp3", "wav", "aac", "flac", "ogg"]},
            "durationMs": {"$ref": "#/$defs/positiveUint64"}, "byteSize": {"$ref": "#/$defs/positiveUint64"}
          }
        },
        {
          "type": "object", "additionalProperties": false,
          "required": ["kind", "format", "width", "height", "durationMs", "byteSize"],
          "properties": {
            "kind": {"const": "video"}, "format": {"enum": ["mp4", "webm", "mov"]},
            "width": {"type": "integer", "minimum": 1, "maximum": 65535},
            "height": {"type": "integer", "minimum": 1, "maximum": 65535},
            "durationMs": {"$ref": "#/$defs/positiveUint64"}, "byteSize": {"$ref": "#/$defs/positiveUint64"}
          }
        },
        {
          "type": "object", "additionalProperties": false,
          "required": ["kind", "format", "byteSize"],
          "properties": {
            "kind": {"const": "document"}, "format": {"enum": ["pdf", "markdown", "text"]},
            "byteSize": {"$ref": "#/$defs/positiveUint64"}, "pageCount": {"type": "integer", "minimum": 1, "maximum": 100000}
          }
        }
      ]
    },
    "runStarted": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "threadId", "runId"],
      "properties": {
        "type": {"const": "RUN_STARTED"}, "timestamp": {"$ref": "#/$defs/timestamp"},
        "threadId": {"$ref": "#/$defs/presentationThreadId"}, "runId": {"$ref": "#/$defs/presentationRunId"},
        "parentRunId": {"$ref": "#/$defs/presentationRunId"}
      }
    },
    "runFinished": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "threadId", "runId"],
      "properties": {
        "type": {"const": "RUN_FINISHED"}, "timestamp": {"$ref": "#/$defs/timestamp"},
        "threadId": {"$ref": "#/$defs/presentationThreadId"}, "runId": {"$ref": "#/$defs/presentationRunId"}
      }
    },
    "runError": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "message", "code"],
      "properties": {
        "type": {"const": "RUN_ERROR"}, "timestamp": {"$ref": "#/$defs/timestamp"},
        "message": {"$ref": "#/$defs/safeText"}, "code": {"$ref": "#/$defs/id"}
      }
    },
    "textStart": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "role"],
      "properties": {
        "type": {"const": "TEXT_MESSAGE_START"}, "timestamp": {"$ref": "#/$defs/timestamp"},
        "messageId": {"$ref": "#/$defs/presentationMessageId"}, "role": {"const": "assistant"}
      }
    },
    "textContent": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "delta"],
      "properties": {
        "type": {"const": "TEXT_MESSAGE_CONTENT"}, "timestamp": {"$ref": "#/$defs/timestamp"},
        "messageId": {"$ref": "#/$defs/presentationMessageId"}, "delta": {"type": "string", "minLength": 1, "maxLength": 16384}
      }
    },
    "textEnd": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId"],
      "properties": {
        "type": {"const": "TEXT_MESSAGE_END"}, "timestamp": {"$ref": "#/$defs/timestamp"},
        "messageId": {"$ref": "#/$defs/presentationMessageId"}
      }
    },
    "activityBase": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"]
    },
    "activitySafeSummary": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.safe-summary.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["partRef", "ownerVersion", "summary", "status", "updatedAt"], "properties": {
          "partRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
          "summary": {"$ref": "#/$defs/safeText"},
          "status": {"enum": ["streaming", "complete", "partial", "failed", "canceled"]},
          "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "activityToolPreview": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.tool-preview.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["toolCallRef", "ownerVersion", "label", "status", "updatedAt"], "properties": {
          "toolCallRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"}, "label": {"$ref": "#/$defs/shortText"},
          "status": {"enum": ["pending", "running", "awaiting-user", "completed", "failed", "canceled"]},
          "summary": {"$ref": "#/$defs/safeText"}, "resultPreview": {"$ref": "#/$defs/safeText"},
          "isError": {"type": "boolean"}, "truncated": {"type": "boolean"}, "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "activityHitl": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.hitl.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["ownerRef", "ownerVersion", "decisionGroupRef", "requiredOwnerRefs", "controlRef", "kind", "title", "description", "allowedActions", "status", "updatedAt"], "properties": {
          "ownerRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
          "decisionGroupRef": {"$ref": "#/$defs/id"},
          "requiredOwnerRefs": {"type": "array", "minItems": 1, "maxItems": 64, "uniqueItems": true, "items": {"$ref": "#/$defs/id"}},
          "controlRef": {"$ref": "#/$defs/id"}, "kind": {"enum": ["approval", "interaction"]},
          "title": {"$ref": "#/$defs/shortText"}, "description": {"$ref": "#/$defs/safeText"},
          "riskSummary": {"$ref": "#/$defs/safeText"}, "inputSchemaRef": {"$ref": "#/$defs/id"},
          "allowedActions": {"type": "array", "minItems": 1, "maxItems": 16, "uniqueItems": true, "items": {"$ref": "#/$defs/id"}},
          "status": {"enum": ["pending", "accepted", "rejected", "expired", "canceled"]},
          "deadline": {"$ref": "#/$defs/dateTime"}, "receiptRef": {"$ref": "#/$defs/id"},
          "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "planStep": {
      "type": "object", "additionalProperties": false, "required": ["stepRef", "label", "status"],
      "properties": {"stepRef": {"$ref": "#/$defs/id"}, "label": {"$ref": "#/$defs/shortText"}, "status": {"enum": ["pending", "in-progress", "completed", "failed", "canceled"]}}
    },
    "activityPlan": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.plan.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["planRef", "ownerVersion", "summary", "status", "steps", "updatedAt"], "properties": {
          "planRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"}, "summary": {"$ref": "#/$defs/safeText"},
          "status": {"enum": ["proposed", "active", "completed", "failed", "canceled"]},
          "steps": {"type": "array", "maxItems": 256, "items": {"$ref": "#/$defs/planStep"}},
          "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "activitySubagent": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.subagent.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["subagentRef", "ownerVersion", "status", "updatedAt"], "properties": {
          "subagentRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
          "status": {"enum": ["pending", "running", "completed", "failed", "canceled"]},
          "summary": {"$ref": "#/$defs/safeText"}, "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "activityMedia": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.media.v1"}, "replace": {"const": true},
        "content": {
          "type": "object", "additionalProperties": false,
          "required": ["mediaOperationRef", "definitionRef", "definitionRevisionRef", "ownerVersion", "state", "progressBps", "candidates", "updatedAt"],
          "properties": {
            "mediaOperationRef": {"$ref": "#/$defs/id"}, "definitionRef": {"$ref": "#/$defs/id"},
            "definitionRevisionRef": {"$ref": "#/$defs/id"}, "modelOptionRevisionRef": {"$ref": "#/$defs/id"},
            "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
            "state": {"enum": ["admission-pending", "authorized", "queued", "active", "finalizing", "cancel-requested", "reconciling", "completed", "partial", "failed", "canceled"]},
            "progressBps": {"type": "integer", "minimum": 0, "maximum": 10000},
            "candidates": {"type": "array", "maxItems": 4, "items": {"$ref": "#/$defs/mediaCandidate"}},
            "costProjection": {"$ref": "#/$defs/costProjectionLink"},
            "outcomeClass": {"enum": ["canonical", "irreconcilable"]},
            "safeFailure": {"$ref": "#/$defs/mediaFailure"}, "updatedAt": {"$ref": "#/$defs/dateTime"}
          },
          "allOf": [
            {
              "if": {"properties": {"state": {"enum": ["completed", "partial", "failed", "canceled"]}}, "required": ["state"]},
              "then": {"required": ["outcomeClass"], "properties": {"outcomeClass": {"enum": ["canonical", "irreconcilable"]}}},
              "else": {"properties": {"outcomeClass": false, "safeFailure": false}}
            },
            {
              "if": {"properties": {"state": {"const": "failed"}}, "required": ["state"]},
              "then": {"required": ["safeFailure"], "properties": {"safeFailure": {"$ref": "#/$defs/mediaFailure"}}},
              "else": {"properties": {"safeFailure": false}}
            }
          ]
        }
      }
    },
    "activityArtifact": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.artifact.v1"}, "replace": {"const": true},
        "content": {
          "type": "object", "additionalProperties": false,
          "required": ["artifactRef", "artifactVersionRef", "ownerVersion", "availability", "mediaClass", "updatedAt"],
          "properties": {
            "artifactRef": {"$ref": "#/$defs/id"}, "artifactVersionRef": {"$ref": "#/$defs/id"},
            "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
            "availability": {"enum": ["processing", "ready", "restricted", "unavailable", "deleted"]},
            "mediaClass": {"enum": ["image", "audio", "video", "document"]},
            "display": {"$ref": "#/$defs/artifactDisplay"}, "safeFailure": {"$ref": "#/$defs/mediaFailure"},
            "title": {"$ref": "#/$defs/shortText"}, "updatedAt": {"$ref": "#/$defs/dateTime"}
          },
          "allOf": [
            {
              "if": {"properties": {"availability": {"const": "ready"}}, "required": ["availability"]},
              "then": {"required": ["display"], "properties": {"display": {"$ref": "#/$defs/artifactDisplay"}, "safeFailure": false}},
              "else": {"properties": {"display": false}}
            },
            {
              "if": {"properties": {"availability": {"enum": ["restricted", "unavailable"]}}, "required": ["availability"]},
              "then": {"required": ["safeFailure"], "properties": {"safeFailure": {"$ref": "#/$defs/mediaFailure"}}},
              "else": {"properties": {"safeFailure": false}}
            }
          ]
        }
      }
    },
    "activityCost": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.cost.v1"}, "replace": {"const": true},
        "content": {
          "type": "object", "additionalProperties": false,
          "required": ["mediaOperationRef", "costProjectionRef", "ownerVersion", "state", "freshness", "updatedAt"],
          "properties": {
            "mediaOperationRef": {"$ref": "#/$defs/id"}, "costProjectionRef": {"$ref": "#/$defs/id"},
            "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
            "state": {"enum": ["pending", "estimated", "final", "corrected", "unavailable"]},
            "freshness": {"enum": ["current", "stale", "rebuilding", "unavailable"]},
            "amount": {
              "type": "object", "additionalProperties": false, "required": ["creditUnit", "amount"],
              "properties": {"creditUnit": {"$ref": "#/$defs/id"}, "amount": {"$ref": "#/$defs/creditDecimal"}}
            },
            "correctsOwnerVersion": {"$ref": "#/$defs/positiveUint64"},
            "safeReason": {"$ref": "#/$defs/safeText"}, "updatedAt": {"$ref": "#/$defs/dateTime"}
          },
          "allOf": [
            {
              "if": {"properties": {"state": {"enum": ["estimated", "final", "corrected"]}}, "required": ["state"]},
              "then": {"required": ["amount"], "properties": {"amount": {
                "type": "object", "additionalProperties": false, "required": ["creditUnit", "amount"],
                "properties": {"creditUnit": {"$ref": "#/$defs/id"}, "amount": {"$ref": "#/$defs/creditDecimal"}}
              }}},
              "else": {"properties": {"amount": false}}
            },
            {
              "if": {"properties": {"state": {"const": "corrected"}}, "required": ["state"]},
              "then": {"required": ["correctsOwnerVersion"], "properties": {"correctsOwnerVersion": {"$ref": "#/$defs/positiveUint64"}}},
              "else": {"properties": {"correctsOwnerVersion": false}}
            },
            {
              "if": {"properties": {"state": {"const": "unavailable"}}, "required": ["state"]},
              "then": {"required": ["safeReason"], "properties": {"safeReason": {"$ref": "#/$defs/safeText"}}},
              "else": {"properties": {"safeReason": false}}
            }
          ]
        }
      }
    },
    "activityNotice": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.notice.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["noticeRef", "ownerVersion", "code", "message", "severity", "updatedAt"], "properties": {
          "noticeRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
          "code": {"$ref": "#/$defs/id"}, "message": {"$ref": "#/$defs/safeText"}, "severity": {"enum": ["info", "warning"]},
          "retryClass": {"enum": ["never", "after-delay", "after-user-action", "reconcile-receipt"]},
          "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "activityError": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "messageId": {"$ref": "#/$defs/presentationMessageId"},
        "activityType": {"const": "kokoro.error.v1"}, "replace": {"const": true},
        "content": {"type": "object", "additionalProperties": false, "required": ["errorRef", "ownerVersion", "code", "message", "retryClass", "updatedAt"], "properties": {
          "errorRef": {"$ref": "#/$defs/id"}, "ownerVersion": {"$ref": "#/$defs/positiveUint64"},
          "code": {"$ref": "#/$defs/id"}, "message": {"$ref": "#/$defs/safeText"},
          "retryClass": {"enum": ["never", "after-delay", "after-user-action", "reconcile-receipt"]},
          "supportCorrelationRef": {"$ref": "#/$defs/id"}, "updatedAt": {"$ref": "#/$defs/dateTime"}
        }}
      }
    },
    "customSession": {
      "type": "object", "additionalProperties": false, "required": ["type", "timestamp", "name", "value"],
      "properties": {"type": {"const": "CUSTOM"}, "timestamp": {"$ref": "#/$defs/timestamp"}, "name": {"const": "kokoro.session.replace.v1"},
        "value": {"type": "object", "additionalProperties": false, "required": ["sessionId", "profileRevision", "title", "lifecycle", "contextPolicy", "activeBranchId", "version"], "properties": {
          "sessionId": {"$ref": "#/$defs/id"}, "profileRevision": {"const": "kokoro-agui-presentation.v1"}, "title": {"$ref": "#/$defs/shortText"}, "lifecycle": {"enum": ["active", "archived", "deleted"]},
