# Kokoro session HTTP face — the ONE truth for the endpoints.
#
# snake_case everywhere: the HTTP face shares the one wire vocabulary (no camelCase
# rename layer). POST messages starts a run and returns a 202 receipt; GET /sessions/:id
# is the authoritative snapshot for hydration; SSE resumes from Last-Event-ID = seq.

last_event_id_header: last-event-id
# 400 = ZodError / decision error. 409 session_run_active = a non-matching
# idempotency_key hit a session that already has an active run. 500 = opaque internal.
error_conflict_code: session_run_active

enums:
  message_role: [user, assistant]
  message_status: [pending, streaming, completed, failed]
  pause_status: [pending, resolved, cancelled, expired]
  awaiting_kind: [tool_approval, ask_user_question, result_review, input]
  resume_decision: [approve, edit, reject, respond, submit]
  # R2 回执查询面状态:pending=已受理未见 agent 回执;persisted/applied=agent 两时点;failed=终局失败。
  control_receipt_view_status: [pending, persisted, applied, failed]

# Snapshot read-model shapes (dependency order: leaves first). Exported for session/web.
objects:
  - name: Risk
    fields:
      - {name: level, type: string_nonempty}
      - {name: source, type: string_nonempty}
      - {name: reason, type: string_nonempty}
  - name: SessionMeta
    fields:
      - {name: session_id, type: string_nonempty}
      - {name: title, type: string_nonempty}
      - {name: owner_id, type: string_nonempty}
      - {name: created_at, type: string_nonempty}
      - {name: updated_at, type: string_nonempty}
  - name: MessageRecord
    fields:
      - {name: message_id, type: string_nonempty}
      - {name: role, type: enum:message_role}
      - {name: content, type: string}
      - {name: status, type: enum:message_status}
      - {name: created_at, type: string_nonempty}
      - {name: run_id, type: string_nonempty, optional: true}
  - name: ActiveRun
    fields:
      - {name: run_id, type: string_nonempty}
      - {name: status, type: string_nonempty}
  - name: PendingPause
    fields:
      - {name: pause_id, type: string_nonempty}
      - {name: run_id, type: string_nonempty}
      - {name: tool_id, type: string_nonempty}
      - {name: segment_id, type: string_nonempty}
      - {name: tool_name, type: string_nonempty}
      - {name: kind, type: enum:awaiting_kind}
      - {name: args, type: record}
      - {name: description, type: string}
      - {name: allowed_decisions, type: array:enum:resume_decision}
      - {name: risk, type: object:Risk, optional: true}
      - {name: editable, type: boolean}
      - {name: input_schema, type: record, optional: true}
      - {name: result, type: string, optional: true}
      - {name: status, type: enum:pause_status}
      - {name: decision, type: record, optional: true}
      - {name: created_at, type: string_nonempty}
      - {name: resolved_at, type: string_nonempty, optional: true}
  - name: WorkspaceFile
    fields:
      - {name: path, type: string_nonempty}
      - {name: mime, type: string_nonempty}
      - {name: bytes, type: int}
  # 成果（deliver 冻结件）读模型：内容寻址,永不漂移;下载走 delivery_content 端点。
  - name: Delivery
    fields:
      - {name: content_hash, type: string_nonempty}
      - {name: path, type: string_nonempty}
      - {name: title, type: string_nonempty}
      - {name: mime, type: string_nonempty}
      - {name: size, type: int}
      - {name: run_id, type: string_nonempty}
      - {name: created_at, type: string_nonempty}
  # ARTIFACT-LIB(Wave4):跨会话作品库读模型——namespace 维度聚合 deliveries(内容寻址,同 hash
  # 跨会话收敛一条,session_id=最近一次交付归属,便于回跳)。
  - name: ArtifactRecord
    fields:
      - {name: content_hash, type: string_nonempty}
      - {name: session_id, type: string_nonempty}
      - {name: title, type: string_nonempty}
      - {name: mime, type: string_nonempty}
      - {name: size, type: int}
      - {name: created_at, type: string_nonempty}
  - name: ArtifactList
    fields:
      - {name: artifacts, type: array:object:ArtifactRecord}
      - {name: next_cursor, type: string_nonempty, optional: true}
  # 会话列表项(服务端化的 rail 数据源;线程内容仍走 snapshot+回放)。
  - name: SessionListItem
    fields:
      - {name: session_id, type: string_nonempty}
      - {name: title, type: string_nonempty}
      - {name: updated_at, type: string_nonempty}
  - name: SessionList
    fields:
      - {name: sessions, type: array:object:SessionListItem}
      # 复合游标(updated_at+session_id 稳定分页);缺席=没有下一页。
      - {name: next_cursor, type: string_nonempty, optional: true}
  # MODEL-UX(Wave4):模型候选窄读——session 按信封 namespace 出「可选且可用」列表
  # (profile.allowed 展示过滤 ∩ platform resolve 可用性权威,MODEL-SOURCE 定案)。
  # 字段最小面(D1 拒投机):provider/name 即 wire ModelConfig 的引用键;is_default=缺省高亮。
  - name: ModelCandidate
    fields:
      - {name: provider, type: string_nonempty}
      - {name: name, type: string_nonempty}
      - {name: is_default, type: boolean}
  - name: ModelCandidateList
    fields:
      - {name: models, type: array:object:ModelCandidate}
  # AGENT-PRESET web 半场(Wave4):具名 agent 候选窄读,同 /models 模式(profile.agents 派生;
  # 无 profile 档=只有 general 缺省,web 隐选择器)。
  - name: AgentCandidate
    fields:
      - {name: name, type: string_nonempty}
      - {name: description, type: string_nonempty}
      - {name: is_default, type: boolean}
  - name: AgentCandidateList
    fields:
      - {name: agents, type: array:object:AgentCandidate}
  # WEB-BILLING(Wave3):credit 余额/流水窄读,session 从 auth namespace 派生账户并代理。
  # 金额一律微单位 bigint 序列化为字符串(credit 单源 balanceMicros 形状),换算归展示层。
  - name: BillingSummary
    fields:
      - {name: balance_micros, type: string_nonempty}
      - {name: held_micros, type: string_nonempty}
  - name: BillingLedgerEntry
    fields:
      - {name: entry_id, type: string_nonempty}
      # 有符号微单位字符串:授予为正,扣费为负。
      - {name: delta_micros, type: string_nonempty}
      - {name: reason, type: string_nonempty}
      - {name: created_at, type: int}
      # 幂等键可解析出 run 时回填;否则 null(如人工调整)。
      - {name: run_id, type: string_nonempty, optional: true, nullable: true}
  - name: BillingLedger
    fields:
      - {name: entries, type: array:object:BillingLedgerEntry}
      - {name: next_cursor, type: string_nonempty, optional: true}
  - name: SessionSnapshot
    fields:
      - {name: session, type: object:SessionMeta}
      - {name: messages, type: array:object:MessageRecord}
      - {name: active_run, type: object:ActiveRun, optional: true}
      - {name: pending_pauses, type: array:object:PendingPause}
      # 会话工作区文件清单（真实目录 walk；工作区=真文件系统 backend，state 盘档为空列表）。
      - {name: files, type: array:object:WorkspaceFile}
      # 会话成果清单（delivery.created 投影;冻结件,与 files 的可变语义分开）。
      - {name: deliveries, type: array:object:Delivery}
      # server-internal high-water the snapshot folded to; web never sorts by it.
      - {name: event_watermark, type: int}

endpoints:
  create_message:
    method: POST
    path_fn: messagesPath
    path_template: "/sessions/{session_id}/messages"
    params: [session_id]
    status: 202
    body_const: messageCreateParamsSchema
    body:
      - {name: idempotency_key, type: string_nonempty}
      - {name: content, type: string_nonempty}
      - {name: model, type: string_nonempty, optional: true}
      - {name: agent, type: string_nonempty, optional: true}
      - {name: thinking, type: boolean, optional: true}
      # 会话级能力（仅首条消息生效并定死；后续消息带不同值 → 400 session_capabilities_locked）：
      # pinned_skills=输入框强调集（授权池快照由 session 查 enabled 池自动完成,不上 wire）。
      - {name: pinned_skills, type: array:string_nonempty, optional: true}
      - {name: mcp_servers, type: array:string_nonempty, optional: true}
    receipt_const: messageCreateReceiptSchema
    receipt:
      - {name: run_id, type: string_nonempty}
      - {name: user_message_id, type: string_nonempty}
      - {name: assistant_message_id, type: string_nonempty}
  list_sessions:
    method: GET
    path_fn: sessionsPath
    path_template: "/sessions"
    params: []
    response_const: sessionListSchema
    response_object: SessionList
    note: "属主会话列表(updated_at desc,软删不出);query limit/cursor 不进契约 path,由实现读 querystring。"
  list_artifacts:
    method: GET
    path_fn: artifactsPath
    path_template: "/artifacts"
    params: []
    response_const: artifactListSchema
    response_object: ArtifactList
    note: "ARTIFACT-LIB:属主 namespace 全部成果,created_at desc;query limit/cursor 同 list_sessions 注。"
  artifact_content:
    method: GET
    path_fn: artifactContentPath
    path_template: "/artifacts/{content_hash}"
    params: [content_hash]
    note: "跨会话冻结副本下载:内容寻址同 delivery_content 语义(immutable 可长缓存),namespace 守门。"
  share_create:
    method: POST
    path_fn: sharePath
    path_template: "/sessions/{session_id}/share"
    params: [session_id]
    status: 201
    receipt_const: shareReceiptSchema
    receipt:
      - {name: share_id, type: string_nonempty}
    note: "SHARE-1:同属主创建只读分享;share_id=不可枚举 capability id(shr_ 前缀);幂等=重复创建返同 id(未撤销时)。"
  share_revoke:
    method: DELETE
    path_fn: sharePath
    path_template: "/sessions/{session_id}/share"
    params: [session_id]
    note: "撤销分享:撤销后公共读 404;再创建=新 share_id(旧链接永久失效)。"
  shared_snapshot:
    method: GET
    path_fn: sharedSnapshotPath
    path_template: "/shared/{share_id}"
    params: [share_id]
    response_const: sessionSnapshotSchema
    response_object: SessionSnapshot
    note: "公共只读面(无 auth,capability URL 即权限):复用 SessionSnapshot 形状(已不含 namespace);pending_pauses 恒空数组(分享不暴露待批);不可枚举,撤销即 404。"
  model_candidates:
    method: GET
    path_fn: modelCandidatesPath
    path_template: "/models"
    params: []
    response_const: modelCandidateListSchema
    response_object: ModelCandidateList
    note: "MODEL-UX:候选=allowed∩可用;不可用不出列;空列表=只剩缺省档(web 隐选择器)。"
  agent_candidates:
    method: GET
    path_fn: agentCandidatesPath
    path_template: "/agents"
    params: []
    response_const: agentCandidateListSchema
    response_object: AgentCandidateList
    note: "AGENT-PRESET:候选=profile.agents+general 缺省(is_default);首条锁语义同 model/mcp。"
  billing_summary:
    method: GET
    path_fn: billingSummaryPath
    path_template: "/billing/summary"
    params: []
    response_const: billingSummarySchema
    response_object: BillingSummary
    note: "WEB-BILLING:账户按已验 namespace 派生(路径不收参);无账户=零额(不隐式建账)。"
  billing_ledger:
    method: GET
    path_fn: billingLedgerPath
    path_template: "/billing/ledger"
    params: []
    response_const: billingLedgerSchema
    response_object: BillingLedger
    note: "WEB-BILLING:流水 created_at desc;query limit/cursor 同 list_sessions 注。"
  snapshot:
    method: GET
    path_fn: snapshotPath
    path_template: "/sessions/{session_id}"
    params: [session_id]
    response_const: sessionSnapshotSchema
    response_object: SessionSnapshot
  delivery_content:
    method: GET
    path_fn: deliveryPath
    path_template: "/sessions/{session_id}/deliveries/{content_hash}"
    params: [session_id, content_hash]
    note: "成果冻结副本下载：内容寻址（改/删源文件不影响）；content-type 按记录 mime，immutable 可长缓存。"
  stream:
    method: GET
    path_fn: eventsPath
    path_template: "/sessions/{session_id}/events"
    params: [session_id]
    note: "SSE; Last-Event-ID header carries the last seq the client saw (illegal => snapshot replay)."
  file:
    method: GET
    path_fn: filePath
    path_template: "/sessions/{session_id}/files/{path}"
    params: [session_id, path]
    note: "工作区文件字节：content-type 按扩展名，路径含 '/' 须逐段编码；穿越/不存在 => 404。文件可变（agent 迭代），不设 immutable 缓存。"
  control_receipt:
    method: GET
    path_fn: controlReceiptPath
    path_template: "/sessions/{session_id}/runs/{run_id}/control/{decision_id}"
    params: [session_id, run_id, decision_id]
    receipt_const: controlReceiptViewSchema
    receipt:
      - {name: decision_id, type: string_nonempty}
      - {name: status, type: enum:control_receipt_view_status}
    note: "R2 回执查询:{decision_id,status: pending|persisted|applied|failed};同属主守门同 snapshot。"
  run_control:
    method: POST
    path_fn: controlPath
    path_template: "/sessions/{session_id}/runs/{run_id}/control"
    params: [session_id, run_id]
    status: 202
    body_const: runControlBodySchema   # discriminated on kind; decision_id = idempotency guard
    receipt_const: runControlReceiptSchema
    receipt:
      - {name: ok, type: literal_true}
  delete_session:
    method: DELETE
    path_template: "/sessions/{session_id}"   # 与 snapshot 同路径（snapshotPath 复用），无新 path fn
    params: [session_id]
    status: 202
    receipt_const: deleteSessionReceiptSchema
    receipt:
      # 恒为 "deleted"：软删除即时完成（technical/16）；幂等——重复删除/不存在同响应。
      - {name: status, type: string_nonempty}

error_const: errorResponseSchema
error:
  - {name: error, type: string_nonempty}
