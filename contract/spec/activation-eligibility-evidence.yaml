{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.dev/activation-eligibility-evidence/v1",
  "title": "Kokoro Persisted Activation Eligibility Evidence v1",
  "type": "object", "additionalProperties": false,
  "required": ["contract", "schemaRevision", "evidenceRef", "revision", "activationAttemptRef", "siteRelease", "beginAuthoritySnapshot", "immediateBeforePointerCasAuthoritySnapshot", "decision", "evaluatedAt", "eligibilityMaterialDigest"],
  "properties": {
    "contract": {"const": "kokoro.activation-eligibility-evidence.v1"}, "schemaRevision": {"const": "1"},
    "evidenceRef": {"$ref": "#/$defs/ref"}, "revision": {"$ref": "#/$defs/decimal"},
    "activationAttemptRef": {"$ref": "#/$defs/ref"}, "siteRelease": {"$ref": "#/$defs/digestRef"},
    "beginAuthoritySnapshot": {"$ref": "#/$defs/digestRef"}, "immediateBeforePointerCasAuthoritySnapshot": {"$ref": "#/$defs/digestRef"},
    "decision": {"const": "eligible"}, "evaluatedAt": {"$ref": "#/$defs/timestamp"},
    "eligibilityMaterialDigest": {"$ref": "#/$defs/digest"}
  },
  "$defs": {
    "ref": {"type": "string", "minLength": 3, "maxLength": 240, "pattern": "^[a-z][a-z0-9]*(?:[._/-][a-z0-9]+)+$"},
    "decimal": {"type": "string", "pattern": "^(?:0|[1-9][0-9]*)$", "maxLength": 39},
    "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "timestamp": {"type": "string", "pattern": "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z$"},
    "digestRef": {"type": "object", "additionalProperties": false, "required": ["ref", "digest"], "properties": {"ref": {"$ref": "#/$defs/ref"}, "digest": {"$ref": "#/$defs/digest"}}}
  }
}
