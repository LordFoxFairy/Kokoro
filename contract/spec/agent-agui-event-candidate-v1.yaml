{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/agent-agui-event-candidate.v1.schema.json",
  "title": "Kokoro Agent AG-UI event candidate v1",
  "description": "A contract-only internal candidate emitted by Agent and admitted by Session. Every branch reuses the stricter browser presentation field schema; CUSTOM, owner Artifact/Cost activities, raw payloads and native tool/reasoning/state families have no representation.",
  "oneOf": [
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/runStarted"},
    {"$ref": "#/$defs/runFinishedSuccess"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/runError"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/textStart"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/textContent"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/textEnd"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activitySafeSummary"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityToolPreview"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityHitl"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityPlan"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activitySubagent"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityMedia"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityNotice"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityError"}
  ],
  "$defs": {
    "runFinishedSuccess": {
      "type": "object",
      "additionalProperties": false,
      "required": ["type", "timestamp", "threadId", "runId", "outcome"],
      "properties": {
        "type": {"const": "RUN_FINISHED"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "threadId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "runId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "outcome": {
          "type": "object",
          "additionalProperties": false,
          "required": ["type"],
          "properties": {"type": {"const": "success"}}
        }
      }
    }
  }
}
