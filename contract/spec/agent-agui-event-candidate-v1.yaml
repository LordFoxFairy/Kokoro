{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/agent-agui-event-candidate.v1.schema.json",
  "title": "Kokoro Agent AG-UI event candidate v1",
  "description": "A contract-only internal candidate emitted by Agent and admitted by Session. Every branch reuses the stricter browser presentation field schema except RUN_STARTED, whose closed candidate arm forbids parentRunId so Session alone derives browser lineage from binding authority. CUSTOM, owner Artifact/Cost activities, raw payloads and native tool/reasoning/state families have no representation.",
  "oneOf": [
    {"$ref": "#/$defs/runStartedWithoutParent"},
    {"$ref": "#/$defs/runFinishedSuccess"},
    {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/runError"},
    {"$ref": "#/$defs/textStart"},
    {"$ref": "#/$defs/textContent"},
    {"$ref": "#/$defs/textEnd"},
    {"$ref": "#/$defs/activityCandidate"}
  ],
  "$defs": {
    "runStartedWithoutParent": {
      "type": "object",
      "additionalProperties": false,
      "required": ["type", "timestamp", "threadId", "runId"],
      "properties": {
        "type": {"const": "RUN_STARTED"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "threadId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "runId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"}
      }
    },
    "runFinishedSuccess": {
      "type": "object",
      "additionalProperties": false,
      "required": ["type", "timestamp", "threadId", "runId", "outcome"],
      "properties": {
        "type": {"const": "RUN_FINISHED"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "threadId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "runId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "outcome": {
          "type": "object",
          "additionalProperties": false,
          "required": ["type"],
          "properties": {"type": {"const": "success"}}
        }
      }
    },
    "textStart": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "role"],
      "properties": {
        "type": {"const": "TEXT_MESSAGE_START"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "messageId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "role": {"const": "assistant"}
      }
    },
    "textContent": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "delta"],
      "properties": {
        "type": {"const": "TEXT_MESSAGE_CONTENT"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "messageId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "delta": {"type": "string", "minLength": 1, "maxLength": 16384}
      }
    },
    "textEnd": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId"],
      "properties": {
        "type": {"const": "TEXT_MESSAGE_END"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "messageId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"}
      }
    },
    "activityCandidate": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "timestamp", "messageId", "activityType", "content", "replace"],
      "properties": {
        "type": {"const": "ACTIVITY_SNAPSHOT"},
        "timestamp": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/timestamp"},
        "messageId": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/id"},
        "activityType": {"enum": ["kokoro.safe-summary.v1", "kokoro.tool-preview.v1", "kokoro.hitl.v1", "kokoro.plan.v1", "kokoro.subagent.v1", "kokoro.notice.v1", "kokoro.error.v1"]},
        "content": {"type": "object"},
        "replace": {"const": true}
      },
      "allOf": [
        {"if": {"properties": {"activityType": {"const": "kokoro.safe-summary.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activitySafeSummary/properties/content"}}}},
        {"if": {"properties": {"activityType": {"const": "kokoro.tool-preview.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityToolPreview/properties/content"}}}},
        {"if": {"properties": {"activityType": {"const": "kokoro.hitl.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityHitl/properties/content"}}}},
        {"if": {"properties": {"activityType": {"const": "kokoro.plan.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityPlan/properties/content"}}}},
        {"if": {"properties": {"activityType": {"const": "kokoro.subagent.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activitySubagent/properties/content"}}}},
        {"if": {"properties": {"activityType": {"const": "kokoro.notice.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityNotice/properties/content"}}}},
        {"if": {"properties": {"activityType": {"const": "kokoro.error.v1"}}}, "then": {"properties": {"content": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json#/$defs/activityError/properties/content"}}}}
      ]
    }
  }
}
