{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/session-agui-stream.v1.schema.json",
  "title": "Kokoro Session AG-UI SSE stream v1",
  "description": "JSON conformance representation of one SSE frame. Durable data frames preserve id/event fields that the stock AG-UI client parser discards.",
  "oneOf": [
    {"$ref": "#/$defs/durableFrame"},
    {"$ref": "#/$defs/drainingFrame"}
  ],
  "$defs": {
    "id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "uint64": {"type": "string", "pattern": "^(0|[1-9][0-9]{0,19})$"},
    "positiveUint64": {"type": "string", "pattern": "^[1-9][0-9]{0,19}$"},
    "dateTime": {"type": "string", "minLength": 20, "maxLength": 35, "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"},
    "cursor": {"type": "string", "minLength": 16, "maxLength": 2048, "pattern": "^(?=.*[A-Za-z._~-])[A-Za-z0-9._~-]+$"},
    "eventType": {"enum": ["RUN_STARTED", "RUN_FINISHED", "RUN_ERROR", "TEXT_MESSAGE_START", "TEXT_MESSAGE_CONTENT", "TEXT_MESSAGE_END", "ACTIVITY_SNAPSHOT", "CUSTOM"]},
    "durableFrame": {
      "type": "object", "additionalProperties": false,
      "required": ["kind", "id", "event", "data"],
      "properties": {
        "kind": {"const": "durable"}, "id": {"$ref": "#/$defs/cursor"}, "event": {"$ref": "#/$defs/eventType"},
        "data": {"$ref": "https://contracts.kokoro.invalid/session-agui-presentation-row.v1.schema.json"}
      }
    },
    "drainingData": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "profileRevision", "sessionId", "streamEpoch", "lastDurableCursor", "action"],
      "properties": {
        "type": {"const": "stream.draining"}, "profileRevision": {"const": "kokoro-agui-presentation.v1"},
        "sessionId": {"$ref": "#/$defs/id"}, "streamEpoch": {"$ref": "#/$defs/positiveUint64"},
        "lastDurableCursor": {"$ref": "#/$defs/cursor"}, "action": {"const": "retry-same-cursor"},
        "retryAfterMs": {"type": "integer", "minimum": 0, "maximum": 30000}
      }
    },
    "drainingFrame": {
      "type": "object", "additionalProperties": false,
      "required": ["kind", "id", "event", "data"],
      "properties": {
        "kind": {"const": "control"}, "id": {"type": "null"}, "event": {"const": "kokoro.stream.draining"},
        "data": {"$ref": "#/$defs/drainingData"}
      }
    }
  }
}
