{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.dev/web-build-intent/v1",
  "title": "Kokoro Web Build Intent Payload v1",
  "type": "object",
  "additionalProperties": false,
  "required": ["contract", "schemaRevision", "intentRef", "siteReleaseCandidate", "siteRef", "environment", "audience", "launchProductProfile", "shellRequirementRefs", "productSurfaceCatalog", "surfaceInventory", "webCompositionRegistry", "webBuildToolchain", "webBuildMaterialBundle", "contractFloor", "modelRequirements", "siteConfig", "legalPolicy", "salesPolicy", "capabilityAssignment", "issuedAt", "candidateAuthorizationEpoch", "issuer"],
  "properties": {
    "contract": {"const": "kokoro.web-build-intent.v1"}, "schemaRevision": {"const": "1"},
    "intentRef": {"$ref": "#/$defs/ref"}, "siteReleaseCandidate": {"$ref": "#/$defs/digestRef"}, "siteRef": {"$ref": "#/$defs/ref"},
    "environment": {"enum": ["development", "preview", "staging", "production"]}, "audience": {"const": "kokoro.web-release-composition.build.v1"},
    "launchProductProfile": {"$ref": "#/$defs/digestRef"}, "shellRequirementRefs": {"$ref": "#/$defs/nonEmptyRefSet"},
    "productSurfaceCatalog": {"$ref": "#/$defs/digestRef"}, "surfaceInventory": {"$ref": "#/$defs/digestRef"},
    "webCompositionRegistry": {"$ref": "#/$defs/digestRef"}, "webBuildToolchain": {"$ref": "#/$defs/digestRef"},
    "webBuildMaterialBundle": {"$ref": "#/$defs/digestRef"}, "contractFloor": {"type": "array", "minItems": 1, "maxItems": 128, "items": {"$ref": "#/$defs/contractFloor"}},
    "modelRequirements": {"type": "array", "maxItems": 64, "items": {"$ref": "#/$defs/modelRequirement"}},
    "siteConfig": {"$ref": "#/$defs/digestRef"}, "legalPolicy": {"$ref": "#/$defs/digestRef"},
    "salesPolicy": {"$ref": "#/$defs/digestRef"}, "capabilityAssignment": {"$ref": "#/$defs/digestRef"},
    "issuedAt": {"$ref": "#/$defs/timestamp"}, "candidateAuthorizationEpoch": {"$ref": "#/$defs/decimal"},
    "issuer": {"type": "object", "additionalProperties": false, "required": ["issuerRef", "signingKeyId"], "properties": {"issuerRef": {"$ref": "#/$defs/ref"}, "signingKeyId": {"$ref": "#/$defs/ref"}}}
  },
  "$defs": {
    "ref": {"type": "string", "minLength": 3, "maxLength": 200, "pattern": "^[a-z][a-z0-9]*(?:[._/-][a-z0-9]+)+$"},
    "decimal": {"type": "string", "pattern": "^(?:0|[1-9][0-9]*)$", "maxLength": 39},
    "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "timestamp": {"type": "string", "pattern": "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z$"},
    "digestRef": {"type": "object", "additionalProperties": false, "required": ["ref", "digest"], "properties": {"ref": {"$ref": "#/$defs/ref"}, "digest": {"$ref": "#/$defs/digest"}}},
    "nonEmptyRefSet": {"type": "array", "minItems": 1, "maxItems": 128, "uniqueItems": true, "items": {"$ref": "#/$defs/ref"}},
    "contractFloor": {"type": "object", "additionalProperties": false, "required": ["contractRef", "minimumMajor"], "properties": {"contractRef": {"$ref": "#/$defs/ref"}, "minimumMajor": {"$ref": "#/$defs/decimal"}}},
    "modelRequirement": {"type": "object", "additionalProperties": false, "required": ["modelRoleRef", "modelInventory", "modelCatalog"], "properties": {"modelRoleRef": {"$ref": "#/$defs/ref"}, "modelInventory": {"$ref": "#/$defs/digestRef"}, "modelCatalog": {"$ref": "#/$defs/digestRef"}}},
    "dsseEnvelope": {
      "type": "object", "additionalProperties": false, "required": ["payloadType", "payload", "signatures"],
      "properties": {
        "payloadType": {"const": "application/vnd.kokoro.web-build-intent.v1+json"},
        "payload": {"type": "string", "pattern": "^[A-Za-z0-9+/]+={0,2}$", "maxLength": 1398104},
        "signatures": {"type": "array", "minItems": 1, "maxItems": 8, "items": {"type": "object", "additionalProperties": false, "required": ["keyid", "sig"], "properties": {"keyid": {"$ref": "#/$defs/ref"}, "sig": {"type": "string", "pattern": "^[A-Za-z0-9+/]+={0,2}$", "maxLength": 16384}}}}
      }
    }
  }
}
