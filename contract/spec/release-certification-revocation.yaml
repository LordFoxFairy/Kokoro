{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.dev/release-certification-revocation/v1",
  "title": "Kokoro Release Certification Revocation v1",
  "type": "object", "additionalProperties": false,
  "required": ["contract", "schemaRevision", "revocationRef", "revision", "releaseCertification", "siteReleaseCandidate", "candidateAuthorizationEpoch", "reason", "revokedAt", "producer"],
  "properties": {
    "contract": {"const": "kokoro.release-certification-revocation.v1"}, "schemaRevision": {"const": "1"},
    "revocationRef": {"$ref": "#/$defs/ref"}, "revision": {"$ref": "#/$defs/decimal"}, "releaseCertification": {"$ref": "#/$defs/digestRef"},
    "siteReleaseCandidate": {"$ref": "#/$defs/digestRef"}, "candidateAuthorizationEpoch": {"$ref": "#/$defs/decimal"},
    "reason": {"enum": ["evidence-revoked", "key-revoked", "policy-invalidated", "security-incident", "candidate-revoked"]},
    "revokedAt": {"$ref": "#/$defs/timestamp"}, "producer": {"$ref": "#/$defs/producer"}
  },
  "$defs": {
    "ref": {"type": "string", "minLength": 3, "maxLength": 240, "pattern": "^[a-z][a-z0-9]*(?:[._/-][a-z0-9]+)+$"},
    "decimal": {"type": "string", "pattern": "^(?:0|[1-9][0-9]*)$", "maxLength": 39}, "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "timestamp": {"type": "string", "pattern": "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z$"},
    "digestRef": {"type": "object", "additionalProperties": false, "required": ["ref", "digest"], "properties": {"ref": {"$ref": "#/$defs/ref"}, "digest": {"$ref": "#/$defs/digest"}}},
    "producer": {"type": "object", "additionalProperties": false, "required": ["producerIdentityRef", "trustPolicyRevisionRef", "signingKeyId", "keyVersion", "signatureAudience"], "properties": {"producerIdentityRef": {"$ref": "#/$defs/ref"}, "trustPolicyRevisionRef": {"$ref": "#/$defs/ref"}, "signingKeyId": {"$ref": "#/$defs/ref"}, "keyVersion": {"$ref": "#/$defs/decimal"}, "signatureAudience": {"const": "kokoro.site-release.activation.v1"}}}
  }
}
