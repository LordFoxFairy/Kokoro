# Kokoro storage read-models — the ONE truth for cross-language Mongo document shapes.
#
# session(TS) 与 agent(Python) 共读的持久化文档形状（非 wire 消息）。
# 首个用例：skills 池（hub）——session 创建会话时查池做快照，agent 读写全量。
# 法则：跨语言共读的集合，schema 必须在此单源生成，禁止两侧手写对齐。

enums:
  skill_source: [deploy, upload, github]
  mcp_transport: [http, streamable_http]
  review_status: [pending, approved, rejected]
  dispatch_status: [pending, claimed, expired]

objects:
  # 清单卡片：会话快照与 system prompt 技能清单的最小面。
  - name: SkillCard
    fields:
      - {name: name, type: string_nonempty}
      - {name: description, type: string_nonempty}
      - {name: content_hash, type: string_nonempty}
  - name: SkillFileEntry
    fields:
      - {name: path, type: string_nonempty}
      - {name: size, type: int}
  # skills 集合文档（hub 真源的 Mongo 侧；包体权威源在 S3，见 package_ref）。
  - name: SkillDoc
    fields:
      - {name: scope, type: string_nonempty}          # "official" | <namespace>
      - {name: name, type: string_nonempty}
      - {name: description, type: string_nonempty}
      # SKILL.md 正文快照（当前版快读面；旧版按 content_hash 走 S3 zip 取回）。
      - {name: skill_md, type: string_nonempty}
      - {name: files_manifest, type: array:object:SkillFileEntry}
      - {name: file_count, type: int}
      - {name: package_size, type: int}
      - {name: content_hash, type: string_nonempty}   # 整包 sha256 = 版本标识/内容锁
      - {name: package_ref, type: string_nonempty}    # S3/local 包体键
      - {name: source, type: enum:skill_source}
      - {name: revision, type: int}                   # 文档级 CAS，防并发写半截
      # 运营位与审核(HUB-4;缺省语义=读侧 backfill:weight 0/pinned false/category null/approved)。
      - {name: display_weight, type: int, optional: true}
      - {name: pinned, type: boolean, optional: true}
      - {name: category, type: string_nonempty, optional: true, nullable: true}
      - {name: review_status, type: enum:review_status, optional: true}
      - {name: official_enabled, type: boolean}
      - {name: official_required, type: boolean}      # 恒注入、拒绝用户关闭
      - {name: updated_at, type: int}
      - {name: deleted_at, type: int, optional: true} # 软删=状态位；活跃文档为空

  # per-user 启停偏好（不改共享本体）。
  - name: SkillStateDoc
    fields:
      - {name: namespace, type: string_nonempty}
      - {name: name, type: string_nonempty}
      - {name: enabled, type: boolean}
      - {name: updated_at, type: int}

  # 版本历史(append-only,hub 上传/官方 seed 每次内容变更落一条;回滚=按 hash 取 S3 永存 zip)。
  - name: SkillRevisionDoc
    fields:
      - {name: scope, type: string_nonempty}
      - {name: name, type: string_nonempty}
      - {name: revision, type: int}                   # 落此版时的文档 revision(排序/审计)
      - {name: content_hash, type: string_nonempty}
      - {name: package_size, type: int}
      - {name: source, type: enum:skill_source}
      - {name: created_at, type: int}

  # MCP server 注册表(HUB-3):scope=official|<namespace>,namespace 覆盖 official 同名;
  # secret_ref 只存 env:VAR / secret:path 引用,绝不明文;enabled=文档级启停;软删同 skills。
  - name: McpServerDoc
    fields:
      - {name: scope, type: string_nonempty}
      - {name: name, type: string_nonempty}
      - {name: transport, type: enum:mcp_transport}
      - {name: url, type: string_nonempty}
      - {name: allowed_tools, type: array:string_nonempty}
      - {name: secret_ref, type: string_nonempty, nullable: true}
      - {name: enabled, type: boolean}
      - {name: updated_at, type: int}
      - {name: deleted_at, type: int, nullable: true}

  # 投递竞争单文档 CAS(纲领 D5/R1):session 写 pending+deadline+fence;agent 抢 claimed;
  # 超时方只能把仍 pending 的改 expired。claimed 后终态权归 agent;expired 后迟到帧永不执行。
  - name: RunDispatchDoc
    fields:
      - {name: run_id, type: string_nonempty}
      - {name: session_id, type: string_nonempty}
      - {name: namespace, type: string_nonempty}
      - {name: fence, type: string_nonempty}
      - {name: status, type: enum:dispatch_status}
      - {name: deadline_at, type: int}
      - {name: claimed_by, type: string_nonempty, optional: true, nullable: true}
      - {name: created_at, type: int}
      - {name: updated_at, type: int}

collections:
  skills:
    doc: SkillDoc
    unique: [scope, name]
  skill_state:
    doc: SkillStateDoc
    unique: [namespace, name]
  skill_revisions:
    doc: SkillRevisionDoc
    unique: [scope, name, content_hash]
  mcp_servers:
    doc: McpServerDoc
    unique: [scope, name]
  run_dispatches:
    doc: RunDispatchDoc
    unique: [run_id]

# 会话工作区键（本地目录名 / S3 归档前缀共用约定）：生成双语言 helper 单源，禁止再手拼。
workspace_key_template: "{namespace}:{session_id}"
