# Kokoro transport lifecycle — the ONE truth for stream names and ownership.
#
# Every stream answers "who writes / who reads / who trims / who deletes" once.
# The generated streams mirrors are the ONLY place a `kokoro:` literal may live;
# repo source code carrying that prefix is a CI grep failure.

block_ms: 1000                 # redis XREAD/XREADGROUP block timeout (ms)
consumer_group: kokoro-agent   # agent's XREADGROUP group on the requests stream
event_id_format: "{run_id}:{index}"   # session derives event_id from the agent envelope
lease_key_template: "kokoro:agent:lease:{run_id}"   # RunStateStore TTL lease per run

streams:
  # session writes (XADD maxlen); agent consumes via XREADGROUP + XACK (ack after
  # parse; crash recovery leans on the TTL lease). session never subscribes it.
  requests:
    const: REQUESTS_STREAM
    name: "kokoro:runs:requests"
    maxlen: 10000
    owner: session
    reader: agent
  # agent writes (XADD maxlen); session relay reads; session deletes the stream
  # once the terminal event is persisted.
  run_events:
    fn: run_events_stream
    param: run_id
    template: "kokoro:run:{run_id}:events"
    maxlen: 10000
    owner: agent
    reader: session
  # session writes run.resume/run.cancel; agent (after claiming the run) subscribes
  # and, at terminal, deletes it.
  run_control:
    fn: run_control_stream
    param: run_id
    template: "kokoro:run:{run_id}:control"
    maxlen: 10000
    owner: session
    reader: agent
  # session writes; SSE tail reads. MAXLEN-bounded — DB is the long-term truth.
  live:
    fn: live_stream
    param: session_id
    template: "kokoro:session:{session_id}:live"
    maxlen: 512
    owner: session
    reader: session

# seq: assigned by the session store on first append (per-session monotonic int,
# backend-agnostic). cursor syntax stays sealed inside the transport layer.
