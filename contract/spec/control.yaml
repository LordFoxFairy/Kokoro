# Kokoro control-plane — the ONE truth for inbound run messages.
#
# session -> agent. run.request rides the requests stream; run.resume/run.cancel ride
# the per-run control stream (see streams.yaml). run_id is minted by session; thread_id
# is the LangGraph configurable.thread_id (V1 value == session_id, named only at the
# agent boundary). RuntimeConfig/RuntimeContext are already-resolved config, not Hub
# source data. conversation_id / execution_style / permission_mode are deleted.

enums:
  mcp_transport: [http, streamable_http]
  subagent_create: [deny, ask, allow]
  filesystem_perm: [read_only, workspace_write]
  backend: [state, local_shell, docker, e2b, custom]
  # 装配配方分派键（assembly/<type>.py）：general=对话型对外缺省；studio 类型落地时扩枚举。
  agent_type: [general]
  resume_decision: [approve, edit, reject, respond]

# Reusable nested object shapes (dependency order: leaves first).
objects:
  # 附件/大输入引用等真实需求落地时再进契约（拒绝投机字段；content 即唯一输入）。
  - name: RunInput
    fields:
      - {name: message_id, type: string_nonempty}
      - {name: content, type: string_nonempty}
  - name: ModelConfig
    fields:
      - {name: provider, type: string_nonempty}
      - {name: name, type: string_nonempty}
      - {name: effort, type: string_nonempty, optional: true}
  - name: SkillMount
    fields:
      - {name: name, type: string_nonempty}
      - {name: path, type: string_nonempty}
      - {name: lock, type: string_nonempty}
  - name: McpServer
    fields:
      - {name: name, type: string_nonempty}
      - {name: transport, type: enum:mcp_transport}
      - {name: url, type: string_nonempty}
      - {name: allowed_tools, type: array:string_nonempty}
      - {name: timeout_s, type: int, optional: true}
      # 个人/私有 MCP 的凭据直传（V1 内网）；升级路径=secret 引用+worker 侧解析。
      - {name: headers, type: string_map, optional: true}
  - name: SubagentDef
    fields:
      - {name: name, type: string_nonempty}
      - {name: description, type: string}
      - {name: system_prompt, type: string_nonempty}
      - {name: tools, type: array:string_nonempty}
      - {name: model, type: object:ModelConfig, optional: true}
  - name: Permissions
    fields:
      - {name: approval_tools, type: array:string_nonempty}
      - {name: review_tools, type: array:string_nonempty}
      - {name: subagent_create, type: enum:subagent_create}
      - {name: filesystem, type: enum:filesystem_perm}
  - name: RuntimeConfig
    fields:
      # 类型决定配方与基础工具面（如 ask_user 只属对话型）；entry 是类型下的具名实例。
      - {name: agent_type, type: enum:agent_type}
      - {name: model, type: object:ModelConfig}
      - {name: system_prompt, type: string_nonempty, optional: true}
      - {name: tools, type: array:string_nonempty}
      - {name: skills, type: array:object:SkillMount}
      - {name: mcp, type: array:object:McpServer}
      - {name: subagents, type: array:object:SubagentDef}
      - {name: backend, type: enum:backend}
      - {name: permissions, type: object:Permissions}
      # swarm 成员（对等 handoff 资格，per-entry 配置；配置表后续归 platform 后台管理）。
      # V1 桥语义：成员同时在 subagents 里作层级下属；P2 langgraph-swarm 据此建 handoff 图。
      - {name: swarm_members, type: array:string_nonempty, optional: true}
  # 会话连续性由 thread checkpoint 承担；组织/用户维度等真实 auth 落地再进契约（拒绝投机字段）。
  - name: RuntimeContext
    fields:
      - {name: namespace, type: string_nonempty}
      - {name: session_id, type: string_nonempty}

# Inbound messages, discriminated on `kind`.
messages:
  - kind: run.request
    fields:
      - {name: run_id, type: string_nonempty}
      - {name: thread_id, type: string_nonempty}
      - {name: input, type: object:RunInput}
      - {name: runtime, type: object:RuntimeConfig}
      - {name: context, type: object:RuntimeContext}
      - {name: trace, type: record, optional: true}
  - kind: run.resume
    fields:
      - {name: run_id, type: string_nonempty}
      - {name: thread_id, type: string_nonempty}
      - {name: decisions, type: decision_message_list}
  - kind: run.cancel
    fields:
      - {name: run_id, type: string_nonempty}
      - {name: thread_id, type: string_nonempty}
  - kind: run.steer
    fields:
      - {name: run_id, type: string_nonempty}
      - {name: thread_id, type: string_nonempty}
      - {name: message_id, type: string_nonempty}
      - {name: content, type: string_nonempty}

# ResumeDecision arms, discriminated on `type`.
resume_decisions:
  - type: approve
    fields:
      - {name: tool_id, type: string_nonempty}
      - {name: args, type: record, optional: true}
  - type: edit
    fields:
      - {name: tool_id, type: string_nonempty}
      - {name: args, type: record}
  - type: reject
    fields:
      - {name: tool_id, type: string_nonempty}
      - {name: reason, type: string, optional: true}
  - type: respond
    fields:
      - {name: tool_id, type: string_nonempty}
      - {name: response, type: string_nonempty}

notes:
  run.request.thread_id: "LangGraph configurable.thread_id；V1 取值=session_id，命名只在 agent 边界。"
  run.request.trace: "观测专用（langfuse_trace_id 等），不参与业务；record 直透。"
  run.steer.message_id: "运行中插话（模型轮粒度注入）；幂等键=message_id（keep-first），不打断进行中的工具。"
