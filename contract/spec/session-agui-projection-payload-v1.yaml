{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/session-agui-projection-payload.v1.schema.json",
  "title": "Kokoro Session AG-UI projection payload v1",
  "description": "The complete closed payload projected from one persisted presentation row into one SSE data frame. Its required Session-authored binding authority delta is part of the same digested row and is always a complete replacement or an explicit none decision, never a patch.",
  "type": "object",
  "additionalProperties": false,
  "required": ["profileRevision", "source", "bindingAuthorityDelta", "event"],
  "properties": {
    "profileRevision": {"const": "kokoro-agui-presentation.v1"},
    "source": {
      "type": "object", "additionalProperties": false,
      "required": ["sourceEventId", "sourceKind", "sessionId", "streamEpoch", "durableSeq", "projectionVersion", "schemaRevision", "recordedAt"],
      "properties": {
        "sourceEventId": {"$ref": "#/$defs/publicSourceEventId"}, "sourceKind": {"$ref": "#/$defs/id"},
        "sessionId": {"$ref": "#/$defs/id"}, "streamEpoch": {"$ref": "#/$defs/positiveUint64"},
        "durableSeq": {"$ref": "#/$defs/positiveUint64"}, "projectionVersion": {"$ref": "#/$defs/positiveUint64"},
        "schemaRevision": {"const": 1}, "recordedAt": {"$ref": "#/$defs/dateTime"}
      }
    },
    "presentationRunBindingRef": {"$ref": "#/$defs/id"},
    "presentationMessageBindingRef": {"$ref": "#/$defs/id"},
    "bindingAuthorityDelta": {"$ref": "https://contracts.kokoro.invalid/presentation-binding-authority-delta.v1.schema.json"},
    "event": {"$ref": "https://contracts.kokoro.invalid/kokoro-agui-presentation-event.v1.schema.json"}
  },
  "$defs": {
    "id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "publicSourceEventId": {"type": "string", "minLength": 20, "maxLength": 128, "pattern": "^presentation\\.event:(?![A-Za-z0-9._:-]*agent\\.event)[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "positiveUint64": {"type": "string", "pattern": "^[1-9][0-9]{0,19}$"},
    "dateTime": {"type": "string", "minLength": 20, "maxLength": 35, "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"}
  }
}
