{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/presentation-run-binding.v1.schema.json",
  "title": "Kokoro presentation run binding v1",
  "description": "A complete browser-safe Session-owned presentation Run binding. Agent/internal route refs and private parent topology are forbidden from this wire schema.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "bindingRef", "profileRevision", "sessionId", "presentationThreadId",
    "presentationRunId", "segmentOrdinal", "resumeOfPresentationRunId", "parentLineage", "state",
    "terminalDisposition", "openedBySourceEventId", "terminalSourceEventId", "openedAt", "terminalAt"
  ],
  "properties": {
    "bindingRef": {"$ref": "#/$defs/id"},
    "profileRevision": {"const": "kokoro-agui-presentation.v1"},
    "sessionId": {"$ref": "#/$defs/id"},
    "presentationThreadId": {"$ref": "#/$defs/id"},
    "presentationRunId": {"$ref": "#/$defs/id"},
    "segmentOrdinal": {"type": "integer", "minimum": 0, "maximum": 65535},
    "resumeOfPresentationRunId": {"oneOf": [{"$ref": "#/$defs/id"}, {"type": "null"}]},
    "parentLineage": {
      "type": "object", "additionalProperties": false,
      "required": ["parentPresentationRunId"],
      "properties": {
        "parentPresentationRunId": {"oneOf": [{"$ref": "#/$defs/id"}, {"type": "null"}]}
      }
    },
    "state": {"enum": ["open", "finished", "error"]},
    "terminalDisposition": {"oneOf": [{"enum": ["success", "interrupted", "error", "canceled"]}, {"type": "null"}]},
    "openedBySourceEventId": {"$ref": "#/$defs/id"},
    "terminalSourceEventId": {"oneOf": [{"$ref": "#/$defs/id"}, {"type": "null"}]},
    "openedAt": {"$ref": "#/$defs/dateTime"},
    "terminalAt": {"oneOf": [{"$ref": "#/$defs/dateTime"}, {"type": "null"}]}
  },
  "allOf": [
    {
      "if": {"properties": {"segmentOrdinal": {"const": 0}}, "required": ["segmentOrdinal"]},
      "then": {"properties": {"resumeOfPresentationRunId": {"type": "null"}}},
      "else": {"properties": {"resumeOfPresentationRunId": {"$ref": "#/$defs/id"}}}
    },
    {
      "if": {"properties": {"state": {"const": "open"}}, "required": ["state"]},
      "then": {
        "properties": {
          "terminalDisposition": {"type": "null"}, "terminalSourceEventId": {"type": "null"}, "terminalAt": {"type": "null"}
        }
      },
      "else": {
        "properties": {
          "terminalDisposition": {"enum": ["success", "interrupted", "error", "canceled"]},
          "terminalSourceEventId": {"$ref": "#/$defs/id"}, "terminalAt": {"$ref": "#/$defs/dateTime"}
        }
      }
    }
  ],
  "$defs": {
    "id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "dateTime": {"type": "string", "minLength": 20, "maxLength": 35, "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"}
  }
}
