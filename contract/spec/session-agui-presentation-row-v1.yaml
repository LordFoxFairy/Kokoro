{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.invalid/session-agui-presentation-row.v1.schema.json",
  "title": "Kokoro Session durable AG-UI presentation row v1",
  "description": "The persisted Session-owned row stores the complete closed projection payload, including its owner-authored binding authority delta, and the payload's JCS SHA-256. It can replay one exact durable SSE frame after restart without consulting another payload store.",
  "type": "object",
  "additionalProperties": false,
  "required": ["rowRef", "profileRevision", "cursorProfileRevision", "source", "projectionPayload", "projectionPayloadDigest"],
  "properties": {
    "rowRef": {"$ref": "#/$defs/id"},
    "profileRevision": {"const": "kokoro-agui-presentation.v1"},
    "cursorProfileRevision": {"const": "opaque-session-cursor-v1"},
    "source": {
      "type": "object", "additionalProperties": false,
      "required": ["sourceEventId", "sourceKind", "sessionId", "streamEpoch", "durableSeq", "projectionVersion", "schemaRevision", "recordedAt"],
      "properties": {
        "sourceEventId": {"$ref": "#/$defs/publicSourceEventId"}, "sourceKind": {"$ref": "#/$defs/id"},
        "sessionId": {"$ref": "#/$defs/id"}, "streamEpoch": {"$ref": "#/$defs/positiveUint64"},
        "durableSeq": {"$ref": "#/$defs/positiveUint64"}, "projectionVersion": {"$ref": "#/$defs/positiveUint64"},
        "schemaRevision": {"const": 1}, "recordedAt": {"$ref": "#/$defs/dateTime"}
      }
    },
    "projectionPayload": {"$ref": "https://contracts.kokoro.invalid/session-agui-projection-payload.v1.schema.json"},
    "projectionPayloadDigest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
  },
  "$defs": {
    "id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "publicSourceEventId": {"type": "string", "minLength": 20, "maxLength": 128, "pattern": "^presentation\\.event:(?![A-Za-z0-9._:-]*agent\\.event)[A-Za-z0-9][A-Za-z0-9._:-]*$"},
    "positiveUint64": {
      "type": "string", "minLength": 1, "maxLength": 20,
      "oneOf": [
        {"pattern": "^[1-9][0-9]{0,18}$"}, {"pattern": "^1[0-7][0-9]{18}$"},
        {"pattern": "^18[0-3][0-9]{17}$"}, {"pattern": "^184[0-3][0-9]{16}$"},
        {"pattern": "^1844[0-5][0-9]{15}$"}, {"pattern": "^18446[0-6][0-9]{14}$"},
        {"pattern": "^184467[0-3][0-9]{13}$"}, {"pattern": "^1844674[0-3][0-9]{12}$"},
        {"pattern": "^184467440[0-6][0-9]{10}$"}, {"pattern": "^1844674407[0-2][0-9]{9}$"},
        {"pattern": "^18446744073[0-6][0-9]{8}$"}, {"pattern": "^1844674407370[0-8][0-9]{6}$"},
        {"pattern": "^18446744073709[0-4][0-9]{5}$"}, {"pattern": "^184467440737095[0-4][0-9]{4}$"},
        {"pattern": "^18446744073709550[0-9]{3}$"}, {"pattern": "^18446744073709551[0-5][0-9]{2}$"},
        {"pattern": "^1844674407370955160[0-9]$"}, {"pattern": "^1844674407370955161[0-4]$"},
        {"const": "18446744073709551615"}
      ]
    },
    "dateTime": {"type": "string", "minLength": 20, "maxLength": 35, "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$"}
  }
}
