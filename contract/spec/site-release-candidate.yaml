{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://contracts.kokoro.dev/site-release-candidate/v1",
  "title": "Kokoro Site Release Candidate v1",
  "type": "object", "additionalProperties": false,
  "required": ["contract", "schemaRevision", "candidateRef", "revision", "state", "siteRef", "environment", "candidateAuthorizationEpoch", "launchProductProfile", "productSurfaceCatalog", "businessBindings", "modelRequirements", "createdAt"],
  "properties": {
    "contract": {"const": "kokoro.site-release-candidate.v1"}, "schemaRevision": {"const": "1"},
    "candidateRef": {"$ref": "#/$defs/ref"}, "revision": {"$ref": "#/$defs/decimal"}, "state": {"const": "authorized"},
    "siteRef": {"$ref": "#/$defs/ref"}, "environment": {"enum": ["development", "preview", "staging", "production"]},
    "candidateAuthorizationEpoch": {"$ref": "#/$defs/decimal"}, "launchProductProfile": {"$ref": "#/$defs/digestRef"},
    "productSurfaceCatalog": {"$ref": "#/$defs/digestRef"}, "businessBindings": {"$ref": "#/$defs/businessBindings"},
    "modelRequirements": {"type": "array", "maxItems": 64, "items": {"$ref": "#/$defs/modelRequirement"}}, "createdAt": {"$ref": "#/$defs/timestamp"}
  },
  "$defs": {
    "ref": {"type": "string", "minLength": 3, "maxLength": 200, "pattern": "^[a-z][a-z0-9]*(?:[._/-][a-z0-9]+)+$"},
    "decimal": {"type": "string", "pattern": "^(?:0|[1-9][0-9]*)$", "maxLength": 39}, "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "timestamp": {"type": "string", "pattern": "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z$"},
    "digestRef": {"type": "object", "additionalProperties": false, "required": ["ref", "digest"], "properties": {"ref": {"$ref": "#/$defs/ref"}, "digest": {"$ref": "#/$defs/digest"}}},
    "businessBindings": {"type": "object", "additionalProperties": false, "required": ["webBuildMaterialBundle", "siteConfig", "legalPolicy", "salesPolicy", "capabilityAssignment", "assortmentPolicy", "agentCatalog"], "properties": {"webBuildMaterialBundle": {"$ref": "#/$defs/digestRef"}, "siteConfig": {"$ref": "#/$defs/digestRef"}, "legalPolicy": {"$ref": "#/$defs/digestRef"}, "salesPolicy": {"$ref": "#/$defs/digestRef"}, "capabilityAssignment": {"$ref": "#/$defs/digestRef"}, "assortmentPolicy": {"$ref": "#/$defs/digestRef"}, "agentCatalog": {"$ref": "#/$defs/digestRef"}}},
    "modelRequirement": {"type": "object", "additionalProperties": false, "required": ["modelRoleRef", "modelInventory", "modelCatalog"], "properties": {"modelRoleRef": {"$ref": "#/$defs/ref"}, "modelInventory": {"$ref": "#/$defs/digestRef"}, "modelCatalog": {"$ref": "#/$defs/digestRef"}}}
  }
}
