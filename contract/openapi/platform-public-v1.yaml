        [productContextRef, personalContextRef, actor, projects, defaultProjectRef, contextRevision, issuedAt, expiresAt]
    AcceptedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: &publicCommandId
          type: string
          pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
        requestDigest: &publicRequestDigest
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Server-side keyed audit digest; callers do not compute it from secret inputs.
        observedAt: &publicObservedAt
          type: string
          format: date-time
        state:
          type: string
          const: accepted
        deliveryState:
          type: string
          const: not_applicable
      required: &publicReceiptRequired [commandId, requestDigest, observedAt, state, deliveryState]
    OutcomeUnknownPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: outcome_unknown
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    CommittedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    RejectedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: rejected
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    CommittedDeliveryConsumedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: first_claim_consumed
      required: *publicReceiptRequired
    CommittedDeliverySupersededPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: superseded
      required: *publicReceiptRequired
    PendingCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: pending
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
      required: [kind, retryAfterSeconds]
    CommittedCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: terminal
        outcome:
          type: string
          const: committed
      required: [kind, outcome]
    RejectedCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: terminal
        outcome:
          type: string
          const: rejected
      required: [kind, outcome]
    SupersedingCeremony:
      type: object
      additionalProperties: false
      description: >-
        Safe instruction naming the one new command allowed to consume the caller-held receipt recovery
        capability. The response returns no bearer capability. Its binding digest covers the Site release,
        workload, operation, original command, transaction, and expiry; consumption and orphan
        invalidation are atomic.
      properties:
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        operationId:
          type: string
          enum:
            - createIdentitySession
            - completeSessionMfa
            - refreshIdentitySession
            - beginTotpEnrollment
            - regenerateRecoveryCodes
            - reauthenticateIdentitySession
            - completeAccountRecovery
        bindingDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        expiresAt:
          type: string
          format: date-time
        invalidatesPriorDelivery:
          type: boolean
          const: true
      required:
        - transactionRef
        - operationId
        - bindingDigest
        - expiresAt
        - invalidatesPriorDelivery
    SupersedingCeremonyReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: superseding_ceremony_required
        ceremony:
          $ref: '#/components/schemas/SupersedingCeremony'
      required: [kind, ceremony]
    AcceptedPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/AcceptedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/PendingCommandReconciliation'
      required: [receipt, reconciliation]
    OutcomeUnknownPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/OutcomeUnknownPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/PendingCommandReconciliation'
      required: [receipt, reconciliation]
    CommittedTerminalPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/CommittedCommandReconciliation'
      required: [receipt, reconciliation]
    RejectedTerminalPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/RejectedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/RejectedCommandReconciliation'
      required: [receipt, reconciliation]
    CommittedSupersedingPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedDeliveryConsumedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/SupersedingCeremonyReconciliation'
      required: [receipt, reconciliation]
    CommittedSupersededPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedDeliverySupersededPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/CommittedCommandReconciliation'
      required: [receipt, reconciliation]
    PublicCommandReceiptResponse:
      oneOf:
        - $ref: '#/components/schemas/AcceptedPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/OutcomeUnknownPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedTerminalPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/RejectedTerminalPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedSupersedingPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedSupersededPublicCommandReceiptResponse'
    CreditAmount:
