          minLength: 1
          maxLength: 256
        executionSpaceRef:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        membershipRevision:
          type: string
          minLength: 1
          maxLength: 128
      required: [projectRef, workspaceRef, executionSpaceRef, displayName, membershipRevision]
    PersonalContext:
      type: object
      additionalProperties: false
