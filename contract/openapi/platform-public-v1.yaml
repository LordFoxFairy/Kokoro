openapi: 3.1.0
info:
  title: Kokoro Platform Public API
  version: 1.0.0
  description: >-
    Public BFF contract for independently deployed Site products. Site authority is derived from
    the authenticated workload binding; host names and browser input are never authoritative.
servers:
  - url: https://platform.invalid
security:
  - ProductWorkload: []
paths:
  /v1/product-context:exchange:
    post:
      operationId: exchangeProductContext
      parameters: &mutationParameters
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/CommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductContextExchangeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/registrations:
    post:
      operationId: beginRegistration
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/RegistrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailVerificationTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/verifications/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeEmailVerification
      parameters: &secretMutationParameters
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TransactionSecretRequest'
      responses:
        '200':
          $ref: '#/components/responses/VerificationActivationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/verifications:resend:
    post:
      operationId: resendEmailVerification
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailVerificationTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:
    post:
      operationId: createIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/CreateSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: listIdentitySessions
      parameters: &readParameters
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/IdentitySessionList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions/{id}:verify-mfa:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeSessionMfa
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/SessionMfaCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:refresh:
    post:
      operationId: refreshIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RefreshSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:revoke:
    post:
      operationId: revokeIdentitySessions
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RevokeRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password-resets:
    post:
      operationId: beginPasswordReset
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/PasswordResetTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password-resets/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completePasswordReset
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password:change:
    post:
      operationId: changePassword
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/email-changes:
    post:
      operationId: beginEmailChange
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/EmailChangeStartRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailChangeTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/email-changes/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeEmailChange
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/EmailChangeCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/enroll:
    post:
      operationId: beginTotpEnrollment
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TotpEnrollmentStartRequest'
      responses:
        '200':
          $ref: '#/components/responses/TotpEnrollmentTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/confirm:
    post:
      operationId: confirmTotpEnrollment
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TotpConfirmationRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodeSetResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/disable:
    post:
      operationId: disableTotp
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/OtpRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/recovery-codes:regenerate:
    post:
      operationId: regenerateRecoveryCodes
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RecoveryCodeRegenerationRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodeSetResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/account-recoveries:
    post:
      operationId: beginAccountRecovery
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccountRecoveryTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/account-recoveries/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeAccountRecovery
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RecoveryRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccountRecoveryCompletionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:reauthenticate:
    post:
      operationId: reauthenticateIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/ReauthenticationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReauthenticationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/personal-context:
    get:
      operationId: getPersonalContext
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/PersonalContext'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/commands/{id}/receipt:
    get:
      operationId: getPublicCommandReceipt
      description: >-
        Returns only durable status and a typed recovery action, never a previously delivered
        credential, TOTP seed, recovery code, reauthentication proof, or new bearer capability. The
        caller-generated command id makes the receipt reachable even when the first response contains
        zero response bytes; the lookup does not require the caller to know the server-side request digest.
        An authenticated lookup is restricted to the same caller. Anonymous login, MFA, refresh,
        password-reset, account-recovery, and other secret-delivery lookups present the same
        X-Kokoro-Receipt-Recovery-Capability generated before the original command. Receipt lookup
        does not consume it. Platform verifies its domain-separated hash bound to the workload-derived
        Site, workload binding, purpose, subject generation, transaction, command, and expiry. A later
        superseding command atomically consumes that same capability and invalidates the orphaned
        delivery before producing fresh material. Unknown, consumed-for-supersession, mismatched, or
        conflicting inputs produce the same rate-limited not-found response.
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      responses:
        '200':
          $ref: '#/components/responses/PublicCommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    ProductWorkload:
      type: mutualTLS
      description: Deployment workload identity bound by Platform to one Site release and audience.
    UserSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-platform-session
    ReceiptRecoveryCapability:
      type: apiKey
      in: header
      name: X-Kokoro-Receipt-Recovery-Capability
      description: >-
        caller-generated high-entropy capability created before a secret-bearing or anonymous-completion
        command. Platform stores only a domain-separated hash. A receipt read repeatedly verifies it and
        does not consume it; the new command named by a superseding action atomically consumes the same
        capability while invalidating the orphaned delivery. It never returns in a response body.
  parameters:
    ContractVersion:
      name: Kokoro-Contract-Version
      in: header
      required: true
      schema:
        type: string
        const: '1'
    CommandIdentity:
      name: X-Kokoro-Command-Id
      in: header
      required: true
      description: >-
        Stable caller-generated 128-bit command identity, encoded as lowercase 32-hex or UUIDv7. It
        must not be derived from Idempotency-Key, password, OTP, or request content. Platform owns a
        unique workload/Site/caller/command row and rejects the same command id with a different payload
        using an internal keyed digest; all responses and receipts echo this exact id.
      schema: &commandIdSchema
        type: string
        pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 191
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 512
    TransactionRef:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CommandId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
  headers:
    RequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  requestBodies:
    CommandRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandInput'
    RegistrationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationInput'
    IdentifierRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentifierInput'
    CreateSessionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSessionInput'
    SessionMfaCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionMfaCompletionInput'
    RefreshSessionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshSessionInput'
    OtpRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OtpInput'
    RevokeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevokeInput'
    PasswordRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordInput'
    PasswordChangeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChangeInput'
    RecoveryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryInput'
    TransactionSecretRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionSecretInput'
    TotpConfirmationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpConfirmationInput'
    TotpEnrollmentStartRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpEnrollmentStartInput'
    RecoveryCodeRegenerationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryCodeRegenerationInput'
    EmailChangeStartRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeStartInput'
    EmailChangeCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeCompletionInput'
    ReauthenticationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReauthenticationInput'
  responses:
    ProductContextExchangeResponse:
      description: A Site-release-bound product context.
      headers: &standardResponseHeaders
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductContextExchangeResponse'
    EmailVerificationTransactionResponse:
      description: An email-verification transaction; delivery details are never disclosed.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationTransactionResponse'
    VerificationActivationResponse:
      description: The verified account activation result.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationActivationResponse'
    CreateSessionResponse:
      description: Either an MFA challenge or a newly issued opaque credential pair.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSessionResponse'
    SessionCredentialPairResponse:
      description: A rotated opaque session and refresh credential pair.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionCredentialPairResponse'
    IdentitySessionList:
      description: Caller-scoped device and identity sessions.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentitySessionList'
    CommandReceiptResponse:
      description: An authoritative idempotent command receipt with no replayable secret payload.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandReceiptResponse'
    PasswordResetTransactionResponse:
      description: A non-disclosing password-reset transaction.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetTransactionResponse'
    EmailChangeTransactionResponse:
      description: An email-change verification transaction.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeTransactionResponse'
    TotpEnrollmentTransactionResponse:
      description: A one-time TOTP enrollment secret. It is never recoverable from a receipt.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpEnrollmentTransactionResponse'
    RecoveryCodeSetResponse:
      description: A one-time recovery set. Only hashes are retained by Platform.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryCodeSetResponse'
    AccountRecoveryTransactionResponse:
      description: A non-disclosing account-recovery transaction.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRecoveryTransactionResponse'
    AccountRecoveryCompletionResponse:
      description: >-
        Either a durable password/TOTP-confirmation receipt, a first-claim TOTP replacement seed, or
        a typed instruction to reconcile and supersede a delivery that can no longer be replayed.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRecoveryCompletionResponse'
    ReauthenticationResponse:
      description: A short-lived proof for a sensitive operation.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReauthenticationResponse'
    PersonalContext:
      description: The caller's Site-bound personal workspace, project, and execution space.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalContext'
    PublicCommandReceiptResponse:
      description: A caller-and-digest-bound command receipt without replayable one-time payloads.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicCommandReceiptResponse'
    ErrorResponse:
      description: Stable, non-disclosing Platform error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CommandInput:
      type: object
      additionalProperties: false
      properties:
        commandRef:
          type: string
          maxLength: 128
      required: [commandRef]
    RegistrationInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          minLength: 15
          maxLength: 1024
        legalAcceptanceRefs:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 128
      required: [email, password, legalAcceptanceRefs]
    IdentifierInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
      required: [email]
    CreateSessionInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordLoginInput'
        - $ref: '#/components/schemas/SupersedeSessionCredentialDeliveryInput'
    PasswordLoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          maxLength: 1024
        returnIntentRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_.-]{0,127}$'
          description: Opaque reference resolved only through Platform's registered allowlist.
      required: [email, password]
    SupersedeSessionCredentialDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede_session_delivery
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    SessionMfaCompletionInput:
      oneOf:
        - $ref: '#/components/schemas/CompleteSessionMfaInput'
        - $ref: '#/components/schemas/SupersedeSessionCredentialDeliveryInput'
    CompleteSessionMfaInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [code]
    OtpInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [code]
    RefreshSessionInput:
      oneOf:
        - $ref: '#/components/schemas/RefreshCredentialInput'
        - $ref: '#/components/schemas/SupersedeRefreshCredentialDeliveryInput'
    RefreshCredentialInput:
      type: object
      additionalProperties: false
      properties:
        opaqueCredential:
          type: string
          minLength: 32
          maxLength: 2048
      required: [opaqueCredential]
    SupersedeRefreshCredentialDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede_refresh_delivery
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    RevokeInput:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [current, single, others, all]
        sessionRef:
          type: string
          maxLength: 128
      required: [target]
    PasswordInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          maxLength: 2048
        newPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required: [transactionSecret, newPassword]
    PasswordChangeInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required: [currentPassword, newPassword]
    RecoveryInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordRecoveryCompletionInput'
        - $ref: '#/components/schemas/BeginTotpRecoveryReplacementInput'
        - $ref: '#/components/schemas/ConfirmTotpRecoveryReplacementInput'
        - $ref: '#/components/schemas/SupersedeTotpRecoveryReplacementInput'
    PasswordRecoveryCompletionInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
        proofCode:
          type: string
