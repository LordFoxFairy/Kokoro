      properties:
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
        priorEnrollmentTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
      required:
        - replacementFactor
        - ceremonyAction
        - priorCommandId
        - priorEnrollmentTransactionRef
    TransactionSecretInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
      required: [transactionSecret]
    TotpConfirmationInput:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [transactionRef, code]
    TotpEnrollmentStartInput:
      oneOf:
        - $ref: '#/components/schemas/BeginTotpEnrollmentInput'
        - $ref: '#/components/schemas/SupersedeTotpEnrollmentInput'
    BeginTotpEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        ceremonyAction:
          type: string
          const: begin
      required: [ceremonyAction]
    SupersedeTotpEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        ceremonyAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
        priorTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
      required: [ceremonyAction, priorCommandId, priorTransactionRef]
    RecoveryCodeRegenerationInput:
      oneOf:
        - $ref: '#/components/schemas/RegenerateRecoveryCodesInput'
        - $ref: '#/components/schemas/SupersedeRecoveryCodeSetInput'
    RegenerateRecoveryCodesInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: regenerate
      required: [recoveryAction]
    SupersedeRecoveryCodeSetInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    EmailChangeStartInput:
      type: object
      additionalProperties: false
      properties:
        replacementEmail:
          type: string
          format: email
          maxLength: 191
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
      required: [replacementEmail, reauthenticationProof]
    ChannelChallengeProofInput:
      type: object
      additionalProperties: false
      properties:
        challengeRef:
          type: string
          minLength: 16
          maxLength: 128
        proofSecret:
          type: string
          minLength: 16
          maxLength: 2048
      required: [challengeRef, proofSecret]
    EmailChangeCompletionInput:
      type: object
      additionalProperties: false
      properties:
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
        currentAddressChallenge:
          $ref: '#/components/schemas/ChannelChallengeProofInput'
        replacementAddressChallenge:
          $ref: '#/components/schemas/ChannelChallengeProofInput'
      required:
        - reauthenticationProof
        - currentAddressChallenge
        - replacementAddressChallenge
    ReauthenticationInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordReauthenticationInput'
        - $ref: '#/components/schemas/MfaReauthenticationInput'
        - $ref: '#/components/schemas/SupersedeReauthenticationProofInput'
    PasswordReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: password
        password:
          type: string
          maxLength: 1024
      required: [stage, password]
    MfaReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: mfa
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        proofCode:
          type: string
          minLength: 6
          maxLength: 64
      required: [stage, transactionRef, challengeKind, proofCode]
    SupersedeReauthenticationProofInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
      required: [stage, priorCommandId]
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
        state:
          type: string
          const: committed
        committedAt:
          type: string
          format: date-time
      required: [commandId, requestDigest, receiptRef, state, committedAt]
    CommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
      required: [receipt]
    ProductContext:
      type: object
      additionalProperties: false
      properties:
        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        siteRef:
          type: string
          minLength: 1
          maxLength: 128
        siteReleaseRef:
          type: string
          minLength: 1
          maxLength: 128
        audience:
          type: string
          minLength: 1
          maxLength: 256
        expiresAt:
          type: string
          format: date-time
      required: [productContextRef, siteRef, siteReleaseRef, audience, expiresAt]
    ProductContextExchangeResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        context:
          $ref: '#/components/schemas/ProductContext'
      required: [receipt, context]
    EmailVerificationTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        deliveryState:
          type: string
          enum: [queued, sent, rate_limited]
      required: [transactionRef, expiresAt, deliveryState]
    EmailVerificationTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/EmailVerificationTransaction'
      required: [receipt, transaction]
    VerificationActivationResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        accountRef:
          type: string
          minLength: 1
          maxLength: 128
        personalContextPending:
          type: boolean
      required: [receipt, accountRef, personalContextPending]
    AuthPending:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        expiresAt:
          type: string
          format: date-time
      required: [transactionRef, challengeKind, expiresAt]
    AuthPendingResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        pending:
          $ref: '#/components/schemas/AuthPending'
      required: [receipt, pending]
    SessionCredentialPair:
      type: object
      additionalProperties: false
      properties:
        sessionCredential:
          type: string
          minLength: 32
          maxLength: 2048
        sessionCredentialExpiresAt:
          type: string
          format: date-time
        refreshCredential:
          type: string
          minLength: 32
          maxLength: 2048
        refreshCredentialExpiresAt:
          type: string
          format: date-time
        sessionRef:
          type: string
          minLength: 1
          maxLength: 128
      required:
        [sessionCredential, sessionCredentialExpiresAt, refreshCredential, refreshCredentialExpiresAt, sessionRef]
    OneTimeDeliveryUnavailable:
      type: object
      additionalProperties: false
      description: >-
        Returned by an exact idempotent retry after the first one-time delivery was claimed. The
        previous payload is never replayed; the caller must read the durable receipt and, when
        offered, start the permitted replacement command with the caller-held receipt recovery capability.
      properties:
        kind:
          type: string
          const: delivery_unavailable
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
      required: [kind, commandId, requestDigest, receiptRef]
    OneTimeSessionCredentialDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh command's first successful response claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        credentials:
          $ref: '#/components/schemas/SessionCredentialPair'
      required: [commandId, requestDigest, credentials]
    CreateSessionResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthPendingResponse'
        - $ref: '#/components/schemas/OneTimeSessionCredentialDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    SessionCredentialPairResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeSessionCredentialDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    IdentitySession:
      type: object
      additionalProperties: false
      properties:
        sessionRef:
          type: string
          minLength: 1
          maxLength: 128
        deviceLabel:
          type: string
          maxLength: 128
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
        status:
          type: string
          enum: [active, revoked, expired]
      required: [sessionRef, deviceLabel, createdAt, lastSeenAt, expiresAt, current, status]
    IdentitySessionList:
      type: object
      additionalProperties: false
      properties:
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/IdentitySession'
        revision:
          type: string
          minLength: 1
          maxLength: 128
      required: [sessions, revision]
    PasswordResetTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required: [transactionRef, expiresAt]
    PasswordResetTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/PasswordResetTransaction'
      required: [receipt, transaction]
    EmailChangeTransaction:
      type: object
      additionalProperties: false
      description: >-
        The current-address and replacement-address challenge references are distinct, independently
        hashed/consumed, and must both be confirmed before the primary identifier can change.
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        currentAddressChallengeRef:
          type: string
          minLength: 16
          maxLength: 128
        replacementAddressChallengeRef:
          type: string
          minLength: 16
          maxLength: 128
      required:
        [transactionRef, expiresAt, currentAddressChallengeRef, replacementAddressChallengeRef]
    EmailChangeTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/EmailChangeTransaction'
      required: [receipt, transaction]
    TotpEnrollmentTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        otpauthUri:
          type: string
          minLength: 1
          maxLength: 2048
        manualEntrySecret:
          type: string
          minLength: 16
          maxLength: 256
      required: [transactionRef, expiresAt, otpauthUri, manualEntrySecret]
    TotpEnrollmentTransactionResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeTotpEnrollmentDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    OneTimeTotpEnrollmentDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh enrollment command's first successful response claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        transaction:
          $ref: '#/components/schemas/TotpEnrollmentTransaction'
      required: [commandId, requestDigest, transaction]
    RecoveryCodeSetResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeRecoveryCodeSetDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    OneTimeRecoveryCodeSetDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh code-set command's first successful response claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 8
            maxLength: 64
        generatedAt:
          type: string
          format: date-time
      required: [commandId, requestDigest, recoveryCodes, generatedAt]
    AccountRecoveryTransaction:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        recoveryState:
          type: string
          enum: [proof_required, review_required, ready]
      required: [transactionRef, expiresAt, recoveryState]
    AccountRecoveryTransactionResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        transaction:
          $ref: '#/components/schemas/AccountRecoveryTransaction'
      required: [receipt, transaction]
    OneTimeTotpRecoveryEnrollmentDelivery:
      type: object
      additionalProperties: false
      description: >-
        First-claim replacement ceremony delivery. Recovery does not commit and old factors remain
        authoritative until this pending seed is challenged successfully.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        factorReplacementCapability:
          type: string
          minLength: 32
          maxLength: 2048
        transaction:
          $ref: '#/components/schemas/TotpEnrollmentTransaction'
      required: [commandId, requestDigest, factorReplacementCapability, transaction]
    AccountRecoveryCompletionResponse:
      oneOf:
        - $ref: '#/components/schemas/CommandReceiptResponse'
        - $ref: '#/components/schemas/OneTimeTotpRecoveryEnrollmentDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    ReauthenticationPending:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        expiresAt:
          type: string
          format: date-time
      required: [transactionRef, challengeKind, expiresAt]
    ReauthenticationPendingResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        pending:
          $ref: '#/components/schemas/ReauthenticationPending'
      required: [receipt, pending]
    ReauthenticationProof:
      type: object
      additionalProperties: false
      properties:
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
        sessionRef:
          type: string
          minLength: 16
          maxLength: 128
        userSecurityEpoch:
          type: integer
          format: int64
          minimum: 0
        sessionEpoch:
          type: integer
          format: int64
          minimum: 0
        authStrengthPolicyRevision:
          type: string
          minLength: 1
          maxLength: 128
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - reauthenticationProof
        - sessionRef
        - userSecurityEpoch
        - sessionEpoch
        - authStrengthPolicyRevision
        - issuedAt
        - expiresAt
    OneTimeReauthenticationProofDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh reauthentication command's first successful claim.
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        proof:
          $ref: '#/components/schemas/ReauthenticationProof'
      required: [commandId, requestDigest, proof]
    ReauthenticationResponse:
      oneOf:
        - $ref: '#/components/schemas/ReauthenticationPendingResponse'
        - $ref: '#/components/schemas/OneTimeReauthenticationProofDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    PersonalContext:
      type: object
      additionalProperties: false
      properties:
        workspaceRef:
          type: string
          minLength: 1
          maxLength: 128
        projectRef:
          type: string
          minLength: 1
          maxLength: 128
        executionSpaceRef:
          type: string
          minLength: 1
          maxLength: 128
        contextRevision:
          type: string
          minLength: 1
          maxLength: 128
      required: [workspaceRef, projectRef, executionSpaceRef, contextRevision]
    AcceptedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: &publicCommandId
          type: string
          pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
        requestDigest: &publicRequestDigest
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Server-side keyed audit digest; callers do not compute it from secret inputs.
        observedAt: &publicObservedAt
          type: string
          format: date-time
        state:
          type: string
          const: accepted
        deliveryState:
          type: string
          const: not_applicable
      required: &publicReceiptRequired [commandId, requestDigest, observedAt, state, deliveryState]
    OutcomeUnknownPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: outcome_unknown
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    CommittedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    RejectedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: rejected
        deliveryState:
          type: string
          const: not_applicable
      required: *publicReceiptRequired
    CommittedDeliveryConsumedPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: first_claim_consumed
      required: *publicReceiptRequired
    CommittedDeliverySupersededPublicCommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *publicCommandId
        requestDigest: *publicRequestDigest
        observedAt: *publicObservedAt
        state:
          type: string
          const: committed
        deliveryState:
          type: string
          const: superseded
      required: *publicReceiptRequired
    PendingCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: pending
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
      required: [kind, retryAfterSeconds]
    CommittedCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: terminal
        outcome:
          type: string
          const: committed
      required: [kind, outcome]
    RejectedCommandReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: terminal
        outcome:
          type: string
          const: rejected
      required: [kind, outcome]
    SupersedingCeremony:
      type: object
      additionalProperties: false
      description: >-
        Safe instruction naming the one new command allowed to consume the caller-held receipt recovery
        capability. The response returns no bearer capability. Its binding digest covers the Site release,
        workload, operation, original command, transaction, and expiry; consumption and orphan
        invalidation are atomic.
      properties:
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        operationId:
          type: string
          enum:
            - createIdentitySession
            - completeSessionMfa
            - refreshIdentitySession
            - beginTotpEnrollment
            - regenerateRecoveryCodes
            - reauthenticateIdentitySession
            - completeAccountRecovery
        bindingDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        expiresAt:
          type: string
          format: date-time
        invalidatesPriorDelivery:
          type: boolean
          const: true
      required:
        - transactionRef
        - operationId
        - bindingDigest
        - expiresAt
        - invalidatesPriorDelivery
    SupersedingCeremonyReconciliation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: superseding_ceremony_required
        ceremony:
          $ref: '#/components/schemas/SupersedingCeremony'
      required: [kind, ceremony]
    AcceptedPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/AcceptedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/PendingCommandReconciliation'
      required: [receipt, reconciliation]
    OutcomeUnknownPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/OutcomeUnknownPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/PendingCommandReconciliation'
      required: [receipt, reconciliation]
    CommittedTerminalPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/CommittedCommandReconciliation'
      required: [receipt, reconciliation]
    RejectedTerminalPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/RejectedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/RejectedCommandReconciliation'
      required: [receipt, reconciliation]
    CommittedSupersedingPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedDeliveryConsumedPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/SupersedingCeremonyReconciliation'
      required: [receipt, reconciliation]
    CommittedSupersededPublicCommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommittedDeliverySupersededPublicCommandReceipt'
        reconciliation:
          $ref: '#/components/schemas/CommittedCommandReconciliation'
      required: [receipt, reconciliation]
    PublicCommandReceiptResponse:
      oneOf:
        - $ref: '#/components/schemas/AcceptedPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/OutcomeUnknownPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedTerminalPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/RejectedTerminalPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedSupersedingPublicCommandReceiptResponse'
        - $ref: '#/components/schemas/CommittedSupersededPublicCommandReceiptResponse'
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - CONTRACT_VERSION_UNSUPPORTED
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_FAILED
        - AUTH_TRANSACTION_EXPIRED
        - MFA_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - RISK_UNAVAILABLE
        - SITE_UNAVAILABLE
        - OUTCOME_UNKNOWN
        - INTERNAL_UNAVAILABLE
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        retryClass:
          type: string
          enum: [never, after_delay, same_identity, reconcile_receipt]
        requestId:
          type: string
          maxLength: 128
        correlationId:
          type: string
          maxLength: 128
        safeMessage:
          type: string
          maxLength: 512
        receiptRef:
          type: string
          maxLength: 256
      required: [code, retryClass, requestId, correlationId, safeMessage]
