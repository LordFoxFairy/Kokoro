    RecoveryCodeSetResponse:
      oneOf:
        - $ref: '#/components/schemas/OneTimeRecoveryCodeSetDelivery'
        - $ref: '#/components/schemas/OneTimeDeliveryUnavailable'
    OneTimeRecoveryCodeSetDelivery:
      type: object
      additionalProperties: false
      description: Available only on the fresh code-set command's first successful response claim.
