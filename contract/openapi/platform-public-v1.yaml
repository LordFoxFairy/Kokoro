        - sessionContractRevision
        - projectRef
        - subjectRef
        - subjectGeneration
        - identitySessionRef
        - issuer
        - keyRevision
        - notBefore
        - siteSecurityEpoch
        - identitySessionEpoch
        - membershipEpoch
        - authorizationEpoch
        - restrictionEpoch
        - credentialEpoch
        - policyEpoch
        - revocationEpoch
        - resource
        - issuedAt
        - expiresAt
    SessionAccessGrant:
      type: object
