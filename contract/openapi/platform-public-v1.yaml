        entitlementTemplateRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        capabilityKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
        safeLabel:
          type: string
          minLength: 1
          maxLength: 160
        expiresAt:
          type: [string, 'null']
          format: date-time
      required: [entitlementTemplateRevisionRef, capabilityKey, safeLabel, expiresAt]
    RedemptionPreview:
      type: object
      additionalProperties: false
      properties:
        previewRef:
          type: string
          minLength: 1
          maxLength: 256
        previewCredential:
          type: string
          minLength: 32
          maxLength: 4096
          pattern: '^\S+$'
        previewDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        productRef:
          type: string
          minLength: 1
          maxLength: 256
        productVersionRef:
          type: string
          minLength: 1
          maxLength: 256
        productKind:
          type: string
          enum: [free, credit_pack, subscription, bundle]
        safeProductLabel:
          type: string
          minLength: 1
          maxLength: 160
        planRef:
          type: [string, 'null']
          maxLength: 256
        planVersionRef:
          type: [string, 'null']
          maxLength: 256
        safePlanLabel:
          type: [string, 'null']
          maxLength: 160
        term:
          $ref: '#/components/schemas/RedemptionTermPreview'
        credits:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RedemptionCreditPreview'
        entitlements:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/RedemptionEntitlementPreview'
        legalTermRefs:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required:
        - previewRef
        - previewCredential
        - previewDigest
        - productRef
        - productVersionRef
        - productKind
        - safeProductLabel
        - planRef
        - planVersionRef
        - safePlanLabel
        - term
        - credits
        - entitlements
        - legalTermRefs
        - expiresAt
    RedemptionPreviewResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        preview:
          $ref: '#/components/schemas/RedemptionPreview'
      required: [receipt, preview]
    RedemptionCommandCursor:
      type: object
      additionalProperties: false
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
        receivedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [commandId, requestDigest, receiptRef, receivedAt, updatedAt]
    RedemptionCommandPendingResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [accepted, executing, outcome_unknown]
        command:
          $ref: '#/components/schemas/RedemptionCommandCursor'
        retryAfter:
          type: string
          format: date-time
      required: [kind, command, retryAfter]
    RedemptionCommandReviewResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: review_required
        command:
          $ref: '#/components/schemas/RedemptionCommandCursor'
        attemptRef:
          type: string
          minLength: 1
          maxLength: 256
        caseRef:
          type: string
          minLength: 1
          maxLength: 256
        reviewExpiresAt:
          type: string
          format: date-time
      required: [kind, command, attemptRef, caseRef, reviewExpiresAt]
    RedemptionOutputRef:
      type: object
      additionalProperties: false
      properties:
        outputLineId:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum: [subscription_term, entitlement_grant, credit_grant]
        resourceRef:
          type: string
          minLength: 1
          maxLength: 256
        templateRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
      required: [outputLineId, kind, resourceRef, templateRevisionRef]
    RedemptionReceipt:
      type: object
      additionalProperties: false
      properties:
        redemptionId: *redemptionIdSchema
        commandId: *commandIdSchema
        state:
          type: string
          enum: [fulfilled, reversed, reconciliation_required]
        productRef:
          type: string
          minLength: 1
          maxLength: 256
        productVersionRef:
          type: string
          minLength: 1
          maxLength: 256
        planRef:
          type: [string, 'null']
          maxLength: 256
        planVersionRef:
          type: [string, 'null']
          maxLength: 256
        safeCodeFingerprint:
          type: string
          pattern: '^[A-Z0-9-]{4,32}$'
        fulfillmentRef:
          type: string
          minLength: 1
          maxLength: 256
        outputSetDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        outputs:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/RedemptionOutputRef'
        redeemedAt:
          type: string
          format: date-time
        stateObservedAt:
          type: string
          format: date-time
        reversalRefs:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
      required:
        - redemptionId
        - commandId
        - state
        - productRef
        - productVersionRef
        - planRef
        - planVersionRef
        - safeCodeFingerprint
        - fulfillmentRef
        - outputSetDigest
        - outputs
        - redeemedAt
        - stateObservedAt
        - reversalRefs
    RedemptionCommandSucceededResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: succeeded
        command:
          $ref: '#/components/schemas/RedemptionCommandCursor'
        redemption:
          $ref: '#/components/schemas/RedemptionReceipt'
      required: [kind, command, redemption]
    RedemptionRejection:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [REDEEM_NOT_ACCEPTED, REDEEM_TEMPORARILY_UNAVAILABLE]
        retryClass:
          type: string
          enum: [never, after_delay, after_user_action]
        retryAfter:
          type: [string, 'null']
          format: date-time
      required: [code, retryClass, retryAfter]
    RedemptionCommandRejectedResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: rejected
        command:
          $ref: '#/components/schemas/RedemptionCommandCursor'
        rejection:
          $ref: '#/components/schemas/RedemptionRejection'
      required: [kind, command, rejection]
    RedemptionCommandResponse:
      oneOf:
        - $ref: '#/components/schemas/RedemptionCommandPendingResponse'
        - $ref: '#/components/schemas/RedemptionCommandReviewResponse'
        - $ref: '#/components/schemas/RedemptionCommandSucceededResponse'
        - $ref: '#/components/schemas/RedemptionCommandRejectedResponse'
    RedemptionReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        redemption:
          $ref: '#/components/schemas/RedemptionReceipt'
      required: [redemption]
    AcquisitionSourceSummary:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [redemption, admin_grant, program_window]
        sourceRef:
          type: string
          minLength: 1
          maxLength: 256
        acquiredAt:
          type: string
          format: date-time
      required: [kind, sourceRef, acquiredAt]
    AccountPlanSummary:
      type: object
      additionalProperties: false
      properties:
        planRef:
          type: string
          minLength: 1
          maxLength: 256
        planVersionRef:
          type: string
          minLength: 1
          maxLength: 256
        safeLabel:
          type: string
          minLength: 1
          maxLength: 160
        automaticRenewal:
          type: boolean
          const: false
      required: [planRef, planVersionRef, safeLabel, automaticRenewal]
    AccountEntitlementSummary:
      type: object
      additionalProperties: false
      properties:
        entitlementGrantRef:
          type: string
          minLength: 1
          maxLength: 256
        capabilityKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
        safeLabel:
          type: string
          minLength: 1
          maxLength: 160
        state:
          type: string
          enum: [active, expired, revoked]
        expiresAt:
          type: [string, 'null']
          format: date-time
      required: [entitlementGrantRef, capabilityKey, safeLabel, state, expiresAt]
    AccountProduct:
      type: object
      additionalProperties: false
      properties:
        productRef:
          type: string
          minLength: 1
          maxLength: 256
        productVersionRef:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [free, credit_pack, subscription, bundle]
        safeLabel:
          type: string
          minLength: 1
          maxLength: 160
        state:
          type: string
          enum: [active, expired, revoked]
        source:
          $ref: '#/components/schemas/AcquisitionSourceSummary'
        plan:
          oneOf:
            - $ref: '#/components/schemas/AccountPlanSummary'
            - type: 'null'
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        entitlements:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/AccountEntitlementSummary'
        creditGrantRefs:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
      required:
        - productRef
        - productVersionRef
        - kind
        - safeLabel
        - state
        - source
        - plan
        - effectiveAt
        - expiresAt
        - entitlements
        - creditGrantRefs
    AccountProductsResponse:
      type: object
      additionalProperties: false
      properties:
        products:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/AccountProduct'
        freshness:
          $ref: '#/components/schemas/ProjectionFreshness'
      required: [products, freshness]
    CreditBucketSummary:
      type: object
      additionalProperties: false
      properties:
        bucketClass:
          type: string
          enum: [daily, period, permanent]
        grantCount:
          type: integer
          minimum: 0
        issued:
          $ref: '#/components/schemas/CreditAmount'
        available:
          $ref: '#/components/schemas/CreditAmount'
        held:
          $ref: '#/components/schemas/CreditAmount'
        consumed:
          $ref: '#/components/schemas/CreditAmount'
        expiredOrReversed:
          $ref: '#/components/schemas/CreditAmount'
      required: [bucketClass, grantCount, issued, available, held, consumed, expiredOrReversed]
    CreditUnitSummary:
      type: object
      additionalProperties: false
      properties:
        unit:
          type: string
          minLength: 1
          maxLength: 64
        buckets:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/CreditBucketSummary'
      required: [unit, buckets]
    CreditSummaryResponse:
      type: object
      additionalProperties: false
      properties:
        units:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/CreditUnitSummary'
        activeHoldCount:
          type: integer
          minimum: 0
        freshness:
          $ref: '#/components/schemas/ProjectionFreshness'
      required: [units, activeHoldCount, freshness]
    CreditGrantDetail:
      type: object
      additionalProperties: false
      properties:
        grantId: *creditGrantIdSchema
        creditProgramRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        source:
          $ref: '#/components/schemas/AcquisitionSourceSummary'
        bucketClass:
          type: string
          enum: [daily, period, permanent]
        unit:
          type: string
          minLength: 1
          maxLength: 64
        state:
          type: string
          enum: [active, exhausted, expired, reversed]
        issued:
          $ref: '#/components/schemas/CreditAmount'
        available:
          $ref: '#/components/schemas/CreditAmount'
        held:
          $ref: '#/components/schemas/CreditAmount'
        consumed:
          $ref: '#/components/schemas/CreditAmount'
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
      required:
        - grantId
        - creditProgramRevisionRef
        - source
        - bucketClass
        - unit
        - state
        - issued
        - available
        - held
        - consumed
        - effectiveAt
        - expiresAt
    CreditGrantResponse:
      type: object
      additionalProperties: false
      properties:
        grant:
          $ref: '#/components/schemas/CreditGrantDetail'
        freshness:
          $ref: '#/components/schemas/ProjectionFreshness'
      required: [grant, freshness]
    UsageCreditAllocation:
      type: object
      additionalProperties: false
      properties:
        creditGrantId: *creditGrantIdSchema
        amount:
          $ref: '#/components/schemas/CreditAmount'
        journalReceiptRef:
          type: string
          minLength: 1
          maxLength: 256
      required: [creditGrantId, amount, journalReceiptRef]
    UsageDetail:
      type: object
      additionalProperties: false
      properties:
        usageId: *usageIdSchema
        runRef:
          type: string
          minLength: 1
          maxLength: 256
        executionBudgetRootRef:
          type: string
          minLength: 1
          maxLength: 256
        unit:
          type: string
          minLength: 1
          maxLength: 64
        state:
          type: string
          enum: [reserved, rated, settled, reversed, reconciliation_required]
        estimatedAmount:
          $ref: '#/components/schemas/CreditAmount'
        ratedAmount:
          oneOf:
            - $ref: '#/components/schemas/CreditAmount'
            - type: 'null'
        allocations:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/UsageCreditAllocation'
        occurredAt:
          type: string
          format: date-time
        settledAt:
          type: [string, 'null']
          format: date-time
      required:
        - usageId
        - runRef
        - executionBudgetRootRef
        - unit
        - state
        - estimatedAmount
        - ratedAmount
        - allocations
        - occurredAt
        - settledAt
    UsageDetailResponse:
      type: object
      additionalProperties: false
      properties:
        usage:
          $ref: '#/components/schemas/UsageDetail'
        freshness:
          $ref: '#/components/schemas/ProjectionFreshness'
      required: [usage, freshness]
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - CONTRACT_VERSION_UNSUPPORTED
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_FAILED
        - AUTH_TRANSACTION_EXPIRED
        - MFA_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - RISK_UNAVAILABLE
        - SITE_UNAVAILABLE
        - OUTCOME_UNKNOWN
        - INTERNAL_UNAVAILABLE
        - REDEEM_NOT_ACCEPTED
        - REDEEM_TEMPORARILY_UNAVAILABLE
        - IDEMPOTENCY_CONFLICT
        - ACQUISITION_CHANNEL_DISABLED
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        retryClass:
          type: string
          enum: [never, after_delay, after_user_action, same_identity, reconcile_receipt]
        requestId:
          type: string
          maxLength: 128
        correlationId:
          type: string
          maxLength: 128
        safeMessage:
          type: string
          maxLength: 512
        receiptRef:
          type: string
          maxLength: 256
      required: [code, retryClass, requestId, correlationId, safeMessage]
