openapi: 3.1.0
info:
  title: Kokoro Platform Public API
  version: 1.0.0
  description: >-
    Public BFF contract for independently deployed Site products. Site authority is derived from
    the authenticated workload binding; host names and browser input are never authoritative.
servers:
  - url: https://platform.invalid
security:
  - ProductWorkload: []
paths:
  /v1/product-context:exchange:
    post:
      operationId: exchangeProductContext
      parameters: &mutationParameters
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/CommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductContextExchangeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/session-access-grants:
    post:
      operationId: issueSessionAccessGrant
      description: >-
        Issues a short-lived, purpose-specific credential for the registered Session service. The
        authenticated workload and UserSession are authoritative; Site, release, deployment,
        artifact, subject, and generation are resolved by Platform and cannot be supplied by a
        browser. A retry may issue another independently revocable grant and therefore callers must
        never treat the credential as an idempotent command response.
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/SessionAccessGrantRequest'
      responses:
        '201':
          $ref: '#/components/responses/SessionAccessGrantResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/registrations:
    post:
      operationId: beginRegistration
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/RegistrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailVerificationTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/verifications/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeEmailVerification
      parameters: &secretMutationParameters
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/CommandIdentity'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TransactionSecretRequest'
      responses:
        '200':
          $ref: '#/components/responses/VerificationActivationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/verifications:resend:
    post:
      operationId: resendEmailVerification
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailVerificationTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:
    post:
      operationId: createIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/CreateSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: listIdentitySessions
      parameters: &readParameters
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/IdentitySessionList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions/{id}:verify-mfa:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeSessionMfa
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/SessionMfaCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:refresh:
    post:
      operationId: refreshIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RefreshSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:revoke:
    post:
      operationId: revokeIdentitySessions
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RevokeRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password-resets:
    post:
      operationId: beginPasswordReset
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/PasswordResetTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password-resets/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completePasswordReset
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/password:change:
    post:
      operationId: changePassword
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/email-changes:
    post:
      operationId: beginEmailChange
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/EmailChangeStartRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmailChangeTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/email-changes/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeEmailChange
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/EmailChangeCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCredentialPairResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/enroll:
    post:
      operationId: beginTotpEnrollment
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TotpEnrollmentStartRequest'
      responses:
        '200':
          $ref: '#/components/responses/TotpEnrollmentTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/confirm:
    post:
      operationId: confirmTotpEnrollment
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/TotpConfirmationRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodeSetResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/totp/disable:
    post:
      operationId: disableTotp
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/OtpRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/recovery-codes:regenerate:
    post:
      operationId: regenerateRecoveryCodes
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RecoveryCodeRegenerationRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodeSetResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/account-recoveries:
    post:
      operationId: beginAccountRecovery
      parameters: *mutationParameters
      requestBody:
        $ref: '#/components/requestBodies/IdentifierRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccountRecoveryTransactionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/account-recoveries/{id}:complete:
    parameters:
      - $ref: '#/components/parameters/TransactionRef'
    post:
      operationId: completeAccountRecovery
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/RecoveryRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccountRecoveryCompletionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/identity/sessions:reauthenticate:
    post:
      operationId: reauthenticateIdentitySession
      parameters: *secretMutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
          ReceiptRecoveryCapability: []
      requestBody:
        $ref: '#/components/requestBodies/ReauthenticationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReauthenticationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/personal-context:
    get:
      operationId: getPersonalContext
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/PersonalContext'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemptions:preview:
    post:
      operationId: previewRedemption
      description: >-
        Resolves a redeem Code without claiming or reserving it. Platform derives Site and
        BillingAccount authority from the authenticated workload and user session. The response
        contains only a short-lived opaque preview credential and safe immutable product terms;
        it never echoes the Code or exposes inventory, HMAC, Batch, or lookup facts.
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RedemptionPreviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/RedemptionPreviewResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemptions:confirm:
    post:
      operationId: confirmRedemption
      description: >-
        Atomically claims the Code represented by a live preview credential and executes the
        frozen Fulfillment output plan. The same command identity and idempotency key always
        recover the same result; a different payload conflicts before any business lock or effect.
        Platform revalidates every live Site, Program, Batch, Code, account, risk, and stacking fact
        at the effect point and never creates a Payment acquisition.
      parameters: *mutationParameters
      security:
        - ProductWorkload: []
          UserSession: []
      requestBody:
        $ref: '#/components/requestBodies/RedemptionConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/RedemptionCommandResponse'
        '202':
          $ref: '#/components/responses/RedemptionCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemption-commands:recover:
    get:
      operationId: recoverRedemptionCommand
      description: >-
        Recovers the caller's durable redemption command by the exact Idempotency-Key after a lost
        or unknown HTTP response. Unknown, cross-Site, cross-subject, stale-generation, or
        mismatched commands are indistinguishable. The operation never replays a Code or preview
        credential.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/RedemptionCommandResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/redemptions/{id}:
    get:
      operationId: getRedemptionReceipt
      description: >-
        Returns the authenticated subject's immutable redemption and Fulfillment receipt. It uses
        safe display facts and source references only; Code material and internal inventory facts
        are never returned.
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/RedemptionReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/products:
    get:
      operationId: listAccountProducts
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/AccountProductsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/credits:
    get:
      operationId: getCreditSummary
      parameters: *readParameters
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/CreditSummaryResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/credit-grants/{id}:
    get:
      operationId: getCreditGrant
      parameters:
        - $ref: '#/components/parameters/CreditGrantId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/CreditGrantResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/usage/{id}:
    get:
      operationId: getUsageDetail
      parameters:
        - $ref: '#/components/parameters/UsageId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
      responses:
        '200':
          $ref: '#/components/responses/UsageDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/commands/{id}/receipt:
    get:
      operationId: getPublicCommandReceipt
      description: >-
        Returns only durable status and a typed recovery action, never a previously delivered
        credential, TOTP seed, recovery code, reauthentication proof, or new bearer capability. The
        caller-generated command id makes the receipt reachable even when the first response contains
        zero response bytes; the lookup does not require the caller to know the server-side request digest.
        An authenticated lookup is restricted to the same caller. Anonymous login, MFA, refresh,
        password-reset, account-recovery, and other secret-delivery lookups present the same
        X-Kokoro-Receipt-Recovery-Capability generated before the original command. Receipt lookup
        does not consume it. Platform verifies its domain-separated hash bound to the workload-derived
        Site, workload binding, purpose, subject generation, transaction, command, and expiry. A later
        superseding command atomically consumes that same capability and invalidates the orphaned
        delivery before producing fresh material. Unknown, consumed-for-supersession, mismatched, or
        conflicting inputs produce the same rate-limited not-found response.
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/ContractVersion'
      security:
        - ProductWorkload: []
          UserSession: []
        - ProductWorkload: []
          ReceiptRecoveryCapability: []
      responses:
        '200':
          $ref: '#/components/responses/PublicCommandReceiptResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    ProductWorkload:
      type: mutualTLS
      description: Deployment workload identity bound by Platform to one Site release and audience.
    UserSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-platform-session
    ReceiptRecoveryCapability:
      type: apiKey
      in: header
      name: X-Kokoro-Receipt-Recovery-Capability
      description: >-
        caller-generated high-entropy capability created before a secret-bearing or anonymous-completion
        command. Platform stores only a domain-separated hash. A receipt read repeatedly verifies it and
        does not consume it; the new command named by a superseding action atomically consumes the same
        capability while invalidating the orphaned delivery. It never returns in a response body.
  parameters:
    ContractVersion:
      name: Kokoro-Contract-Version
      in: header
      required: true
      schema:
        type: string
        const: '1'
    CommandIdentity:
      name: X-Kokoro-Command-Id
      in: header
      required: true
      description: >-
        Stable caller-generated 128-bit command identity, encoded as lowercase 32-hex or UUIDv7. It
        must not be derived from Idempotency-Key, password, OTP, or request content. Platform owns a
        unique workload/Site/caller/command row and rejects the same command id with a different payload
        using an internal keyed digest; all responses and receipts echo this exact id.
      schema: &commandIdSchema
        type: string
        pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 191
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 512
    TransactionRef:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CommandId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
    RedemptionId:
      name: id
      in: path
      required: true
      schema: &redemptionIdSchema
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    CreditGrantId:
      name: id
      in: path
      required: true
      schema: &creditGrantIdSchema
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UsageId:
      name: id
      in: path
      required: true
      schema: &usageIdSchema
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  headers:
    RequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  requestBodies:
    CommandRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandInput'
    RegistrationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationInput'
    IdentifierRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentifierInput'
    CreateSessionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSessionInput'
    SessionMfaCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionMfaCompletionInput'
    RefreshSessionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshSessionInput'
    OtpRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OtpInput'
    RevokeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevokeInput'
    PasswordRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordInput'
    PasswordChangeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChangeInput'
    RecoveryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryInput'
    TransactionSecretRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionSecretInput'
    TotpConfirmationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpConfirmationInput'
    TotpEnrollmentStartRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpEnrollmentStartInput'
    RecoveryCodeRegenerationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryCodeRegenerationInput'
    EmailChangeStartRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeStartInput'
    EmailChangeCompletionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeCompletionInput'
    ReauthenticationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReauthenticationInput'
    SessionAccessGrantRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionAccessGrantInput'
    RedemptionPreviewRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedemptionPreviewInput'
    RedemptionConfirmRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedemptionConfirmInput'
  responses:
    ProductContextExchangeResponse:
      description: A Site-release-bound product context.
      headers: &standardResponseHeaders
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductContextExchangeResponse'
    SessionAccessGrantResponse:
      description: A non-cacheable, short-lived Session credential bound to the exact product and subject context.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionAccessGrantResponse'
    EmailVerificationTransactionResponse:
      description: An email-verification transaction; delivery details are never disclosed.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationTransactionResponse'
    VerificationActivationResponse:
      description: The verified account activation result.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationActivationResponse'
    CreateSessionResponse:
      description: Either an MFA challenge or a newly issued opaque credential pair.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSessionResponse'
    SessionCredentialPairResponse:
      description: A rotated opaque session and refresh credential pair.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionCredentialPairResponse'
    IdentitySessionList:
      description: Caller-scoped device and identity sessions.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentitySessionList'
    CommandReceiptResponse:
      description: An authoritative idempotent command receipt with no replayable secret payload.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandReceiptResponse'
    PasswordResetTransactionResponse:
      description: A non-disclosing password-reset transaction.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetTransactionResponse'
    EmailChangeTransactionResponse:
      description: An email-change verification transaction.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeTransactionResponse'
    TotpEnrollmentTransactionResponse:
      description: A one-time TOTP enrollment secret. It is never recoverable from a receipt.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpEnrollmentTransactionResponse'
    RecoveryCodeSetResponse:
      description: A one-time recovery set. Only hashes are retained by Platform.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryCodeSetResponse'
    AccountRecoveryTransactionResponse:
      description: A non-disclosing account-recovery transaction.
      headers: *standardResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRecoveryTransactionResponse'
    AccountRecoveryCompletionResponse:
      description: >-
        Either a durable password/TOTP-confirmation receipt, a first-claim TOTP replacement seed, or
        a typed instruction to reconcile and supersede a delivery that can no longer be replayed.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountRecoveryCompletionResponse'
    ReauthenticationResponse:
      description: A short-lived proof for a sensitive operation.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReauthenticationResponse'
    PersonalContext:
      description: The caller's Site-bound personal workspace, project, and execution space.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalContext'
    PublicCommandReceiptResponse:
      description: A caller-and-digest-bound command receipt without replayable one-time payloads.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicCommandReceiptResponse'
    RedemptionPreviewResponse:
      description: Safe, non-binding redemption terms and a short-lived opaque preview credential.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedemptionPreviewResponse'
    RedemptionCommandResponse:
      description: The current durable state of one authenticated redemption command.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedemptionCommandResponse'
    RedemptionReceiptResponse:
      description: An immutable safe redemption and Fulfillment receipt.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedemptionReceiptResponse'
    AccountProductsResponse:
      description: Effective products, subscriptions, and entitlements for the authenticated account.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountProductsResponse'
    CreditSummaryResponse:
      description: Rebuildable credit projection over immutable grants, journal entries, and holds.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditSummaryResponse'
    CreditGrantResponse:
      description: Safe source and balance details for one authenticated account CreditGrant.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditGrantResponse'
    UsageDetailResponse:
      description: Rated usage and allocation lineage without provider credentials or GA internals.
      headers:
        <<: *standardResponseHeaders
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsageDetailResponse'
    ErrorResponse:
      description: Stable, non-disclosing Platform error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CommandInput:
      type: object
      additionalProperties: false
      properties:
        commandRef:
          type: string
          maxLength: 128
      required: [commandRef]
    RegistrationInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          minLength: 15
          maxLength: 1024
        legalAcceptanceRefs:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 128
      required: [email, password, legalAcceptanceRefs]
    IdentifierInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
      required: [email]
    CreateSessionInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordLoginInput'
        - $ref: '#/components/schemas/SupersedeSessionCredentialDeliveryInput'
    PasswordLoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 191
        password:
          type: string
          maxLength: 1024
        returnIntentRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_.-]{0,127}$'
          description: Opaque reference resolved only through Platform's registered allowlist.
      required: [email, password]
    SupersedeSessionCredentialDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede_session_delivery
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    SessionMfaCompletionInput:
      oneOf:
        - $ref: '#/components/schemas/CompleteSessionMfaInput'
        - $ref: '#/components/schemas/SupersedeSessionCredentialDeliveryInput'
    CompleteSessionMfaInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [code]
    OtpInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [code]
    RefreshSessionInput:
      oneOf:
        - $ref: '#/components/schemas/RefreshCredentialInput'
        - $ref: '#/components/schemas/SupersedeRefreshCredentialDeliveryInput'
    RefreshCredentialInput:
      type: object
      additionalProperties: false
      properties:
        opaqueCredential:
          type: string
          minLength: 32
          maxLength: 2048
      required: [opaqueCredential]
    SupersedeRefreshCredentialDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede_refresh_delivery
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    RevokeInput:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [current, single, others, all]
        sessionRef:
          type: string
          maxLength: 128
      required: [target]
    PasswordInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          maxLength: 2048
        newPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required: [transactionSecret, newPassword]
    PasswordChangeInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required: [currentPassword, newPassword]
    RecoveryInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordRecoveryCompletionInput'
        - $ref: '#/components/schemas/BeginTotpRecoveryReplacementInput'
        - $ref: '#/components/schemas/ConfirmTotpRecoveryReplacementInput'
        - $ref: '#/components/schemas/SupersedeTotpRecoveryReplacementInput'
    PasswordRecoveryCompletionInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
        proofCode:
          type: string
          minLength: 8
          maxLength: 256
        replacementFactor:
          type: string
          const: password
        replacementPassword:
          type: string
          minLength: 15
          maxLength: 1024
      required:
        [transactionSecret, proofCode, replacementFactor, replacementPassword]
    BeginTotpRecoveryReplacementInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
        proofCode:
          type: string
          minLength: 8
          maxLength: 256
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: begin
      required:
        [transactionSecret, proofCode, replacementFactor, ceremonyAction]
    ConfirmTotpRecoveryReplacementInput:
      type: object
      additionalProperties: false
      properties:
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: confirm
        factorReplacementCapability:
          type: string
          minLength: 32
          maxLength: 2048
        enrollmentTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
        confirmationCode:
          type: string
          minLength: 6
          maxLength: 32
      required:
        - replacementFactor
        - ceremonyAction
        - factorReplacementCapability
        - enrollmentTransactionRef
        - confirmationCode
    SupersedeTotpRecoveryReplacementInput:
      type: object
      additionalProperties: false
      properties:
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
        priorEnrollmentTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
      required:
        - replacementFactor
        - ceremonyAction
        - priorCommandId
        - priorEnrollmentTransactionRef
    TransactionSecretInput:
      type: object
      additionalProperties: false
      properties:
        transactionSecret:
          type: string
          minLength: 32
          maxLength: 2048
      required: [transactionSecret]
    TotpConfirmationInput:
      type: object
      additionalProperties: false
      properties:
        transactionRef:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 6
          maxLength: 32
      required: [transactionRef, code]
    TotpEnrollmentStartInput:
      oneOf:
        - $ref: '#/components/schemas/BeginTotpEnrollmentInput'
        - $ref: '#/components/schemas/SupersedeTotpEnrollmentInput'
    BeginTotpEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        ceremonyAction:
          type: string
          const: begin
      required: [ceremonyAction]
    SupersedeTotpEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        ceremonyAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
        priorTransactionRef:
          type: string
          minLength: 16
          maxLength: 128
      required: [ceremonyAction, priorCommandId, priorTransactionRef]
    RecoveryCodeRegenerationInput:
      oneOf:
        - $ref: '#/components/schemas/RegenerateRecoveryCodesInput'
        - $ref: '#/components/schemas/SupersedeRecoveryCodeSetInput'
    RegenerateRecoveryCodesInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: regenerate
      required: [recoveryAction]
    SupersedeRecoveryCodeSetInput:
      type: object
      additionalProperties: false
      properties:
        recoveryAction:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
      required: [recoveryAction, priorCommandId]
    EmailChangeStartInput:
      type: object
      additionalProperties: false
      properties:
        replacementEmail:
          type: string
          format: email
          maxLength: 191
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
      required: [replacementEmail, reauthenticationProof]
    ChannelChallengeProofInput:
      type: object
      additionalProperties: false
      properties:
        challengeRef:
          type: string
          minLength: 16
          maxLength: 128
        proofSecret:
          type: string
          minLength: 16
          maxLength: 2048
      required: [challengeRef, proofSecret]
    EmailChangeCompletionInput:
      type: object
      additionalProperties: false
      properties:
        reauthenticationProof:
          type: string
          minLength: 32
          maxLength: 2048
        currentAddressChallenge:
          $ref: '#/components/schemas/ChannelChallengeProofInput'
        replacementAddressChallenge:
          $ref: '#/components/schemas/ChannelChallengeProofInput'
      required:
        - reauthenticationProof
        - currentAddressChallenge
        - replacementAddressChallenge
    ReauthenticationInput:
      oneOf:
        - $ref: '#/components/schemas/PasswordReauthenticationInput'
        - $ref: '#/components/schemas/MfaReauthenticationInput'
        - $ref: '#/components/schemas/SupersedeReauthenticationProofInput'
    PasswordReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: password
        password:
          type: string
          maxLength: 1024
      required: [stage, password]
    MfaReauthenticationInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: mfa
        transactionRef:
          type: string
          minLength: 16
          maxLength: 128
        challengeKind:
          type: string
          enum: [totp, recovery]
        proofCode:
          type: string
          minLength: 6
          maxLength: 64
      required: [stage, transactionRef, challengeKind, proofCode]
    SupersedeReauthenticationProofInput:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          const: supersede
        priorCommandId: *commandIdSchema
      required: [stage, priorCommandId]
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        commandId: *commandIdSchema
        requestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        receiptRef:
          type: string
          minLength: 1
          maxLength: 256
        state:
          type: string
          const: committed
        committedAt:
          type: string
          format: date-time
      required: [commandId, requestDigest, receiptRef, state, committedAt]
    CommandReceiptResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
      required: [receipt]
    LocalePolicy:
      type: object
      additionalProperties: false
      properties:
        defaultLocale:
          type: string
          minLength: 2
          maxLength: 35
        allowedLocales:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 35
      required: [defaultLocale, allowedLocales]
    PositiveUint64String:
      type: string
      description: A canonical positive unsigned 64-bit integer encoded as a decimal string.
      minLength: 1
      maxLength: 20
      pattern: '^[1-9][0-9]{0,19}$'
      x-kokoro-maximum: '18446744073709551615'
    PublishedModelOption:
      type: object
      additionalProperties: false
      description: >-
        Immutable, Site-release-published product option safe for an end-user selector. Provider,
        route, credential, price internals, fallback order, and the hidden orchestration model are
        deliberately absent. Admission resolves the revision reference to the complete bundle.
      properties:
        modelOptionRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        optionKey:
          type: string
          pattern: '^[a-z][a-z0-9._-]{1,127}$'
        label:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        inputModalities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9._-]{0,63}$'
        outputModalities:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9._-]{0,63}$'
        supportedEfforts:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        badges:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        availability:
          type: string
          enum: [available, temporarily_unavailable]
      required:
        - modelOptionRevisionRef
        - optionKey
        - label
        - inputModalities
        - outputModalities
        - supportedEfforts
        - badges
        - availability
    SurfaceModelOptionCatalog:
      type: object
      additionalProperties: false
      description: >-
        The complete safe selector snapshot for one enabled product surface. A music, image, or
        video option may resolve internally to both a generation model and a main chat/orchestration
        model; the browser never selects or learns those base bindings independently.
      properties:
        surfaceId:
          type: string
          minLength: 1
          maxLength: 128
        catalogRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        defaultModelOptionRevisionRef:
          type: string
          minLength: 1
          maxLength: 256
        options:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/PublishedModelOption'
        publishedAt:
          type: string
          format: date-time
      required:
        - surfaceId
        - catalogRevisionRef
        - defaultModelOptionRevisionRef
        - options
        - publishedAt
    ProductContext:
      type: object
      additionalProperties: false
      description: >-
        Deployment-level Site authority. It is resolved exclusively from the authenticated
        ProductWorkload and registered deployment; it never contains user-specific state.
      properties:
        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        siteProjectBindingRef:
          type: string
          minLength: 1
          maxLength: 256
        deploymentRef:
          type: string
          minLength: 1
          maxLength: 256
        siteRef:
          type: string
          minLength: 1
          maxLength: 128
        siteReleaseRef:
          type: string
          minLength: 1
          maxLength: 128
        webArtifactDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        runtimeEnvironment:
          type: string
          enum: [development, preview, production]
        region:
          type: string
          minLength: 1
          maxLength: 128
        audience:
          type: string
          minLength: 1
          maxLength: 256
        sessionContractRevision:
          type: string
          minLength: 1
          maxLength: 128
        policyEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        revocationEpoch:
          $ref: '#/components/schemas/PositiveUint64String'
        enabledSurfaceIds:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        featurePolicyRevision:
          type: string
          minLength: 1
          maxLength: 128
        modelOptionCatalogRef:
          type: string
          minLength: 1
          maxLength: 256
        modelOptionCatalogs:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/SurfaceModelOptionCatalog'
        agentCatalogRef:
          type: string
          minLength: 1
          maxLength: 256
        localePolicy:
          $ref: '#/components/schemas/LocalePolicy'
        cacheMaxAgeSeconds:
          type: integer
          minimum: 0
          maximum: 300
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - productContextRef
        - siteProjectBindingRef
        - deploymentRef
        - siteRef
        - siteReleaseRef
        - webArtifactDigest
        - runtimeEnvironment
        - region
        - audience
        - sessionContractRevision
        - policyEpoch
        - revocationEpoch
        - enabledSurfaceIds
        - featurePolicyRevision
        - modelOptionCatalogRef
        - modelOptionCatalogs
        - agentCatalogRef
        - localePolicy
        - cacheMaxAgeSeconds
        - issuedAt
        - expiresAt
    ProductContextExchangeResponse:
      type: object
      additionalProperties: false
      properties:
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
        context:
          $ref: '#/components/schemas/ProductContext'
      required: [receipt, context]
    SessionAccessGrantInput:
      type: object
      additionalProperties: false
      properties:
        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        projectRef:
          type: string
          minLength: 1
          maxLength: 256
        purpose:
          type: string
          enum: [read, write, control, stream]
        resource:
          $ref: '#/components/schemas/SessionGrantResource'
      required: [productContextRef, projectRef, purpose, resource]
    SessionGrantProjectResource:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: project
      required: [kind]
    SessionGrantSessionResource:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: session
        sessionRef:
          type: string
          minLength: 1
          maxLength: 256
      required: [kind, sessionRef]
    SessionGrantRunResource:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: run
        sessionRef:
          type: string
          minLength: 1
          maxLength: 256
        runRef:
          type: string
          minLength: 1
          maxLength: 256
      required: [kind, sessionRef, runRef]
    SessionGrantResource:
      oneOf:
        - $ref: '#/components/schemas/SessionGrantProjectResource'
        - $ref: '#/components/schemas/SessionGrantSessionResource'
        - $ref: '#/components/schemas/SessionGrantRunResource'
    SessionGrantReadAuthorization:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          const: read
        audience:
          type: string
          const: session.read
      required: [purpose, audience]
    SessionGrantWriteAuthorization:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          const: write
        audience:
          type: string
          const: session.write
      required: [purpose, audience]
    SessionGrantControlAuthorization:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          const: control
        audience:
          type: string
          const: session.control
      required: [purpose, audience]
    SessionGrantStreamAuthorization:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          const: stream
        audience:
          type: string
          const: session.stream
      required: [purpose, audience]
    SessionGrantAuthorization:
      oneOf:
        - $ref: '#/components/schemas/SessionGrantReadAuthorization'
        - $ref: '#/components/schemas/SessionGrantWriteAuthorization'
        - $ref: '#/components/schemas/SessionGrantControlAuthorization'
        - $ref: '#/components/schemas/SessionGrantStreamAuthorization'
    SessionAccessGrantBinding:
      type: object
      additionalProperties: false
      properties:
        productContextRef:
          type: string
          minLength: 1
          maxLength: 256
        siteProjectBindingRef:
          type: string
          minLength: 1
          maxLength: 256
        deploymentRef:
          type: string
          minLength: 1
          maxLength: 256
        siteRef:
          type: string
          minLength: 1
          maxLength: 128
        siteReleaseRef:
          type: string
          minLength: 1
          maxLength: 128
        webArtifactDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        runtimeEnvironment:
          type: string
          enum: [development, preview, production]
        region:
          type: string
          minLength: 1
          maxLength: 128
        sessionContractRevision:
          type: string
          minLength: 1
          maxLength: 128
        projectRef:
          type: string
          minLength: 1
          maxLength: 256
        subjectRef:
          type: string
          minLength: 1
          maxLength: 256
        subjectGeneration:
          $ref: '#/components/schemas/PositiveUint64String'
        identitySessionRef:
          type: string
          minLength: 1
          maxLength: 256
        issuer:
          type: string
          format: uri
          minLength: 1
          maxLength: 512
        keyRevision:
          type: string
