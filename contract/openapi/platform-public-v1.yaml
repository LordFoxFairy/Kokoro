          minLength: 8
          maxLength: 256
        replacementFactor:
          type: string
          const: totp
        ceremonyAction:
          type: string
          const: begin
      required:
        [transactionSecret, proofCode, replacementFactor, ceremonyAction]
    ConfirmTotpRecoveryReplacementInput:
      type: object
