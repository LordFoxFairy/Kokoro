{
  "registryId": "kokoro.agui.presentation-mapping.v1",
  "profileRevision": "kokoro-agui-presentation.v1",
  "lifecycle": "contract-only",
  "owner": "kokoro-session",
  "sourceContract": "https://contracts.kokoro.invalid/session-agui-presentation-row.v1.schema.json",
  "allowedEventTypes": [
    "RUN_STARTED", "RUN_FINISHED", "RUN_ERROR",
    "TEXT_MESSAGE_START", "TEXT_MESSAGE_CONTENT", "TEXT_MESSAGE_END",
    "ACTIVITY_SNAPSHOT", "CUSTOM"
  ],
  "allowedActivityTypes": [
    "kokoro.safe-summary.v1", "kokoro.tool-preview.v1", "kokoro.hitl.v1", "kokoro.plan.v1",
    "kokoro.subagent.v1", "kokoro.media.v1", "kokoro.artifact.v1", "kokoro.cost.v1",
    "kokoro.notice.v1", "kokoro.error.v1"
  ],
  "allowedCustomNames": [
    "kokoro.session.replace.v1", "kokoro.branch.replace.v1", "kokoro.message.replace.v1",
    "kokoro.run.replace.v1", "kokoro.control.replace.v1", "kokoro.receipt.replace.v1"
  ],
  "forbiddenEventTypes": [
    "TEXT_MESSAGE_CHUNK", "TOOL_CALL_START", "TOOL_CALL_ARGS", "TOOL_CALL_END", "TOOL_CALL_CHUNK", "TOOL_CALL_RESULT",
    "THINKING_START", "THINKING_END", "THINKING_TEXT_MESSAGE_START", "THINKING_TEXT_MESSAGE_CONTENT", "THINKING_TEXT_MESSAGE_END",
    "STATE_SNAPSHOT", "STATE_DELTA", "MESSAGES_SNAPSHOT", "ACTIVITY_DELTA", "RAW", "STEP_STARTED", "STEP_FINISHED",
    "REASONING_START", "REASONING_MESSAGE_START", "REASONING_MESSAGE_CONTENT", "REASONING_MESSAGE_END",
    "REASONING_MESSAGE_CHUNK", "REASONING_END", "REASONING_ENCRYPTED_VALUE"
  ],
  "forbiddenEventFamilies": ["raw", "state", "messages", "delta", "native-tool", "reasoning", "thinking", "step", "chunk", "unknown-custom"],
  "forbiddenFields": ["rawEvent", "event", "state", "messages", "patch", "tools", "context", "forwardedProps", "input", "result"],
  "mappings": [
    {"sourceKind": "presentation.run.started", "eventType": "RUN_STARTED"},
    {"sourceKind": "presentation.run.finished", "eventType": "RUN_FINISHED"},
    {"sourceKind": "presentation.run.error", "eventType": "RUN_ERROR"},
    {"sourceKind": "presentation.message.text.started", "eventType": "TEXT_MESSAGE_START"},
    {"sourceKind": "presentation.message.text.content", "eventType": "TEXT_MESSAGE_CONTENT"},
    {"sourceKind": "presentation.message.text.ended", "eventType": "TEXT_MESSAGE_END"},
    {"sourceKind": "presentation.activity.safe-summary", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.safe-summary.v1"},
    {"sourceKind": "presentation.activity.tool-preview", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.tool-preview.v1"},
    {"sourceKind": "presentation.activity.hitl", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.hitl.v1"},
    {"sourceKind": "presentation.activity.plan", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.plan.v1"},
    {"sourceKind": "presentation.activity.subagent", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.subagent.v1"},
    {"sourceKind": "presentation.activity.media", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.media.v1"},
    {"sourceKind": "presentation.activity.artifact", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.artifact.v1"},
    {"sourceKind": "presentation.activity.cost", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.cost.v1"},
    {"sourceKind": "presentation.activity.notice", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.notice.v1"},
    {"sourceKind": "presentation.activity.error", "eventType": "ACTIVITY_SNAPSHOT", "discriminator": "kokoro.error.v1"},
    {"sourceKind": "presentation.custom.session", "eventType": "CUSTOM", "discriminator": "kokoro.session.replace.v1"},
    {"sourceKind": "presentation.custom.branch", "eventType": "CUSTOM", "discriminator": "kokoro.branch.replace.v1"},
    {"sourceKind": "presentation.custom.message", "eventType": "CUSTOM", "discriminator": "kokoro.message.replace.v1"},
    {"sourceKind": "presentation.custom.run", "eventType": "CUSTOM", "discriminator": "kokoro.run.replace.v1"},
    {"sourceKind": "presentation.custom.control", "eventType": "CUSTOM", "discriminator": "kokoro.control.replace.v1"},
    {"sourceKind": "presentation.custom.receipt", "eventType": "CUSTOM", "discriminator": "kokoro.receipt.replace.v1"}
  ],
  "projectionPolicy": {
    "durableRowToFrameCardinality": "exactly-one",
    "dropDurableRows": false,
    "fanOutDurableRows": false,
    "agentRawEventParticipant": false,
    "providerPayloadParticipant": false
  },
  "transportPolicy": {
    "protocol": "sse",
    "sseId": "opaque-session-cursor",
    "sseEvent": "exact-inner-event-type",
    "resumeHeader": "Last-Event-ID",
    "queryCursor": "same-opaque-cursor-or-absent",
    "cursorGapAction": "http-snapshot-required",
    "drainingDurability": "non-durable",
    "drainingAction": "retry-same-cursor",
    "stockAguiClientTransport": "forbidden",
    "cursorBindingFields": ["sessionId", "streamEpoch", "durableSeq", "profileRevision", "cursorProfileRevision"],
    "grantBindingFields": ["sessionId", "sessionContractRevision", "presentationProfileRevision", "cursorProfileRevision"]
  },
  "snapshotPolicy": {
    "hydrateAuthority": "session-browser-v3-http-snapshot",
    "repairAuthority": "session-browser-v3-http-snapshot",
    "streamHydration": "forbidden",
    "messagesSnapshotEvent": "forbidden",
    "stateSnapshotEvent": "forbidden"
  },
  "limits": {
    "maximumFrameBytes": 131072,
    "maximumEventBytes": 65536,
    "maximumJsonDepth": 12,
    "maximumJsonNodes": 4096,
    "maximumObjectKeys": 64,
    "maximumArrayItems": 256,
    "maximumIdBytes": 128,
    "maximumCursorBytes": 2048
  }
}
