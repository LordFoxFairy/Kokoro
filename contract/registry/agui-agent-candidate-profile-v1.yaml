{
  "profileId": "kokoro.agui.agent-event-candidate-profile.v1",
  "profileRevision": "kokoro-agent-agui-candidate.v1",
  "lifecycle": "contract-only",
  "eventSchema": "https://contracts.kokoro.invalid/agent-agui-event-candidate.v1.schema.json",
  "envelopeSchema": "https://contracts.kokoro.invalid/agent-agui-candidate-envelope.v1.schema.json",
  "producer": "kokoro-agent",
  "consumer": "kokoro-session",
  "allowedEventTypes": [
    "RUN_STARTED", "RUN_FINISHED", "RUN_ERROR",
    "TEXT_MESSAGE_START", "TEXT_MESSAGE_CONTENT", "TEXT_MESSAGE_END",
    "ACTIVITY_SNAPSHOT"
  ],
  "allowedActivityTypes": [
    "kokoro.safe-summary.v1", "kokoro.tool-preview.v1", "kokoro.hitl.v1", "kokoro.plan.v1",
    "kokoro.subagent.v1", "kokoro.media.v1", "kokoro.notice.v1", "kokoro.error.v1"
  ],
  "forbiddenEventTypes": [
    "TEXT_MESSAGE_CHUNK", "TOOL_CALL_START", "TOOL_CALL_ARGS", "TOOL_CALL_END", "TOOL_CALL_CHUNK", "TOOL_CALL_RESULT",
    "THINKING_START", "THINKING_END", "THINKING_TEXT_MESSAGE_START", "THINKING_TEXT_MESSAGE_CONTENT", "THINKING_TEXT_MESSAGE_END",
    "STATE_SNAPSHOT", "STATE_DELTA", "MESSAGES_SNAPSHOT", "ACTIVITY_DELTA", "RAW", "CUSTOM", "STEP_STARTED", "STEP_FINISHED",
    "REASONING_START", "REASONING_MESSAGE_START", "REASONING_MESSAGE_CONTENT", "REASONING_MESSAGE_END",
    "REASONING_MESSAGE_CHUNK", "REASONING_END", "REASONING_ENCRYPTED_VALUE"
  ],
  "forbiddenEventFamilies": ["raw", "state", "messages", "delta", "native-tool", "reasoning", "thinking", "step", "chunk", "custom"],
  "forbiddenOwnerActivityTypes": ["kokoro.artifact.v1", "kokoro.cost.v1"],
  "forbiddenFields": [
    "rawEvent", "raw_event", "providerEvent", "provider_event", "messages", "patch", "tools", "context", "forwardedProps",
    "input", "result", "extra"
  ],
  "terminalPolicy": {
    "runFinished": "success-only",
    "runError": "failure-only",
    "canceledOrInterrupted": "session-owned-projection"
  },
  "projectionPolicy": {
    "sessionAdmission": "validate-before-durable-projection",
    "runFinishedOutcome": "strip-after-success-validation",
    "routeProjection": "resolve-through-session-presentation-binding",
    "ownerActivitySynthesis": "session-owner-facts-only"
  },
  "identityPolicy": {
    "candidateRefDomain": "agui_candidate:sha256",
    "candidateRefMaterial": [
      "profileRevision", "internalRunRef", "internalThreadRef", "internalMessageRef-or-empty", "sourceEventRef",
      "sourceOrdinal-decimal", "recordedAt", "eventDigest"
    ],
    "sourceEventRef": "agent-owner-stable-ref",
    "sourceOrdinal": "uint64-decimal-string-monotonic-per-run",
    "recordedAt": "canonical-utc-ms-equals-event-timestamp",
    "eventDigest": "sha256-rfc8785-jcs-event",
    "forbiddenAxes": ["siteId", "userId", "sessionId", "cursor", "sseId", "sseEvent"]
  },
  "eventScopePolicy": {
    "runStartedAndFinished": "threadId=internalThreadRef-and-runId=internalRunRef",
    "runError": "outer-internalRunRef-and-internalThreadRef",
    "textAndActivity": "messageId=internalMessageRef"
  },
  "activation": {
    "runtimeImplemented": false,
    "compatibilityEvidence": false,
    "browserTransport": false
  }
}
