// AdminCommerceService is the only typed operator ingress into Commerce administration.
service AdminCommerceService {
  rpc PublishCreditProgramRevision(PublishCreditProgramRevisionRequest) returns (PublishCreditProgramRevisionResponse) {}
  rpc ListCreditProgramRevisions(ListCreditProgramRevisionsRequest) returns (ListCreditProgramRevisionsResponse) {}
  rpc GetCreditProgramRevision(GetCreditProgramRevisionRequest) returns (GetCreditProgramRevisionResponse) {}
  rpc PublishEntitlementTemplateRevision(PublishEntitlementTemplateRevisionRequest) returns (PublishEntitlementTemplateRevisionResponse) {}
  rpc ListEntitlementTemplateRevisions(ListEntitlementTemplateRevisionsRequest) returns (ListEntitlementTemplateRevisionsResponse) {}
  rpc GetEntitlementTemplateRevision(GetEntitlementTemplateRevisionRequest) returns (GetEntitlementTemplateRevisionResponse) {}
  rpc PublishOffer(PublishOfferRequest) returns (PublishOfferResponse) {}
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {}
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse) {}
  rpc PublishRedemptionProgram(PublishRedemptionProgramRequest) returns (PublishRedemptionProgramResponse) {}
  rpc ListRedemptionPrograms(ListRedemptionProgramsRequest) returns (ListRedemptionProgramsResponse) {}
  rpc GetRedemptionProgram(GetRedemptionProgramRequest) returns (GetRedemptionProgramResponse) {}
  rpc IssueCodeBatch(IssueCodeBatchRequest) returns (IssueCodeBatchResponse) {}
  rpc ListCodeBatches(ListCodeBatchesRequest) returns (ListCodeBatchesResponse) {}
  rpc GetCodeBatch(GetCodeBatchRequest) returns (GetCodeBatchResponse) {}
  rpc ApproveCodeBatch(ApproveCodeBatchRequest) returns (ApproveCodeBatchResponse) {}
  rpc ActivateCodeBatch(ActivateCodeBatchRequest) returns (ActivateCodeBatchResponse) {}
  rpc AbandonCodeBatch(AbandonCodeBatchRequest) returns (AbandonCodeBatchResponse) {}
  rpc SuspendCodeBatch(SuspendCodeBatchRequest) returns (SuspendCodeBatchResponse) {}
  rpc RevokeCodeBatch(RevokeCodeBatchRequest) returns (RevokeCodeBatchResponse) {}
}

