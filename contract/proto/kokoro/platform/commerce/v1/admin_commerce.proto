syntax = "proto3";

package kokoro.platform.commerce.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/admin/v2/admin_shared.proto";
import "kokoro/platform/commerce/v1/fulfillment.proto";
import "kokoro/platform/publication/v1/publication_common.proto";

// AdminCommerceService is the only typed operator boundary for Commerce-owned
// catalog, acquisition, fulfillment and correction facts.
service AdminCommerceService {
  rpc PublishPlanRevision(PublishPlanRevisionRequest) returns (PublishPlanRevisionResponse) {}
  rpc ListPlanRevisions(ListPlanRevisionsRequest) returns (ListPlanRevisionsResponse) {}
  rpc GetPlanRevision(GetPlanRevisionRequest) returns (GetPlanRevisionResponse) {}
  rpc PublishOfferRevision(PublishOfferRevisionRequest) returns (PublishOfferRevisionResponse) {}
  rpc ListOfferRevisions(ListOfferRevisionsRequest) returns (ListOfferRevisionsResponse) {}
  rpc GetOfferRevision(GetOfferRevisionRequest) returns (GetOfferRevisionResponse) {}
  rpc PublishFulfillmentProgramRevision(PublishFulfillmentProgramRevisionRequest) returns (PublishFulfillmentProgramRevisionResponse) {}
  rpc ListFulfillmentProgramRevisions(ListFulfillmentProgramRevisionsRequest) returns (ListFulfillmentProgramRevisionsResponse) {}
  rpc GetFulfillmentProgramRevision(GetFulfillmentProgramRevisionRequest) returns (GetFulfillmentProgramRevisionResponse) {}
  rpc PublishRedemptionProgramRevision(PublishRedemptionProgramRevisionRequest) returns (PublishRedemptionProgramRevisionResponse) {}
  rpc ListRedemptionProgramRevisions(ListRedemptionProgramRevisionsRequest) returns (ListRedemptionProgramRevisionsResponse) {}
  rpc GetRedemptionProgramRevision(GetRedemptionProgramRevisionRequest) returns (GetRedemptionProgramRevisionResponse) {}
  rpc PublishSiteCommerceAssignment(PublishSiteCommerceAssignmentRequest) returns (PublishSiteCommerceAssignmentResponse) {}
  rpc ListSiteCommerceAssignments(ListSiteCommerceAssignmentsRequest) returns (ListSiteCommerceAssignmentsResponse) {}
  rpc GetSiteCommerceAssignment(GetSiteCommerceAssignmentRequest) returns (GetSiteCommerceAssignmentResponse) {}
  rpc RequestCodeBatchIssuance(RequestCodeBatchIssuanceRequest) returns (RequestCodeBatchIssuanceResponse) {}
  rpc ApproveCodeBatchIssuance(ApproveCodeBatchIssuanceRequest) returns (ApproveCodeBatchIssuanceResponse) {}
  rpc ClaimCodeBatchDelivery(ClaimCodeBatchDeliveryRequest) returns (ClaimCodeBatchDeliveryResponse) {}
  rpc ListCodeBatches(ListCodeBatchesRequest) returns (ListCodeBatchesResponse) {}
  rpc GetCodeBatch(GetCodeBatchRequest) returns (GetCodeBatchResponse) {}
  rpc ActivateCodeBatch(ActivateCodeBatchRequest) returns (ActivateCodeBatchResponse) {}
  rpc SuspendCodeBatch(SuspendCodeBatchRequest) returns (SuspendCodeBatchResponse) {}
  rpc ResumeCodeBatch(ResumeCodeBatchRequest) returns (ResumeCodeBatchResponse) {}
  rpc RevokeCodeBatch(RevokeCodeBatchRequest) returns (RevokeCodeBatchResponse) {}
  rpc RequestSourceReversal(RequestSourceReversalRequest) returns (RequestSourceReversalResponse) {}
  rpc ApproveSourceReversal(ApproveSourceReversalRequest) returns (ApproveSourceReversalResponse) {}
  rpc RequestCodeReplacement(RequestCodeReplacementRequest) returns (RequestCodeReplacementResponse) {}
  rpc ApproveCodeReplacement(ApproveCodeReplacementRequest) returns (ApproveCodeReplacementResponse) {}
  rpc ListSourceCorrections(ListSourceCorrectionsRequest) returns (ListSourceCorrectionsResponse) {}
  rpc GetSourceCorrection(GetSourceCorrectionRequest) returns (GetSourceCorrectionResponse) {}
  rpc ListCommerceReconciliations(ListCommerceReconciliationsRequest) returns (ListCommerceReconciliationsResponse) {}
  rpc GetCommerceReconciliation(GetCommerceReconciliationRequest) returns (GetCommerceReconciliationResponse) {}
  rpc ResolveCommerceReconciliation(ResolveCommerceReconciliationRequest) returns (ResolveCommerceReconciliationResponse) {}
  rpc GetCommerceCommandReceipt(GetCommerceCommandReceiptRequest) returns (GetCommerceCommandReceiptResponse) {}
}

message CommerceRevisionTarget {
  string target_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 target_revision = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  string target_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message CommerceApprovalAnchor {
  option (buf.validate.message).cel = {
    id: "commerce.approval.maker_checker"
    message: "the requester and approving operator must be different actors"
    expression: "this.requested_by_actor_ref != this.approved_by_actor_ref"
  };
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string approval_digest = 2 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string requested_by_actor_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string approved_by_actor_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string request_command_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string request_command_digest = 6 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

enum PlanAcquisitionKind {
  PLAN_ACQUISITION_KIND_UNSPECIFIED = 0;
  PLAN_ACQUISITION_KIND_FREE = 1;
  PLAN_ACQUISITION_KIND_REDEMPTION = 2;
  PLAN_ACQUISITION_KIND_SUBSCRIPTION = 3;
}

enum PlanTermAction {
  PLAN_TERM_ACTION_UNSPECIFIED = 0;
  PLAN_TERM_ACTION_NONE = 1;
  PLAN_TERM_ACTION_START = 2;
  PLAN_TERM_ACTION_EXTEND_FROM_MAX = 3;
  PLAN_TERM_ACTION_REJECT_IF_ACTIVE = 4;
}

enum FulfillmentProgramOutputKind {
  FULFILLMENT_PROGRAM_OUTPUT_KIND_UNSPECIFIED = 0;
  FULFILLMENT_PROGRAM_OUTPUT_KIND_SUBSCRIPTION_TERM = 1;
  FULFILLMENT_PROGRAM_OUTPUT_KIND_ENTITLEMENT_GRANT = 2;
  FULFILLMENT_PROGRAM_OUTPUT_KIND_CREDIT_GRANT = 3;
}

enum CodeBatchState {
  CODE_BATCH_STATE_UNSPECIFIED = 0;
  CODE_BATCH_STATE_REQUESTED = 1;
  CODE_BATCH_STATE_APPROVED = 2;
  CODE_BATCH_STATE_ACTIVE = 3;
  CODE_BATCH_STATE_SUSPENDED = 4;
  CODE_BATCH_STATE_REVOKED = 5;
}

enum CodeDeliveryState {
  CODE_DELIVERY_STATE_UNSPECIFIED = 0;
  CODE_DELIVERY_STATE_PENDING_APPROVAL = 1;
  CODE_DELIVERY_STATE_AVAILABLE = 2;
  CODE_DELIVERY_STATE_CLAIMED = 3;
}

enum SourceCorrectionKind {
  SOURCE_CORRECTION_KIND_UNSPECIFIED = 0;
  SOURCE_CORRECTION_KIND_REVERSAL = 1;
  SOURCE_CORRECTION_KIND_CODE_REPLACEMENT = 2;
}

enum SourceCorrectionState {
  SOURCE_CORRECTION_STATE_UNSPECIFIED = 0;
  SOURCE_CORRECTION_STATE_REQUESTED = 1;
  SOURCE_CORRECTION_STATE_APPROVED = 2;
}

enum CommerceReconciliationState {
  COMMERCE_RECONCILIATION_STATE_UNSPECIFIED = 0;
  COMMERCE_RECONCILIATION_STATE_OPEN = 1;
  COMMERCE_RECONCILIATION_STATE_RESOLVED = 2;
}

enum CommerceReconciliationResolution {
  COMMERCE_RECONCILIATION_RESOLUTION_UNSPECIFIED = 0;
  COMMERCE_RECONCILIATION_RESOLUTION_CONFIRM_COMMITTED = 1;
  COMMERCE_RECONCILIATION_RESOLUTION_CONFIRM_NOT_COMMITTED = 2;
  COMMERCE_RECONCILIATION_RESOLUTION_REPLACE = 3;
}

message PlanRevisionDefinition {
  option (buf.validate.message).cel = {
    id: "commerce.plan.term_shape"
    message: "NONE has no term duration and every term mutation has a positive duration"
    expression: "(this.term_action == 1 && this.term_seconds == 0u) || (this.term_action in [2, 3, 4] && this.term_seconds > 0u)"
  };
  string plan_key = 1 [(buf.validate.field).string = {pattern: "^[a-z][a-z0-9._-]{1,127}$"}];
  PlanAcquisitionKind acquisition_kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  PlanTermAction term_action = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint64 term_seconds = 4 [(buf.validate.field).uint64.lte = 315576000];
  string display_label = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
}

message FulfillmentProgramOutputLine {
  string output_line_id = 1 [(buf.validate.field).string = {pattern: "^[a-z0-9][a-z0-9._:-]{0,127}$"}];
  uint32 output_ordinal = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 32
  }];
  uint32 occurrence_count = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
  FulfillmentProgramOutputKind kind = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CommerceRevisionTarget owner_revision = 5 [(buf.validate.field).required = true];
}

message PlanRevisionView {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommerceRevisionTarget revision = 2 [(buf.validate.field).required = true];
  PlanRevisionDefinition definition = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp published_at = 4 [(buf.validate.field).required = true];
}

message OfferRevisionView {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommerceRevisionTarget revision = 2 [(buf.validate.field).required = true];
  string offer_key = 3 [(buf.validate.field).string = {pattern: "^[a-z][a-z0-9._-]{1,127}$"}];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding product_catalog_revision = 4 [(buf.validate.field).required = true];
  CommerceRevisionTarget plan_revision = 5 [(buf.validate.field).required = true];
  CommerceRevisionTarget fulfillment_program_revision = 6 [(buf.validate.field).required = true];
  google.protobuf.Timestamp published_at = 7 [(buf.validate.field).required = true];
}

message FulfillmentProgramRevisionView {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommerceRevisionTarget revision = 2 [(buf.validate.field).required = true];
  repeated FulfillmentProgramOutputLine output_lines = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  google.protobuf.Timestamp published_at = 4 [(buf.validate.field).required = true];
}

message RedemptionProgramRevisionView {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommerceRevisionTarget revision = 2 [(buf.validate.field).required = true];
  CommerceRevisionTarget offer_revision = 3 [(buf.validate.field).required = true];
  uint32 maximum_redemptions_per_subject = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  google.protobuf.Timestamp published_at = 5 [(buf.validate.field).required = true];
}

message SiteCommerceAssignmentView {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommerceRevisionTarget revision = 2 [(buf.validate.field).required = true];
  repeated CommerceRevisionTarget offer_revisions = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
  repeated CommerceRevisionTarget redemption_program_revisions = 4 [(buf.validate.field).repeated.max_items = 128];
  google.protobuf.Timestamp published_at = 5 [(buf.validate.field).required = true];
}

message PublishPlanRevisionEffect {
  option (buf.validate.message).cel = {
    id: "commerce.publish_plan.contiguous_revision"
    message: "the immutable target revision must be the exact CAS successor"
    expression: "this.target.target_revision == this.expected_version + 1u"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  string command_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  PlanRevisionDefinition definition = 4 [(buf.validate.field).required = true];
  string reason = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishOfferRevisionEffect {
  option (buf.validate.message).cel = {
    id: "commerce.publish_offer.contiguous_revision"
    message: "the immutable target revision must be the exact CAS successor"
    expression: "this.target.target_revision == this.expected_version + 1u"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  string command_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string offer_key = 4 [(buf.validate.field).string = {pattern: "^[a-z][a-z0-9._-]{1,127}$"}];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding product_catalog_revision = 5 [(buf.validate.field).required = true];
  CommerceRevisionTarget plan_revision = 6 [(buf.validate.field).required = true];
  CommerceRevisionTarget fulfillment_program_revision = 7 [(buf.validate.field).required = true];
  string reason = 8 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishFulfillmentProgramRevisionEffect {
  option (buf.validate.message).cel = {
    id: "commerce.fulfillment_program.line_identity_unique"
    message: "output line ids and ordinals are unique"
    expression: "this.output_lines.all(o, this.output_lines.filter(n, n.output_line_id == o.output_line_id).size() == 1 && this.output_lines.filter(n, n.output_ordinal == o.output_ordinal).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "commerce.fulfillment_program.contiguous_ordinals"
    message: "output ordinals must cover the exact contiguous range one through N"
    expression: "this.output_lines.all(o, o.output_ordinal <= uint(this.output_lines.size()))"
  };
  option (buf.validate.message).cel = {
    id: "commerce.publish_fulfillment.contiguous_revision"
    message: "the immutable target revision must be the exact CAS successor"
    expression: "this.target.target_revision == this.expected_version + 1u"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  string command_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  repeated FulfillmentProgramOutputLine output_lines = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  string reason = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishRedemptionProgramRevisionEffect {
  option (buf.validate.message).cel = {
    id: "commerce.publish_redemption.contiguous_revision"
    message: "the immutable target revision must be the exact CAS successor"
    expression: "this.target.target_revision == this.expected_version + 1u"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  string command_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  CommerceRevisionTarget offer_revision = 4 [(buf.validate.field).required = true];
  uint32 maximum_redemptions_per_subject = 5 [(buf.validate.field).uint32 = {
