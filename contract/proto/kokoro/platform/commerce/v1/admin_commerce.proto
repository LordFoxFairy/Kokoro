enum CreditBucketClass {
  CREDIT_BUCKET_CLASS_UNSPECIFIED = 0;
  CREDIT_BUCKET_CLASS_DAILY = 1;
  CREDIT_BUCKET_CLASS_PERIOD = 2;
  CREDIT_BUCKET_CLASS_PERMANENT = 3;
}

// Rollover is part of the immutable Program revision. Launch supports no rollover; adding another
// policy requires a new enum value and a new Program revision rather than changing live grants.
enum CreditRolloverPolicy {
  CREDIT_ROLLOVER_POLICY_UNSPECIFIED = 0;
  CREDIT_ROLLOVER_POLICY_NONE = 1;
}

message PermanentCreditWindowPolicy {
  CreditRolloverPolicy rollover_policy = 1 [(buf.validate.field).enum.const = 1];
}

message RecurringCreditWindowPolicy {
  // IANA time-zone identifier. UTC is the only single-component identifier.
  string calendar_zone = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^(?:UTC|[A-Za-z][A-Za-z0-9._+-]*(?:/[A-Za-z][A-Za-z0-9._+-]*)+)$"
  }];
  oneof anchor {
    option (buf.validate.oneof).required = true;
    // Daily windows open at this local wall-clock second in calendar_zone.
    string daily_local_time = 2 [(buf.validate.field).string = {pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"}];
    // Period windows are anchored to the authoritative Subscription term start.
    bool subscription_term_start = 3 [(buf.validate.field).bool.const = true];
  }
  uint64 expires_after_seconds = 4 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  CreditRolloverPolicy rollover_policy = 5 [(buf.validate.field).enum.const = 1];
}

message CreditScopePolicy {
  repeated string surface_refs = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
    unique: true
    items: {
      string: {pattern: "^[a-z0-9][a-z0-9._:-]{0,255}$"}
    }
  }];
  repeated string capability_keys = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
    unique: true
    items: {
      string: {pattern: "^[a-z0-9][a-z0-9._:-]{0,255}$"}
    }
  }];
  repeated string agent_refs = 3 [(buf.validate.field).repeated = {
    max_items: 256
    unique: true
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,255}$"}
    }
  }];
  bool allow_unattributed_agent = 4;
}

message PublishCreditProgramRevisionEffect {
  option (buf.validate.message).cel = {
    id: "credit_program.window_policy_matches_bucket"
    message: "permanent credits require permanent_window; recurring credits require recurring_window"
    expression: "(this.ux_bucket_class == 3 && has(this.permanent_window)) || (this.ux_bucket_class in [1, 2] && has(this.recurring_window))"
  };
  option (buf.validate.message).cel = {
    id: "credit_program.anchor_matches_bucket"
    message: "daily credits require daily_local_time; period credits require subscription_term_start"
    expression: "(this.ux_bucket_class == 3 && has(this.permanent_window)) || (this.ux_bucket_class == 1 && has(this.recurring_window) && has(this.recurring_window.daily_local_time)) || (this.ux_bucket_class == 2 && has(this.recurring_window) && has(this.recurring_window.subscription_term_start))"
  };

  string credit_program_revision_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string program_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 revision = 3 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  CreditBucketClass ux_bucket_class = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string unit = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string amount = 6 [(buf.validate.field).string = {pattern: "^[1-9][0-9]{0,37}$"}];
  int32 burn_priority = 7;
  CreditScopePolicy scope_policy = 8 [(buf.validate.field).required = true];
  string liability_merchant_account_ref = 9 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  oneof window_policy {
    option (buf.validate.oneof).required = true;
    PermanentCreditWindowPolicy permanent_window = 10;
    RecurringCreditWindowPolicy recurring_window = 11;
  }
  reserved 12;
}

message CreditProgramRevisionSummary {
  option (buf.validate.message).cel = {
    id: "credit_program.window_policy_matches_bucket"
    message: "permanent credits require permanent_window; recurring credits require recurring_window"
    expression: "(this.ux_bucket_class == 3 && has(this.permanent_window)) || (this.ux_bucket_class in [1, 2] && has(this.recurring_window))"
  };
  option (buf.validate.message).cel = {
    id: "credit_program.anchor_matches_bucket"
    message: "daily credits require daily_local_time; period credits require subscription_term_start"
    expression: "(this.ux_bucket_class == 3 && has(this.permanent_window)) || (this.ux_bucket_class == 1 && has(this.recurring_window) && has(this.recurring_window.daily_local_time)) || (this.ux_bucket_class == 2 && has(this.recurring_window) && has(this.recurring_window.subscription_term_start))"
  };

  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string credit_program_revision_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string program_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 revision = 4 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 9223372036854775807
  }];
  CreditBucketClass ux_bucket_class = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string unit = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string amount = 7 [(buf.validate.field).string = {pattern: "^[1-9][0-9]{0,37}$"}];
  int32 burn_priority = 8;
  CreditScopePolicy scope_policy = 9 [(buf.validate.field).required = true];
  string liability_merchant_account_ref = 10 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  oneof window_policy {
    option (buf.validate.oneof).required = true;
    PermanentCreditWindowPolicy permanent_window = 11;
    RecurringCreditWindowPolicy recurring_window = 12;
  }
  reserved 13;
  string revision_digest = 14 [(buf.validate.field).string = {pattern: "^[a-f0-9]{64}$"}];
  google.protobuf.Timestamp published_at = 15 [(buf.validate.field).required = true];
}

