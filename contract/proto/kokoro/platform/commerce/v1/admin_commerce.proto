message PublishPlanRevisionResponse {
  option (buf.validate.message).cel = {
    id: "commerce.publish_plan_revision.closed_response"
    message: "receipt operation and committed result state must match"
    expression: "this.receipt.operation == 'PublishPlanRevision' && this.receipt.state == kokoro.common.v2.CommandReceiptStateV2.COMMAND_RECEIPT_STATE_V2_COMMITTED"
  };
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  PlanRevisionView revision = 2 [(buf.validate.field).required = true];
}
