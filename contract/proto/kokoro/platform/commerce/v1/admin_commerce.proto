    max_len: 512
  }];
}

message PublishSiteCommerceAssignmentEffect {
  option (buf.validate.message).cel = {
    id: "commerce.publish_assignment.contiguous_revision"
    message: "the immutable target revision must be the exact CAS successor"
    expression: "this.target.target_revision == this.expected_version + 1u"
  };
  option (buf.validate.message).cel = {
    id: "commerce.publish_assignment.unique_offers"
    message: "an offer aggregate may appear at most once in one Site assignment"
    expression: "this.offer_revisions.all(o, this.offer_revisions.filter(n, n.target_ref == o.target_ref).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "commerce.publish_assignment.unique_redemption_programs"
    message: "a redemption program aggregate may appear at most once in one Site assignment"
    expression: "this.redemption_program_revisions.all(o, this.redemption_program_revisions.filter(n, n.target_ref == o.target_ref).size() == 1)"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  string command_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  repeated CommerceRevisionTarget offer_revisions = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
  repeated CommerceRevisionTarget redemption_program_revisions = 5 [(buf.validate.field).repeated.max_items = 128];
  string reason = 6 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishPlanRevisionRequest {
  option (buf.validate.message).cel = {
    id: "commerce.publish_plan.digest"
    message: "command digest mismatch"
    expression: "this.context.command.request_digest == this.effect.command_digest"
  };
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  PublishPlanRevisionEffect effect = 3 [(buf.validate.field).required = true];
}
