    max_len: 512
  }];
}

message PublishPlanRevisionRequest {
  option (buf.validate.message).cel = {
    id: "commerce.plan.command_digest"
    message: "effect digest must be the authenticated command digest"
    expression: "this.context.operator.command.request_digest == this.effect.command_digest"
  };
  CommerceGlobalCommandContext context = 1 [(buf.validate.field).required = true];
  PublishPlanRevisionEffect effect = 2 [(buf.validate.field).required = true];
}
message PublishOfferRevisionRequest {
  option (buf.validate.message).cel = {
    id: "commerce.offer.command_digest"
    message: "effect digest must be the authenticated command digest"
    expression: "this.context.operator.command.request_digest == this.effect.command_digest"
  };
  CommerceGlobalCommandContext context = 1 [(buf.validate.field).required = true];
  PublishOfferRevisionEffect effect = 2 [(buf.validate.field).required = true];
}
