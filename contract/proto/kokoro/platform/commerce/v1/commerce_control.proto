syntax = "proto3";

package kokoro.platform.commerce.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/admin/v2/admin_shared.proto";
import "kokoro/platform/commerce/v1/commerce_catalog.proto";
import "kokoro/platform/commerce/v1/fulfillment.proto";

message CommerceSiteCommandContext {
  option (buf.validate.message).cel = {
    id: "commerce.site_command.scope"
    message: "operator scope, environment and region must authorize the exact Site"
    expression: "(has(this.operator.scope.site) && this.operator.scope.site.site_ids.exists(s, s == this.site_id) && this.operator.environment == this.operator.scope.site.environment && this.operator.region == this.operator.scope.site.region) || (has(this.operator.scope.global) && this.operator.environment == this.operator.scope.global.environment && this.operator.region == this.operator.scope.global.region) || (has(this.operator.scope.breakglass) && this.operator.environment == this.operator.scope.breakglass.environment && this.operator.region == this.operator.scope.breakglass.region)"
  };
  // This message is constructed only after middleware has verified the session,
  // device, workload and security epochs. Transport JSON is never decoded
  // directly into this type by a business handler.
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext operator = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
}
message CommerceSiteQueryContext {
  option (buf.validate.message).cel = {
    id: "commerce.site_query.scope"
    message: "operator scope, environment and region must authorize the exact Site"
    expression: "(has(this.operator.scope.site) && this.operator.scope.site.site_ids.exists(s, s == this.site_id) && this.operator.environment == this.operator.scope.site.environment && this.operator.region == this.operator.scope.site.region) || (has(this.operator.scope.global) && this.operator.environment == this.operator.scope.global.environment && this.operator.region == this.operator.scope.global.region) || (has(this.operator.scope.breakglass) && this.operator.environment == this.operator.scope.breakglass.environment && this.operator.region == this.operator.scope.breakglass.region)"
  };
  // Middleware-attested output, not caller-authored authorization evidence.
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext operator = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
}

enum CommerceApprovalDecision {
  COMMERCE_APPROVAL_DECISION_UNSPECIFIED = 0;
  COMMERCE_APPROVAL_DECISION_APPROVE = 1;
  COMMERCE_APPROVAL_DECISION_REJECT = 2;
}
enum CommerceApprovalState {
  COMMERCE_APPROVAL_STATE_UNSPECIFIED = 0;
  COMMERCE_APPROVAL_STATE_PENDING = 1;
  COMMERCE_APPROVAL_STATE_AUTHORIZED = 2;
  COMMERCE_APPROVAL_STATE_REJECTED = 3;
  COMMERCE_APPROVAL_STATE_CANCELED = 4;
  COMMERCE_APPROVAL_STATE_EXPIRED = 5;
}
enum CommerceExecutionState {
  COMMERCE_EXECUTION_STATE_UNSPECIFIED = 0;
  COMMERCE_EXECUTION_STATE_QUEUED = 1;
  COMMERCE_EXECUTION_STATE_APPLYING = 2;
  COMMERCE_EXECUTION_STATE_APPLIED = 3;
  COMMERCE_EXECUTION_STATE_FAILED = 4;
  COMMERCE_EXECUTION_STATE_OUTCOME_UNKNOWN = 5;
}

message CommerceApprovalTargetCas {
  string target_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
}

// Append-only, server-owned fact produced only after the command provider has
// deterministically serialized the complete typed Effect and matched the
// resulting CanonicalCommandEnvelopeV2 digest to request_command.request_digest.
message CommerceApprovalRequestFact {
  string request_fact_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 request_fact_version = 2 [(buf.validate.field).uint64.const = 1];
  string site_id = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string environment = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string operation = 6 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string typed_effect_type = 7 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string typed_effect_digest = 8 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  repeated CommerceApprovalTargetCas targets = 9 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
  string maker_actor_ref = 10 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  kokoro.common.v2.CommandIdentityV2 request_command = 11 [(buf.validate.field).required = true];
  string authority_epochs_digest = 12 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  google.protobuf.Timestamp requested_at = 13 [(buf.validate.field).required = true];
  google.protobuf.Timestamp expires_at = 14 [(buf.validate.field).required = true];
  string request_fact_digest = 15 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message CommerceApprovalDecisionFact {
  string decision_fact_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 decision_fact_version = 2 [(buf.validate.field).uint64.const = 1];
  string request_fact_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string request_fact_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  CommerceApprovalDecision decision = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string checker_actor_ref = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  kokoro.common.v2.CommandIdentityV2 decision_command = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp decided_at = 8 [(buf.validate.field).required = true];
  string decision_fact_digest = 9 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

// Persisted in the same UoW as an APPROVE decision. There is no observable
// approved-but-not-enqueued state and the worker never consumes caller input.
message CommerceExecutionIntentFact {
  string execution_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 execution_version = 2 [(buf.validate.field).uint64.const = 1];
  string request_fact_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string request_fact_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string decision_fact_ref = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string decision_fact_digest = 6 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  google.protobuf.Timestamp enqueued_at = 7 [(buf.validate.field).required = true];
  string intent_digest = 8 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message CommerceApprovalView {
  option (buf.validate.message).cel = {
    id: "commerce.approval.lifecycle"
    message: "approval, rejection and enqueue are represented by immutable facts"
    expression: "(this.state == 1 && !has(this.decision) && !has(this.execution_intent)) || (this.state == 2 && has(this.decision) && this.decision.decision == 1 && has(this.execution_intent)) || (this.state == 3 && has(this.decision) && this.decision.decision == 2 && !has(this.execution_intent)) || (this.state in [4, 5] && !has(this.execution_intent))"
  };
  option (buf.validate.message).cel = {
    id: "commerce.approval.four_eyes"
    message: "maker and checker must be different actors"
    expression: "!has(this.decision) || this.request.maker_actor_ref != this.decision.checker_actor_ref"
  };
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 approval_version = 2 [(buf.validate.field).uint64.gt = 0];
  CommerceApprovalState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CommerceApprovalRequestFact request = 4 [(buf.validate.field).required = true];
  optional CommerceApprovalDecisionFact decision = 5;
  optional CommerceExecutionIntentFact execution_intent = 6;
}

// The checker supplies only a reference, CAS version and decision. Platform
// resolves and consumes all maker/effect/target/epoch authority server-side.
message CommerceApprovalDecisionEffect {
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 expected_approval_version = 2 [(buf.validate.field).uint64.gt = 0];
  CommerceApprovalDecision decision = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}
message CommerceExecutionView {
  option (buf.validate.message).cel = {
    id: "commerce.execution.outcome"
    message: "worker state has exactly one typed terminal outcome"
    expression: "(this.state == 3 && has(this.result) && !has(this.outcome_unknown) && !has(this.failure)) || (this.state == 4 && !has(this.result) && !has(this.outcome_unknown) && has(this.failure)) || (this.state == 5 && !has(this.result) && has(this.outcome_unknown) && !has(this.failure)) || (this.state in [1, 2] && !has(this.result) && !has(this.outcome_unknown) && !has(this.failure))"
  };
  string execution_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 execution_version = 2 [(buf.validate.field).uint64.gt = 0];
  CommerceExecutionState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CommerceExecutionIntentFact intent = 4 [(buf.validate.field).required = true];
  string executor_workload_ref = 8 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string executor_attestation_digest = 9 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  optional CommerceWorkflowExecutionResult result = 10;
  optional CommerceOutcomeUnknownCase outcome_unknown = 11;
  google.protobuf.Timestamp updated_at = 12 [(buf.validate.field).required = true];
  optional CommerceExecutionFailure failure = 13;
}

message CommerceExecutionFailure {
  string code = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string evidence_ref = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string evidence_digest = 3 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

enum CommerceWorkflowKind {
  COMMERCE_WORKFLOW_KIND_UNSPECIFIED = 0;
  COMMERCE_WORKFLOW_KIND_SITE_ASSIGNMENT = 1;
  COMMERCE_WORKFLOW_KIND_CODE_ISSUANCE = 2;
  COMMERCE_WORKFLOW_KIND_CODE_TRANSITION = 3;
  COMMERCE_WORKFLOW_KIND_CODE_DELIVERY = 4;
  COMMERCE_WORKFLOW_KIND_SOURCE_CORRECTION = 5;
  COMMERCE_WORKFLOW_KIND_RECONCILIATION = 6;
}

message CommerceOutcomeUnknownCase {
  string reconciliation_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  CommerceWorkflowKind workflow = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string execution_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string target_ref = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string uncertainty_evidence_digest = 5 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message CommerceWorkflowExecutionResult {
  oneof result {
    option (buf.validate.oneof).required = true;
    SiteAssignmentExecutionResult site_assignment = 1;
    CodeBatchIssuanceExecutionResult code_issuance = 2;
    CodeBatchTransitionExecutionResult code_transition = 3;
    CodeDeliveryExecutionResult code_delivery = 4;
    SourceCorrectionExecutionResult source_correction = 5;
    CommerceReconciliationExecutionResult reconciliation = 6;
  }
  string result_fact_digest = 7 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message SiteCommerceAssignmentCandidate {
  option (buf.validate.message).cel = {
    id: "commerce.assignment.unique_targets"
    message: "an assignment cannot bind the same immutable target twice"
    expression: "this.offer_revisions.all(x, this.offer_revisions.filter(y, y.target_ref == x.target_ref).size() == 1) && this.offer_price_revisions.all(x, this.offer_price_revisions.filter(y, y.target_ref == x.target_ref).size() == 1) && this.redemption_program_revisions.all(x, this.redemption_program_revisions.filter(y, y.target_ref == x.target_ref).size() == 1)"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  repeated CommerceRevisionTarget offer_revisions = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
  repeated CommerceRevisionTarget redemption_program_revisions = 3 [(buf.validate.field).repeated.max_items = 128];
  // Price is a separate immutable authority. A Site cannot expose an offer
  // whose exact price revision was not approved in the same assignment.
  repeated CommerceRevisionTarget offer_price_revisions = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
}
message SiteAssignmentExecutionResult {
  optional SiteCommerceAssignmentView previous = 1;
  SiteCommerceAssignmentView applied = 2 [(buf.validate.field).required = true];
  string assignment_fact_digest = 3 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}
message SiteCommerceAssignmentView {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  SiteCommerceAssignmentCandidate assignment = 2 [(buf.validate.field).required = true];
  CommerceExecutionState state = 3 [(buf.validate.field).enum.const = 3];
  string activation_eligibility_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  google.protobuf.Timestamp applied_at = 5 [(buf.validate.field).required = true];
}
message RequestSiteCommerceAssignmentPromotionEffect {
  option (buf.validate.message).cel = {
    id: "commerce.assignment.cas_successor"
    message: "the assignment revision is exactly the next CAS revision"
    expression: "this.candidate.target.target_revision == this.expected_active_version + 1u"
  };
  SiteCommerceAssignmentCandidate candidate = 1 [(buf.validate.field).required = true];
  uint64 expected_active_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  string command_digest = 3 [(buf.validate.field).string = {pattern: "^[0-9a-f]{64}$"}];
  string reason = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
  string eligibility_evidence_digest = 5 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}
message RequestSiteCommerceAssignmentPromotionRequest {
  option (buf.validate.message).cel = {
    id: "commerce.site_assignment.command_digest"
    message: "effect digest must be the authenticated command digest"
    expression: "this.context.operator.command.request_digest == this.effect.command_digest"
  };
  CommerceSiteCommandContext context = 1 [(buf.validate.field).required = true];
  RequestSiteCommerceAssignmentPromotionEffect effect = 2 [(buf.validate.field).required = true];
}
message RequestSiteCommerceAssignmentPromotionResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CommerceApprovalView approval = 2 [(buf.validate.field).required = true];
}
message DecideSiteCommerceAssignmentPromotionRequest {
  CommerceSiteCommandContext context = 1 [(buf.validate.field).required = true];
  CommerceApprovalDecisionEffect decision = 2 [(buf.validate.field).required = true];
}
message DecideSiteCommerceAssignmentPromotionResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CommerceApprovalView approval = 2 [(buf.validate.field).required = true];
  optional CommerceExecutionView execution = 3;
}

enum CodeBatchState {
  CODE_BATCH_STATE_UNSPECIFIED = 0;
  CODE_BATCH_STATE_REQUESTED = 1;
  CODE_BATCH_STATE_GENERATION_QUEUED = 2;
  CODE_BATCH_STATE_GENERATING = 3;
  CODE_BATCH_STATE_DELIVERABLE = 4;
  CODE_BATCH_STATE_ACTIVE = 5;
  CODE_BATCH_STATE_SUSPENDED = 6;
  CODE_BATCH_STATE_REVOKED = 7;
  CODE_BATCH_STATE_EXPIRED = 8;
  CODE_BATCH_STATE_COMPROMISED = 9;
  CODE_BATCH_STATE_FAILED = 10;
  CODE_BATCH_STATE_OUTCOME_UNKNOWN = 11;
}
enum CodeDeliveryState {
  CODE_DELIVERY_STATE_UNSPECIFIED = 0;
  CODE_DELIVERY_STATE_AVAILABLE = 1;
  CODE_DELIVERY_STATE_CLAIMED = 2;
  CODE_DELIVERY_STATE_STREAMING = 3;
  CODE_DELIVERY_STATE_DELIVERED = 4;
  CODE_DELIVERY_STATE_UNKNOWN = 5;
  CODE_DELIVERY_STATE_EXPIRED = 6;
  CODE_DELIVERY_STATE_DISPOSED = 7;
}
enum CodeCipherSuite {
  CODE_CIPHER_SUITE_UNSPECIFIED = 0;
  CODE_CIPHER_SUITE_X25519_XCHACHA20_POLY1305_V1 = 1;
  CODE_CIPHER_SUITE_KMS_ENVELOPE_AES_256_GCM_V1 = 2;
}
message CodeBatchSpecification {
  CommerceRevisionTarget redemption_program_revision = 1 [(buf.validate.field).required = true];
  uint32 code_count = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000
  }];
  uint32 code_length = 3 [(buf.validate.field).uint32 = {
    gte: 20
    lte: 128
  }];
  string format_version = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 64
  }];
  string alphabet_ref = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  uint32 minimum_entropy_bits = 6 [(buf.validate.field).uint32 = {
    gte: 128
    lte: 512
  }];
  string delivery_recipient_ref = 7 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string recipient_key_revision_ref = 8 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string recipient_key_fingerprint = 9 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}
message EncryptedCodeArtifact {
  string artifact_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 artifact_version = 2 [(buf.validate.field).uint64.gt = 0];
  string artifact_digest = 3 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string etag = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 encrypted_size = 5 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 536870912
  }];
  string encrypted_digest = 6 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string inventory_root = 7 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  CodeCipherSuite cipher_suite = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string recipient_key_fingerprint = 9 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string wrapped_data_key_ref = 10 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string generator_workload_ref = 11 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string generator_attestation_digest = 12 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  google.protobuf.Timestamp expires_at = 13 [(buf.validate.field).required = true];
}
message DeliveryRangeLease {
  option (buf.validate.message).cel = {
    id: "commerce.delivery_lease.range"
    message: "a lease always advances a non-empty range"
    expression: "this.end_offset_exclusive > this.start_offset"
  };
  string lease_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 lease_version = 2 [(buf.validate.field).uint64.const = 1];
  uint64 start_offset = 3;
  uint64 end_offset_exclusive = 4 [(buf.validate.field).uint64.gt = 0];
  string encrypted_chunk_digest = 5 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  kokoro.common.v2.CommandIdentityV2 lease_command = 6 [(buf.validate.field).required = true];
  string lease_digest = 7 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  google.protobuf.Timestamp expires_at = 8 [(buf.validate.field).required = true];
}
message RecipientDeliveryAcknowledgement {
  string recipient_actor_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string recipient_key_fingerprint = 2 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string challenge_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string artifact_ref = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string artifact_digest = 5 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string inventory_root = 6 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  uint64 delivered_bytes = 7 [(buf.validate.field).uint64.gt = 0];
  string signature_algorithm = 8 [(buf.validate.field).string = {pattern: "^(ed25519|ecdsa-p256-sha256)$"}];
  bytes signature = 9 [(buf.validate.field).bytes = {
    min_len: 32
    max_len: 512
  }];
  google.protobuf.Timestamp acknowledged_at = 10 [(buf.validate.field).required = true];
  string acknowledgement_digest = 11 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}
message SecretDeliverySessionView {
  option (buf.validate.message).cel = {
    id: "commerce.delivery.offset"
    message: "delivery offset and active lease must stay within the encrypted artifact"
    expression: "this.next_offset <= this.artifact.encrypted_size && (!has(this.active_range) || (this.active_range.start_offset == this.next_offset && this.active_range.end_offset_exclusive > this.active_range.start_offset && this.active_range.end_offset_exclusive <= this.artifact.encrypted_size))"
  };
  option (buf.validate.message).cel = {
    id: "commerce.delivery.lifecycle"
    message: "only a completely acknowledged artifact is delivered"
    expression: "(this.state == 4 && this.next_offset == this.artifact.encrypted_size && has(this.final_recipient_ack) && !has(this.active_range)) || (this.state in [1, 2, 3] && !has(this.final_recipient_ack)) || (this.state in [5, 6, 7] && !has(this.active_range))"
  };
  option (buf.validate.message).cel = {
    id: "commerce.delivery.ack_binding"
    message: "recipient acknowledgement binds the exact artifact, inventory and delivered byte count"
    expression: "!has(this.final_recipient_ack) || (this.final_recipient_ack.recipient_actor_ref == this.recipient_actor_ref && this.final_recipient_ack.recipient_key_fingerprint == this.artifact.recipient_key_fingerprint && this.final_recipient_ack.artifact_ref == this.artifact.artifact_ref && this.final_recipient_ack.artifact_digest == this.artifact.artifact_digest && this.final_recipient_ack.inventory_root == this.artifact.inventory_root && this.final_recipient_ack.delivered_bytes == this.artifact.encrypted_size)"
  };
  string session_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 session_version = 2 [(buf.validate.field).uint64.gt = 0];
  string session_digest = 3 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string site_id = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string batch_ref = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
