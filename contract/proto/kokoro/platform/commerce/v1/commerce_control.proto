    expression: "this.context.operator.command.request_digest == this.effect.command_digest"
  };
  CommerceSiteCommandContext context = 1 [(buf.validate.field).required = true];
  RequestCodeBatchIssuanceEffect effect = 2 [(buf.validate.field).required = true];
}
message RequestCodeBatchIssuanceResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CommerceApprovalAuthorityView approval = 2 [(buf.validate.field).required = true];
}
message DecideCodeBatchIssuanceRequest {
  CommerceSiteCommandContext context = 1 [(buf.validate.field).required = true];
  CommerceApprovalDecisionEffect decision = 2 [(buf.validate.field).required = true];
}
message DecideCodeBatchIssuanceResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CommerceApprovalAuthorityView approval = 2 [(buf.validate.field).required = true];
  optional CommerceExecutionView execution = 3;
}

enum CodeBatchTransitionAction {
  CODE_BATCH_TRANSITION_ACTION_UNSPECIFIED = 0;
  CODE_BATCH_TRANSITION_ACTION_ACTIVATE = 1;
  CODE_BATCH_TRANSITION_ACTION_RESUME = 2;
  CODE_BATCH_TRANSITION_ACTION_REVOKE = 3;
}
message RequestCodeBatchTransitionEffect {
  option (buf.validate.message).cel = {
    id: "commerce.batch_transition.shape"
    message: "activation alone carries delivery and disposal evidence"
    expression: "(this.action == 1 && has(this.activation_evidence) && this.expected_state == 4) || (this.action == 2 && !has(this.activation_evidence) && this.expected_state == 6) || (this.action == 3 && !has(this.activation_evidence) && this.expected_state in [1, 2, 3, 4, 5, 6, 9, 11])"
  };
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.gt = 0];
  CodeBatchState expected_state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CodeBatchTransitionAction action = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional CodeBatchActivationEvidence activation_evidence = 5;
  string command_digest = 6 [(buf.validate.field).string = {pattern: "^[0-9a-f]{64}$"}];
  string reason = 7 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}
message ActivateCodeBatchExecution {
  CodeBatchActivationEvidence activation_evidence = 1 [(buf.validate.field).required = true];
  CodeBatchView batch = 2 [(buf.validate.field).required = true];
}
message RequestCodeBatchTransitionRequest {
  option (buf.validate.message).cel = {
    id: "commerce.batch_transition.command_digest"
    message: "effect digest must be the authenticated command digest"
    expression: "this.context.operator.command.request_digest == this.effect.command_digest"
  };
  CommerceSiteCommandContext context = 1 [(buf.validate.field).required = true];
  RequestCodeBatchTransitionEffect effect = 2 [(buf.validate.field).required = true];
}
message RequestCodeBatchTransitionResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CommerceApprovalAuthorityView approval = 2 [(buf.validate.field).required = true];
}
message DecideCodeBatchTransitionRequest {
  CommerceSiteCommandContext context = 1 [(buf.validate.field).required = true];
  CommerceApprovalDecisionEffect decision = 2 [(buf.validate.field).required = true];
}
message DecideCodeBatchTransitionResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CommerceApprovalAuthorityView approval = 2 [(buf.validate.field).required = true];
  optional CommerceExecutionView execution = 3;
}
message EmergencySuspendCodeBatchEffect {
  CommerceRevisionTarget target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.gt = 0];
  CodeBatchState expected_state = 3 [(buf.validate.field).enum.const = 5];
  string command_digest = 4 [(buf.validate.field).string = {pattern: "^[0-9a-f]{64}$"}];
  string incident_ref = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string reason = 6 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}
message EmergencySuspendCodeBatchRequest {
  option (buf.validate.message).cel = {
    id: "commerce.emergency_suspend.breakglass"
    message: "emergency suspension requires phishing-resistant breakglass"
    expression: "has(this.context.operator.scope.breakglass) && this.context.operator.assurance_level == 3 && has(this.context.operator.step_up_at)"
  };
  option (buf.validate.message).cel = {
    id: "commerce.emergency_suspend.command_digest"
    message: "effect digest must be the authenticated command digest"
