syntax = "proto3";

package kokoro.platform.admission.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v1/receipt.proto";

// AdmissionService is the sole Platform owner for pre-dispatch run admission.
// Session supplies intent and opaque authorization evidence only. Platform resolves
// namespace, capability, model route, budget/Hold and AuthorizationSegment facts.
// None of those owner facts may be asserted by Session in PrepareRunEffect.
service AdmissionService {
  rpc PrepareRun(PrepareRunRequest) returns (PrepareRunResponse) {}
  rpc FinalizeRunAuthorization(FinalizeRunAuthorizationRequest) returns (FinalizeRunAuthorizationResponse) {}
  rpc ReleaseRunAuthorization(ReleaseRunAuthorizationRequest) returns (ReleaseRunAuthorizationResponse) {}
  rpc ReconcileRunAuthorization(ReconcileRunAuthorizationRequest) returns (ReconcileRunAuthorizationResponse) {}
  rpc GetCommandReceipt(GetCommandReceiptRequest) returns (GetCommandReceiptResponse) {}
}

enum AdmissionOperation {
  ADMISSION_OPERATION_UNSPECIFIED = 0;
  ADMISSION_OPERATION_PREPARE_RUN = 1;
  ADMISSION_OPERATION_FINALIZE_RUN_AUTHORIZATION = 2;
  ADMISSION_OPERATION_RELEASE_RUN_AUTHORIZATION = 3;
  ADMISSION_OPERATION_RECONCILE_RUN_AUTHORIZATION = 4;
}

enum AdmissionRetryClass {
  ADMISSION_RETRY_CLASS_UNSPECIFIED = 0;
  ADMISSION_RETRY_CLASS_NEVER = 1;
  ADMISSION_RETRY_CLASS_AFTER_DELAY = 2;
  ADMISSION_RETRY_CLASS_AFTER_USER_ACTION = 3;
  ADMISSION_RETRY_CLASS_RECONCILE_RECEIPT = 4;
}

// Browser-safe capability classification. These values describe presentation
// labels only; package ids, secret refs and executable configuration stay out of
// the admission snapshot.
enum SafeCapabilityKind {
  SAFE_CAPABILITY_KIND_UNSPECIFIED = 0;
  SAFE_CAPABILITY_KIND_SKILL = 1;
  SAFE_CAPABILITY_KIND_MCP = 2;
}

message SafeCapabilityDisplay {
  SafeCapabilityKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
}

message SafeAdmissionSnapshot {
  string model_label = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  optional string agent_label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  // Retained only for wire/source compatibility with the pre-provider draft.
  // Active providers leave it empty and populate typed capabilities below.
  repeated string capability_labels = 3 [
    deprecated = true,
    (buf.validate.field).repeated = {
      max_items: 64
      items: {
        string: {
          min_len: 1
          max_len: 191
        }
      }
    }
  ];
  optional string estimated_cost_display = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  string policy_decision_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated SafeCapabilityDisplay capabilities = 6 [(buf.validate.field).repeated.max_items = 64];
}

// Encrypted material is audience-bound to Session's dispatch worker. It is not a
// bearer credential and must never be returned to a browser or persisted in logs.
message EncryptedRunRequestMaterial {
  bytes ciphertext = 1 [(buf.validate.field).bytes = {
    min_len: 32
    max_len: 1048576
  }];
  string encryption_algorithm = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string key_revision_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string audience = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  google.protobuf.Timestamp expires_at = 5 [(buf.validate.field).required = true];
  string plaintext_sha256 = 6 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message InitialCapabilityIntent {
  optional string requested_agent_option_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated string requested_skill_option_refs = 2 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  repeated string requested_mcp_option_refs = 3 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
}

message ClientRunIntent {
  optional string effort = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string locale = 2 [(buf.validate.field).string = {
    min_len: 2
    max_len: 35
  }];
}

message AttachmentAdmissionRef {
  string asset_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string asset_version_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string asset_grant_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message PrepareRunEffect {
  string session_access_grant = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
  string project_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string session_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string launch_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string proposed_run_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string trigger_message_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string model_option_revision_ref = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated AttachmentAdmissionRef attachment_refs = 8 [(buf.validate.field).repeated.max_items = 64];
  repeated string interaction_prerequisite_refs = 9 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  optional InitialCapabilityIntent initial_intent = 10;
  ClientRunIntent client_intent = 11 [(buf.validate.field).required = true];
}

message PrepareRunRequest {
  kokoro.common.v1.CommandIdentity command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  PrepareRunEffect effect = 3 [(buf.validate.field).required = true];
}

message PreparedRunAuthorization {
  string manifest_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string manifest_digest = 2 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string session_execution_binding_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  EncryptedRunRequestMaterial run_request_material = 4 [(buf.validate.field).required = true];
  string capability_snapshot_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string configuration_revision_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string execution_budget_root_ref = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string root_hold_ref = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string authorization_segment_ref = 9 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 segment_version = 10 [(buf.validate.field).uint64.gte = 1];
  google.protobuf.Timestamp expires_at = 11 [(buf.validate.field).required = true];
  SafeAdmissionSnapshot safe_admission_snapshot = 12 [(buf.validate.field).required = true];
}

message AdmissionDenial {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  AdmissionRetryClass retry_class = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional string safe_details = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
}

message AdmissionPending {
  google.protobuf.Timestamp retry_after = 1 [(buf.validate.field).required = true];
}

message AdmissionOutcomeUnknown {
  AdmissionRetryClass retry_class = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  google.protobuf.Timestamp retry_after = 2 [(buf.validate.field).required = true];
}

message PrepareRunAccepted {
  PreparedRunAuthorization prepared = 1 [(buf.validate.field).required = true];
}

message PrepareRunWaitingPrerequisite {
  PreparedRunAuthorization prepared = 1 [(buf.validate.field).required = true];
  repeated string prerequisite_refs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
}

message PrepareRunResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
  oneof result {
    option (buf.validate.oneof).required = true;
    PrepareRunAccepted accepted = 2;
    PrepareRunWaitingPrerequisite waiting_prerequisite = 3;
    AdmissionDenial denied = 4;
    AdmissionPending pending = 5;
    AdmissionOutcomeUnknown outcome_unknown = 6;
  }
}

message FinalizeRunAuthorizationEffect {
  string manifest_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string manifest_digest = 2 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string authorization_segment_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 expected_segment_version = 4 [(buf.validate.field).uint64.gte = 1];
  string launch_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string session_intent_receipt_ref = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated string prerequisite_receipt_refs = 7 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
}

message FinalizeRunAuthorizationRequest {
  kokoro.common.v1.CommandIdentity command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  FinalizeRunAuthorizationEffect effect = 3 [(buf.validate.field).required = true];
}

message CommittedRunAuthorization {
  string authorization_segment_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 segment_version = 2 [(buf.validate.field).uint64.gte = 1];
  google.protobuf.Timestamp committed_at = 3 [(buf.validate.field).required = true];
}

message AuthorizationExpired {
  google.protobuf.Timestamp expired_at = 1 [(buf.validate.field).required = true];
}

message FinalizeRunAuthorizationResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
  oneof result {
    option (buf.validate.oneof).required = true;
    CommittedRunAuthorization committed = 2;
    AuthorizationExpired expired = 3;
    AdmissionDenial denied = 4;
    AdmissionPending pending = 5;
    AdmissionOutcomeUnknown outcome_unknown = 6;
  }
}

message ReleaseRunAuthorizationEffect {
  string manifest_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string authorization_segment_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 expected_segment_version = 3 [(buf.validate.field).uint64.gte = 1];
  string reason_code = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string no_dispatch_evidence_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message ReleaseRunAuthorizationRequest {
  kokoro.common.v1.CommandIdentity command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ReleaseRunAuthorizationEffect effect = 3 [(buf.validate.field).required = true];
}

message ReleasedRunAuthorization {
  string authorization_segment_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 segment_version = 2 [(buf.validate.field).uint64.gte = 1];
  google.protobuf.Timestamp released_at = 3 [(buf.validate.field).required = true];
}

message AlreadyReleasedRunAuthorization {
  ReleasedRunAuthorization release = 1 [(buf.validate.field).required = true];
}

message AuthorizationNotReleasable {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string safe_details = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
}

message ReleaseRunAuthorizationResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
  oneof result {
    option (buf.validate.oneof).required = true;
    ReleasedRunAuthorization released = 2;
    AlreadyReleasedRunAuthorization already_released = 3;
    AuthorizationNotReleasable not_releasable = 4;
    AdmissionPending pending = 5;
    AdmissionOutcomeUnknown outcome_unknown = 6;
  }
}

message ReconcileRunAuthorizationEffect {
  string manifest_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string authorization_segment_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 expected_segment_version = 3 [(buf.validate.field).uint64.gte = 1];
  optional string session_dispatch_receipt_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string ga_durable_event_receipt_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string terminal_owner_evidence_ref = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message ReconcileRunAuthorizationRequest {
  kokoro.common.v1.CommandIdentity command = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ReconcileRunAuthorizationEffect effect = 3 [(buf.validate.field).required = true];
}

message AuthorizationReconciliationResult {
  string authorization_segment_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 segment_version = 2 [(buf.validate.field).uint64.gte = 1];
  google.protobuf.Timestamp observed_at = 3 [(buf.validate.field).required = true];
  optional string safe_status_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message ReconcileRunAuthorizationResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
  oneof result {
    option (buf.validate.oneof).required = true;
    AuthorizationReconciliationResult execution_observed = 2;
    AuthorizationReconciliationResult released_no_effect = 3;
    AuthorizationReconciliationResult awaiting_owner_evidence = 4;
    AuthorizationReconciliationResult reconciliation_required = 5;
    AuthorizationReconciliationResult settled = 6;
    AdmissionPending pending = 7;
    AdmissionOutcomeUnknown outcome_unknown = 8;
  }
}

message GetCommandReceiptRequest {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  AdmissionOperation operation = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string command_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  kokoro.common.v1.CommandDigestAlgorithm digest_algorithm = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string request_digest = 5 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message CommandReceiptNotFound {}

message GetCommandReceiptResponse {
  // Present for every found result and byte-identical to the receipt nested in the typed result.
  // A generic recovery client can therefore reconcile command identity without knowing which
  // operation-specific result arm was returned. It is absent only for not_found.
  optional kokoro.common.v1.CommandReceipt receipt = 1;
  oneof result {
    option (buf.validate.oneof).required = true;
    PrepareRunResponse prepare_run = 2;
    FinalizeRunAuthorizationResponse finalize_run_authorization = 3;
    ReleaseRunAuthorizationResponse release_run_authorization = 4;
    ReconcileRunAuthorizationResponse reconcile_run_authorization = 5;
    CommandReceiptNotFound not_found = 6;
  }
}
