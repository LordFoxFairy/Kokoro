syntax = "proto3";

package kokoro.platform.admin.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v1/receipt.proto";

// AdminQueryService is the read-only privileged control-plane surface.
service AdminQueryService {
  rpc GetSite(GetSiteRequest) returns (GetSiteResponse) {}
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse) {}
  rpc GetUserWithinSite(GetUserWithinSiteRequest) returns (GetUserWithinSiteResponse) {}
  rpc GetAuditWithinScope(GetAuditWithinScopeRequest) returns (GetAuditWithinScopeResponse) {}
}

// AdminCommandService coordinates approval for non-lifecycle administrative effects.
// Site lifecycle effects have their own typed service and are deliberately absent here.
service AdminCommandService {
  rpc PrepareCommand(PrepareCommandRequest) returns (PrepareCommandResponse) {}
  rpc SubmitForApproval(SubmitForApprovalRequest) returns (SubmitForApprovalResponse) {}
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse) {}
  rpc ExecuteApproved(ExecuteApprovedRequest) returns (ExecuteApprovedResponse) {}
  rpc GetReceipt(GetReceiptRequest) returns (GetReceiptResponse) {}
}

message SecurityEpochs {
  uint64 operator_security_epoch = 1;
  uint64 session_epoch = 2;
  uint64 restriction_epoch = 3;
  uint64 policy_epoch = 4;
  optional uint64 site_security_epoch = 5;
}

message SiteScope {
  repeated string site_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  string environment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GlobalScope {
  string grant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message BreakGlassScope {
  string grant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string incident_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string authorized_operation = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated string resource_refs = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  repeated string field_allowlist = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  google.protobuf.Timestamp expires_at = 8 [(buf.validate.field).required = true];
}

message OperatorScope {
  oneof kind {
    option (buf.validate.oneof).required = true;
    SiteScope site = 1;
    GlobalScope global = 2;
    BreakGlassScope breakglass = 3;
  }
}

message AdminQueryContext {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string managed_device_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  SecurityEpochs security_epochs = 5 [(buf.validate.field).required = true];
  OperatorScope scope = 6 [(buf.validate.field).required = true];
}

message AdminCommandContext {
  kokoro.common.v1.CommandIdentity command = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string managed_device_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  SecurityEpochs security_epochs = 5 [(buf.validate.field).required = true];
  OperatorScope scope = 6 [(buf.validate.field).required = true];
}

message SiteSummary {
  string site_ref = 1 [(buf.validate.field).string.max_len = 128];
  string status = 2 [(buf.validate.field).string.max_len = 64];
  uint64 security_epoch = 3;
}

message UserSummary {
  string user_ref = 1 [(buf.validate.field).string.max_len = 128];
  string status = 2 [(buf.validate.field).string.max_len = 64];
  uint64 security_epoch = 3;
}

message AuditRecord {
  string audit_ref = 1 [(buf.validate.field).string.max_len = 128];
  string action_code = 2 [(buf.validate.field).string.max_len = 128];
  google.protobuf.Timestamp occurred_at = 3;
}

message GetSiteRequest {
  AdminQueryContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetSiteResponse {
  SiteSummary site = 1 [(buf.validate.field).required = true];
}

message ListSitesRequest {
  AdminQueryContext context = 1 [(buf.validate.field).required = true];
  optional string page_token = 2 [(buf.validate.field).string.max_len = 256];
  uint32 page_size = 3 [(buf.validate.field).uint32.lte = 200];
}

message ListSitesResponse {
  repeated SiteSummary sites = 1 [(buf.validate.field).repeated.max_items = 200];
  optional string next_page_token = 2 [(buf.validate.field).string.max_len = 256];
}

message GetUserWithinSiteRequest {
  AdminQueryContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string user_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetUserWithinSiteResponse {
  UserSummary user = 1 [(buf.validate.field).required = true];
}

message GetAuditWithinScopeRequest {
  AdminQueryContext context = 1 [(buf.validate.field).required = true];
  optional string page_token = 2 [(buf.validate.field).string.max_len = 256];
  uint32 page_size = 3 [(buf.validate.field).uint32.lte = 200];
}

message GetAuditWithinScopeResponse {
  repeated AuditRecord records = 1 [(buf.validate.field).repeated.max_items = 200];
  optional string next_page_token = 2 [(buf.validate.field).string.max_len = 256];
}

message DisableUserChange {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string user_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string reason_code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message UpdateOperatorScopeChange {
  string operator_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  OperatorScope replacement_scope = 2 [(buf.validate.field).required = true];
}

message UpdatePolicyChange {
  string policy_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string policy_revision_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message PrepareCommandEffect {
  oneof change {
    option (buf.validate.oneof).required = true;
    DisableUserChange disable_user = 1;
    UpdateOperatorScopeChange update_operator_scope = 2;
    UpdatePolicyChange update_policy = 3;
  }
  string reason = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message PrepareCommandRequest {
  AdminCommandContext context = 1 [(buf.validate.field).required = true];
  PrepareCommandEffect effect = 2 [(buf.validate.field).required = true];
}

message PrepareCommandResponse {
  string prepared_command_ref = 1 [(buf.validate.field).string.max_len = 128];
  string approval_policy_ref = 2 [(buf.validate.field).string.max_len = 128];
  kokoro.common.v1.CommandReceipt receipt = 3 [(buf.validate.field).required = true];
}

message SubmitForApprovalEffect {
  string prepared_command_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message SubmitForApprovalRequest {
  AdminCommandContext context = 1 [(buf.validate.field).required = true];
  SubmitForApprovalEffect effect = 2 [(buf.validate.field).required = true];
}

message SubmitForApprovalResponse {
  string approval_ref = 1 [(buf.validate.field).string.max_len = 128];
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_REJECT = 2;
}

message DecideApprovalEffect {
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ApprovalDecision decision = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message DecideApprovalRequest {
  AdminCommandContext context = 1 [(buf.validate.field).required = true];
  DecideApprovalEffect effect = 2 [(buf.validate.field).required = true];
}

message DecideApprovalResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
}

message ExecuteApprovedEffect {
  string prepared_command_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string approval_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ExecuteApprovedRequest {
  AdminCommandContext context = 1 [(buf.validate.field).required = true];
  ExecuteApprovedEffect effect = 2 [(buf.validate.field).required = true];
}

message ExecuteApprovedResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
}

message GetReceiptRequest {
  AdminQueryContext context = 1 [(buf.validate.field).required = true];
  string command_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  kokoro.common.v1.CommandDigestAlgorithm digest_algorithm = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string request_digest = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message GetReceiptResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
}
