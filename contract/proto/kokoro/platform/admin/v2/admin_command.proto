syntax = "proto3";

package kokoro.platform.admin.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/admin/v2/admin_shared.proto";

// AdminCommandService coordinates approval for non-lifecycle administrative effects.
// Site lifecycle effects have their own typed service and are deliberately absent here.
// A client can submit and govern a command, but can never execute an approved effect. Approval
// commits only an execution_queued transition. The Platform Worker is the sole authority that
// claims the durable execution intent, revalidates the frozen maker/checker authority epochs, and
// atomically records the effect and terminal receipt.
service AdminCommandService {
  rpc SubmitCommand(SubmitCommandRequest) returns (SubmitCommandResponse) {}
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse) {}
  rpc DecidePostEffectReview(DecidePostEffectReviewRequest) returns (DecidePostEffectReviewResponse) {}
  rpc GetReceipt(GetReceiptRequest) returns (GetReceiptResponse) {}
}

enum OperatorAuthorityChangeAction {
  OPERATOR_AUTHORITY_CHANGE_ACTION_UNSPECIFIED = 0;
  OPERATOR_AUTHORITY_CHANGE_ACTION_PROVISION = 1;
  OPERATOR_AUTHORITY_CHANGE_ACTION_REPLACE = 2;
  OPERATOR_AUTHORITY_CHANGE_ACTION_SUSPEND = 3;
  OPERATOR_AUTHORITY_CHANGE_ACTION_REVOKE = 4;
}

// This is the exact worker-owned authority aggregate accepted by
// platform.apply_admin_authority_change. User lifecycle and policy mutations belong to their
// domain-specific owner services and must not be advertised through this control-plane service.
message ChangeOperatorAuthority {
  OperatorAuthorityChangeAction action = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string operator_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 operator_generation = 3 [(buf.validate.field).uint64.gt = 0];
  optional uint64 expected_authorization_epoch = 4 [(buf.validate.field).uint64.gt = 0];
  repeated string permissions = 5 [(buf.validate.field).repeated = {
    max_items: 256
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  repeated string site_ids = 6 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  repeated string environments = 7 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  repeated string regions = 8 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp break_glass_expires_at = 10;
}

message SubmitCommandEffect {
  ChangeOperatorAuthority change = 1 [(buf.validate.field).required = true];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message SubmitCommandRequest {
  AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  SubmitCommandEffect effect = 2 [(buf.validate.field).required = true];
}

enum SubmitCommandState {
  SUBMIT_COMMAND_STATE_UNSPECIFIED = 0;
  SUBMIT_COMMAND_STATE_PENDING_APPROVAL = 1;
  SUBMIT_COMMAND_STATE_COMMITTED = 2;
}

message SubmitCommandResponse {
  SubmitCommandState state = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Present exactly when state is PENDING_APPROVAL.
  optional string approval_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Present only for a committed break-glass effect that requires independent post-effect review.
  optional string post_effect_review_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  kokoro.common.v2.CommandReceiptV2 receipt = 4 [(buf.validate.field).required = true];
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_REJECT = 2;
}

message DecideApprovalEffect {
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ApprovalDecision decision = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message DecideApprovalRequest {
  AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  DecideApprovalEffect effect = 2 [(buf.validate.field).required = true];
}

enum ApprovalDecisionState {
  APPROVAL_DECISION_STATE_UNSPECIFIED = 0;
  // The approval decision is committed and a durable Platform Worker intent now owns execution.
  APPROVAL_DECISION_STATE_EXECUTION_QUEUED = 1;
  // The checker rejected the proposed command without creating execution authority.
  APPROVAL_DECISION_STATE_REJECTED = 2;
  // The decision request itself failed authorization or frozen-authority validation.
  APPROVAL_DECISION_STATE_DENIED = 3;
}

message DecideApprovalResponse {
  ApprovalDecisionState state = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  kokoro.common.v2.CommandReceiptV2 receipt = 2 [(buf.validate.field).required = true];
}

enum PostEffectReviewDecision {
  POST_EFFECT_REVIEW_DECISION_UNSPECIFIED = 0;
  POST_EFFECT_REVIEW_DECISION_ACKNOWLEDGE = 1;
  POST_EFFECT_REVIEW_DECISION_ESCALATE = 2;
}

message DecidePostEffectReviewEffect {
  string review_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  PostEffectReviewDecision decision = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message DecidePostEffectReviewRequest {
  AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  DecidePostEffectReviewEffect effect = 2 [(buf.validate.field).required = true];
}

enum PostEffectReviewState {
  POST_EFFECT_REVIEW_STATE_UNSPECIFIED = 0;
  POST_EFFECT_REVIEW_STATE_ACKNOWLEDGED = 1;
  POST_EFFECT_REVIEW_STATE_ESCALATED = 2;
  POST_EFFECT_REVIEW_STATE_DENIED = 3;
}

message DecidePostEffectReviewResponse {
  PostEffectReviewState state = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  kokoro.common.v2.CommandReceiptV2 receipt = 2 [(buf.validate.field).required = true];
}

message GetReceiptRequest {
  AuthenticatedOperatorQueryContext context = 1 [(buf.validate.field).required = true];
  string command_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  kokoro.common.v2.CommandDigestAlgorithmV2 digest_algorithm = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string request_digest = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message GetReceiptResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
}
