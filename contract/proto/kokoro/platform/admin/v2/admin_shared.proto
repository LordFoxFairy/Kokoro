syntax = "proto3";

package kokoro.platform.admin.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";

// SecurityEpochs binds an authenticated operator request to current revocation state.
message SecurityEpochs {
  uint64 operator_security_epoch = 1;
  uint64 session_epoch = 2;
  uint64 restriction_epoch = 3;
  uint64 policy_epoch = 4;
  optional uint64 site_security_epoch = 5;
}

message SiteScope {
  repeated string site_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  string environment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GlobalScope {
  string grant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message BreakGlassScope {
  string grant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string incident_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string authorized_operation = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated string resource_refs = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  repeated string field_allowlist = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  google.protobuf.Timestamp expires_at = 8 [(buf.validate.field).required = true];
}

message OperatorScope {
  oneof kind {
    option (buf.validate.oneof).required = true;
    SiteScope site = 1;
    GlobalScope global = 2;
    BreakGlassScope breakglass = 3;
  }
}

message AuthenticatedOperatorQueryContext {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string operator_session_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string managed_device_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  SecurityEpochs security_epochs = 6 [(buf.validate.field).required = true];
  OperatorScope scope = 7 [(buf.validate.field).required = true];
}

message AuthenticatedOperatorCommandContext {
  kokoro.common.v2.CommandIdentityV2 command = 1 [(buf.validate.field).required = true];
  string operator_session_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string environment = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string region = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string managed_device_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  SecurityEpochs security_epochs = 6 [(buf.validate.field).required = true];
  OperatorScope scope = 7 [(buf.validate.field).required = true];
  // Stable operator subject from the verified Platform session. This is distinct from the
  // session reference and must be bound into every privileged command digest.
  string actor_ref = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}
