syntax = "proto3";

package kokoro.platform.site.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/admin/v2/admin_shared.proto";
import "kokoro/platform/publication/v1/publication_common.proto";

// SitePublicationService owns Site-specific immutable publication records. It
// consumes Product Catalog/Profile revisions but cannot publish or edit them.
// Activation and active-pointer CAS remain on SiteLifecycleService.
service SitePublicationService {
  rpc AuthorizeSiteReleaseCandidate(AuthorizeSiteReleaseCandidateRequest) returns (AuthorizeSiteReleaseCandidateResponse) {}
  // The provider MUST execute this as one transaction-local compare-and-swap
  // over (site_id, candidate_ref). A first execution verifies the complete
  // Candidate binding, current AUTHORIZED state, and current epoch equal to the
  // expectation before persisting REVOKED, epoch + 1, and the COMMITTED receipt.
  // Only the same command identity and request digest may return that persisted
  // result with replayed=true, without advancing the epoch again. A different
  // command, stale epoch, cross-Site/binding mismatch, or already-revoked
  // Candidate is a conflict, never a replay. REVOKED is permanent for the exact
  // Candidate identity/version/digest; AuthorizeSiteReleaseCandidate cannot
  // revive it, and a later publication attempt requires a new Candidate.
  rpc RevokeSiteReleaseCandidate(RevokeSiteReleaseCandidateRequest) returns (RevokeSiteReleaseCandidateResponse) {}
  rpc PublishSurfaceInventory(PublishSurfaceInventoryRequest) returns (PublishSurfaceInventoryResponse) {}
  rpc PublishWebBuildMaterialBundle(PublishWebBuildMaterialBundleRequest) returns (PublishWebBuildMaterialBundleResponse) {}
  rpc IssueWebBuildIntent(IssueWebBuildIntentRequest) returns (IssueWebBuildIntentResponse) {}
  rpc PublishReleaseCertification(PublishReleaseCertificationRequest) returns (PublishReleaseCertificationResponse) {}
  rpc PublishSiteRelease(PublishSiteReleaseRequest) returns (PublishSiteReleaseResponse) {}
}

// SiteEvidenceAdmissionService is the sole machine ingress. The authenticated
// controller/attestor workload may submit immutable evidence references, but
// cannot authorize a candidate, issue an intent, certify, publish a release,
// or activate a pointer. Platform must compare every context axis with the
// authenticated transport identity and verify the referenced DSSE/provenance,
// registered producer, and artifact digest before committing a receipt.
service SiteEvidenceAdmissionService {
  rpc RecordReleaseEvidence(RecordReleaseEvidenceRequest) returns (RecordReleaseEvidenceResponse) {}
}

message AuthorizeSiteReleaseCandidateEffect {
  string candidate_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 expected_candidate_version = 2 [(buf.validate.field).uint64 = {gte: 1}];
  uint64 candidate_authorization_epoch = 3 [(buf.validate.field).uint64 = {gte: 1}];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding launch_product_profile = 4 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding product_surface_catalog = 5 [(buf.validate.field).required = true];
  string business_bindings_digest = 6 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string reason = 7 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message AuthorizeSiteReleaseCandidateRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  AuthorizeSiteReleaseCandidateEffect effect = 3 [(buf.validate.field).required = true];
}

message AuthorizeSiteReleaseCandidateResponse {
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  bool replayed = 2;
  kokoro.common.v2.CommandReceiptV2 receipt = 3 [(buf.validate.field).required = true];
}

enum SiteReleaseCandidateAuthorizationState {
  SITE_RELEASE_CANDIDATE_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  SITE_RELEASE_CANDIDATE_AUTHORIZATION_STATE_AUTHORIZED = 1;
  SITE_RELEASE_CANDIDATE_AUTHORIZATION_STATE_REVOKED = 2;
}

message RevokeSiteReleaseCandidateEffect {
  option (buf.validate.message).cel = {
    id: "site_release_candidate_revoke.expected_epoch_matches_binding"
    message: "candidate binding epoch must equal the expected authorization epoch"
    expression: "this.candidate.candidate_authorization_epoch == this.expected_authorization_epoch"
  };
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  uint64 expected_authorization_epoch = 2 [(buf.validate.field).uint64 = {
    gte: 1
    lt: 18446744073709551615
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message RevokeSiteReleaseCandidateRequest {
  option (buf.validate.message).cel = {
    id: "site_release_candidate_revoke.step_up_required"
    message: "candidate revocation requires a step-up-authenticated operator context"
    expression: "has(this.context.step_up_at)"
  };
  option (buf.validate.message).cel = {
    id: "site_release_candidate_revoke.site_scope_required"
    message: "candidate revocation must be bound to an explicit operator Site scope"
    expression: "has(this.context.scope.site) && this.site_id in this.context.scope.site.site_ids"
  };
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  RevokeSiteReleaseCandidateEffect effect = 3 [(buf.validate.field).required = true];
}

message RevokeSiteReleaseCandidateResponse {
  option (buf.validate.message).cel = {
    id: "site_release_candidate_revoke.revoked_terminal"
    message: "a successful candidate revocation response is always terminal revoked"
    expression: "this.state == kokoro.platform.site.v1.SiteReleaseCandidateAuthorizationState.SITE_RELEASE_CANDIDATE_AUTHORIZATION_STATE_REVOKED"
  };
  option (buf.validate.message).cel = {
    id: "site_release_candidate_revoke.epoch_advanced_once"
    message: "candidate revocation advances the authorization epoch exactly once"
    expression: "this.authorization_epoch == this.previous_authorization_epoch + 1u && this.candidate.candidate_authorization_epoch == this.authorization_epoch"
  };
  option (buf.validate.message).cel = {
    id: "site_release_candidate_revoke.committed_receipt"
    message: "candidate revocation success requires the exact committed operation receipt"
    expression: "this.receipt.state == kokoro.common.v2.CommandReceiptStateV2.COMMAND_RECEIPT_STATE_V2_COMMITTED && this.receipt.operation == 'kokoro.platform.site.v1.SitePublicationService/RevokeSiteReleaseCandidate'"
  };
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  uint64 previous_authorization_epoch = 2 [(buf.validate.field).uint64 = {
    gte: 1
    lt: 18446744073709551615
  }];
  uint64 authorization_epoch = 3 [(buf.validate.field).uint64 = {gte: 2}];
  SiteReleaseCandidateAuthorizationState state = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool replayed = 5;
  kokoro.common.v2.CommandReceiptV2 receipt = 6 [(buf.validate.field).required = true];
}

message PublishSurfaceInventoryEffect {
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding surface_inventory = 2 [(buf.validate.field).required = true];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishSurfaceInventoryRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  PublishSurfaceInventoryEffect effect = 3 [(buf.validate.field).required = true];
}

message PublishSurfaceInventoryResponse {
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding surface_inventory = 1 [(buf.validate.field).required = true];
  bool replayed = 2;
  kokoro.common.v2.CommandReceiptV2 receipt = 3 [(buf.validate.field).required = true];
}

message PublishWebBuildMaterialBundleEffect {
  // The operator approves publication of an already scanned immutable bundle;
  // the operator does not author its bytes and Platform must verify the digest.
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding web_build_material_bundle = 2 [(buf.validate.field).required = true];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishWebBuildMaterialBundleRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  PublishWebBuildMaterialBundleEffect effect = 3 [(buf.validate.field).required = true];
}

message PublishWebBuildMaterialBundleResponse {
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding web_build_material_bundle = 1 [(buf.validate.field).required = true];
  bool replayed = 2;
  kokoro.common.v2.CommandReceiptV2 receipt = 3 [(buf.validate.field).required = true];
}

message IssueWebBuildIntentEffect {
  // The caller authorizes issuance and may assert already-published inputs,
  // but never authors the Platform-issued ref, revision, digest, issuer heads,
  // issued_at, signing material, or build credentials. Platform deterministically
  // creates the intent from command identity plus the exact candidate authority
  // and returns the resulting immutable binding.
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding expected_surface_inventory = 2;
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding expected_web_build_material_bundle = 3;
  string reason = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message IssueWebBuildIntentRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  IssueWebBuildIntentEffect effect = 3 [(buf.validate.field).required = true];
}

message IssueWebBuildIntentResponse {
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding web_build_intent = 1 [(buf.validate.field).required = true];
  bool replayed = 2;
  kokoro.common.v2.CommandReceiptV2 receipt = 3 [(buf.validate.field).required = true];
}

message RecordReleaseEvidenceEffect {
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding compiled_web_manifest = 2 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding web_artifact_provenance = 3 [(buf.validate.field).required = true];
  string web_artifact_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding artifact_inspection_evidence = 5 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding journey_evidence = 6 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding security_evidence = 7 [(buf.validate.field).required = true];
  string reason = 8 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

enum ReleaseEvidenceProducerRole {
  RELEASE_EVIDENCE_PRODUCER_ROLE_UNSPECIFIED = 0;
  RELEASE_EVIDENCE_PRODUCER_ROLE_WEB_ARTIFACT_PROVENANCE_ATTESTOR = 1;
}

enum WorkloadAuthorizationState {
  WORKLOAD_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  WORKLOAD_AUTHORIZATION_STATE_ACTIVE = 1;
  WORKLOAD_AUTHORIZATION_STATE_REVOKED = 2;
}

message AttestedReleaseEvidenceContext {
  option (buf.validate.message).cel = {
    id: "site_evidence_admission.fixed_audience"
    message: "release evidence admission requires its dedicated audience"
    expression: "this.audience == 'kokoro.site-release-evidence-admission.v1'"
  };
  option (buf.validate.message).cel = {
    id: "site_evidence_admission.active_workload_authorization"
    message: "release evidence admission requires active non-revoked workload authorization"
    expression: "this.workload_authorization_state == kokoro.platform.site.v1.WorkloadAuthorizationState.WORKLOAD_AUTHORIZATION_STATE_ACTIVE && this.workload_revocation_epoch == 0u"
  };
  option (buf.validate.message).cel = {
    id: "site_evidence_admission.fresh_workload_authorization_read"
    message: "the workload authorization live read must have a positive freshness interval"
    expression: "this.workload_authorization_observed_at < this.workload_authorization_valid_until"
  };
  kokoro.common.v2.CommandIdentityV2 command = 1 [(buf.validate.field).required = true];
  string workload_identity_ref = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string audience = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string environment = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 64
  }];
  string region = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 64
  }];
  string producer_identity_ref = 6 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding producer_registration = 7 [(buf.validate.field).required = true];
  ReleaseEvidenceProducerRole producer_role = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // This is a signed, immutable attestation of the transport workload, not an
  // operator session, operator assurance, factor, or managed-device claim.
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding workload_attestation = 9 [(buf.validate.field).required = true];
  // These are mutable authorization fences verified from the authoritative
  // owner at admission time. Immutable registration/attestation revisions are
  // evidence references, not security epochs.
  uint64 workload_authorization_epoch = 10 [(buf.validate.field).uint64 = {gte: 1}];
  uint64 workload_revocation_epoch = 11;
  WorkloadAuthorizationState workload_authorization_state = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding workload_authorization_live_read = 13 [(buf.validate.field).required = true];
  google.protobuf.Timestamp workload_authorization_observed_at = 14 [(buf.validate.field).required = true];
  google.protobuf.Timestamp workload_authorization_valid_until = 15 [(buf.validate.field).required = true];
}

message RecordReleaseEvidenceRequest {
  AttestedReleaseEvidenceContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  RecordReleaseEvidenceEffect effect = 3 [(buf.validate.field).required = true];
}

message RecordReleaseEvidenceResponse {
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding release_evidence = 1 [(buf.validate.field).required = true];
  bool replayed = 2;
  kokoro.common.v2.CommandReceiptV2 receipt = 3 [(buf.validate.field).required = true];
}

message PublishReleaseCertificationEffect {
  // The operator references certification already signed by the independent
  // release-certification producer. Platform verifies its DSSE trust tuple;
  // operator identity never becomes certification producer identity.
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 1 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding release_certification = 2 [(buf.validate.field).required = true];
  uint64 expected_certification_revocation_epoch = 3;
  string reason = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishReleaseCertificationRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  PublishReleaseCertificationEffect effect = 3 [(buf.validate.field).required = true];
}

message PublishReleaseCertificationResponse {
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding release_certification = 1 [(buf.validate.field).required = true];
  bool replayed = 2;
  kokoro.common.v2.CommandReceiptV2 receipt = 3 [(buf.validate.field).required = true];
}

message PublishSiteReleaseEffect {
  reserved 1 to 15;
  reserved 17;
  reserved "site_release_candidate_ref", "expected_candidate_version", "release_ref", "web_artifact_digest", "release_manifest_digest", "certification_digest", "launch_profile_ref", "site_config_revision_ref", "legal_revision_ref", "feature_policy_revision", "model_option_catalog_ref", "agent_catalog_ref", "identity_issuer_label", "identity_auth_strength_policy_revision", "enabled_surface_ids", "locale_policy", "certification";

  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 16 [(buf.validate.field).required = true];
  string reason = 18 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}

message PublishSiteReleaseRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  PublishSiteReleaseEffect effect = 3 [(buf.validate.field).required = true];
}

enum PublishedSiteReleaseState {
  PUBLISHED_SITE_RELEASE_STATE_UNSPECIFIED = 0;
  PUBLISHED_SITE_RELEASE_STATE_READY = 1;
}

message PublishSiteReleaseResponse {
  reserved 2;
  reserved "release_ref";
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  PublishedSiteReleaseState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  bool replayed = 4;
  kokoro.common.v2.CommandReceiptV2 receipt = 5 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding site_release = 6 [(buf.validate.field).required = true];
}
