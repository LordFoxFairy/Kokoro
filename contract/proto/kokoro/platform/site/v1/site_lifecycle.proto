syntax = "proto3";

package kokoro.platform.site.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v1/receipt.proto";
import "kokoro/platform/admin/v2/admin_control.proto";

// SiteLifecycleService is the only privileged API for Site and release transitions.
service SiteLifecycleService {
  rpc RequestSite(RequestSiteRequest) returns (RequestSiteResponse) {}
  rpc ReconcileProvisioning(ReconcileProvisioningRequest) returns (ReconcileProvisioningResponse) {}
  rpc CreateRelease(CreateReleaseRequest) returns (CreateReleaseResponse) {}
  rpc ActivateRelease(ActivateReleaseRequest) returns (ActivateReleaseResponse) {}
  rpc SuspendSite(SuspendSiteRequest) returns (SuspendSiteResponse) {}
  rpc ResumeSite(ResumeSiteRequest) returns (ResumeSiteResponse) {}
  rpc PlanDecommission(PlanDecommissionRequest) returns (PlanDecommissionResponse) {}
  rpc CancelDecommission(CancelDecommissionRequest) returns (CancelDecommissionResponse) {}
  rpc ExecuteDecommission(ExecuteDecommissionRequest) returns (ExecuteDecommissionResponse) {}
  rpc GetDecommissionReceipt(GetDecommissionReceiptRequest) returns (GetDecommissionReceiptResponse) {}
}

message RequestSiteEffect {
  string site_key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string profile_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string primary_domain = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
  string source_repository_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message RequestSiteRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  RequestSiteEffect effect = 2 [(buf.validate.field).required = true];
}

message RequestSiteResponse {
  string site_ref = 1 [(buf.validate.field).string.max_len = 128];
  string provisioning_intent_ref = 2 [(buf.validate.field).string.max_len = 128];
  kokoro.common.v1.CommandReceipt receipt = 3 [(buf.validate.field).required = true];
}

message ReconcileProvisioningEffect {
  string provisioning_intent_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string observed_state_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message ReconcileProvisioningRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ReconcileProvisioningEffect effect = 3 [(buf.validate.field).required = true];
}

message ReconcileProvisioningResponse {
  string site_status = 1 [(buf.validate.field).string.max_len = 64];
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

message CreateReleaseEffect {
  string source_revision = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string artifact_digest = 2 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string contract_digest = 3 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string deployment_manifest_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message CreateReleaseRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CreateReleaseEffect effect = 3 [(buf.validate.field).required = true];
}

message CreateReleaseResponse {
  string release_ref = 1 [(buf.validate.field).string.max_len = 128];
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

message ActivateReleaseEffect {
  string release_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string expected_active_release_ref = 2 [(buf.validate.field).string.max_len = 128];
}

message ActivateReleaseRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ActivateReleaseEffect effect = 3 [(buf.validate.field).required = true];
}

message ActivateReleaseResponse {
  string activation_attempt_ref = 1 [(buf.validate.field).string.max_len = 128];
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

message SuspendSiteEffect {
  string reason_code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string suspension_policy_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message SuspendSiteRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  SuspendSiteEffect effect = 3 [(buf.validate.field).required = true];
}

message SuspendSiteResponse {
  uint64 site_security_epoch = 1;
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

message ResumeSiteEffect {
  string suspension_receipt_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message ResumeSiteRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ResumeSiteEffect effect = 3 [(buf.validate.field).required = true];
}

message ResumeSiteResponse {
  uint64 site_security_epoch = 1;
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

message PlanDecommissionEffect {
  google.protobuf.Timestamp earliest_execution_at = 1 [(buf.validate.field).required = true];
  repeated string required_participant_refs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  string retention_policy_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message PlanDecommissionRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  PlanDecommissionEffect effect = 3 [(buf.validate.field).required = true];
}

message PlanDecommissionResponse {
  string decommission_plan_ref = 1 [(buf.validate.field).string.max_len = 128];
  uint64 participant_epoch = 2;
  kokoro.common.v1.CommandReceipt receipt = 3 [(buf.validate.field).required = true];
}

message CancelDecommissionEffect {
  string decommission_plan_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 expected_participant_epoch = 2;
}

message CancelDecommissionRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CancelDecommissionEffect effect = 3 [(buf.validate.field).required = true];
}

message CancelDecommissionResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
}

message ExecuteDecommissionEffect {
  string decommission_plan_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 expected_participant_epoch = 2;
  string approval_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ExecuteDecommissionRequest {
  kokoro.platform.admin.v2.AdminCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ExecuteDecommissionEffect effect = 3 [(buf.validate.field).required = true];
}

message ExecuteDecommissionResponse {
  string decommission_receipt_ref = 1 [(buf.validate.field).string.max_len = 128];
  kokoro.common.v1.CommandReceipt receipt = 2 [(buf.validate.field).required = true];
}

message GetDecommissionReceiptRequest {
  kokoro.platform.admin.v2.AdminQueryContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string decommission_receipt_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetDecommissionReceiptResponse {
  kokoro.common.v1.CommandReceipt receipt = 1 [(buf.validate.field).required = true];
  string phase = 2 [(buf.validate.field).string.max_len = 64];
  repeated string pending_participant_refs = 3 [(buf.validate.field).repeated.max_items = 100];
}
