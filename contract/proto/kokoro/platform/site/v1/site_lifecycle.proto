syntax = "proto3";

package kokoro.platform.site.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/admin/v2/admin_shared.proto";
import "kokoro/platform/publication/v1/publication_common.proto";

// SiteLifecycleService exposes only Site owner operations implemented by the
// production Platform control plane. Domain effects never pass through the
// generic AdminCommandService.
service SiteLifecycleService {
  rpc RequestActivationApproval(RequestActivationApprovalRequest) returns (RequestActivationApprovalResponse) {}
  rpc ApproveAndActivate(ApproveAndActivateRequest) returns (ApproveAndActivateResponse) {}
}

message ActivationFacts {
  reserved 1, 2;
  reserved "candidate_release_ref", "expected_active_release_ref";

  string audience = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string session_contract_revision = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string reason = 5 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
  kokoro.platform.publication.v1.CandidateAuthorityBinding candidate = 6 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding target_release = 7 [(buf.validate.field).required = true];
  ActivePointerCasPrecondition active_pointer = 8 [(buf.validate.field).required = true];
}

message ActivationCasFence {
  string cas_command_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 fence = 2 [(buf.validate.field).uint64 = {gte: 1}];
  string nonce_digest = 3 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string token_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message FirstActivationPointer {
  string pointer_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
}

message ExistingActivePointer {
  string pointer_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string current_release_ref = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 current_generation = 3 [(buf.validate.field).uint64 = {gte: 1}];
}

message ActivePointerCasPrecondition {
  oneof current {
    option (buf.validate.oneof).required = true;
    FirstActivationPointer first_activation = 1;
    ExistingActivePointer existing = 2;
  }
  uint64 expected_generation = 3;
  string cas_precondition_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  ActivationCasFence fence = 5 [(buf.validate.field).required = true];
}

message ActivationEligibilityEvidenceRefs {
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding begin_authority_snapshot = 1 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding immediate_before_pointer_cas_authority_snapshot = 2 [(buf.validate.field).required = true];
  kokoro.platform.publication.v1.ImmutableContractRevisionBinding eligibility_evidence = 3 [(buf.validate.field).required = true];
}

message RequestActivationApprovalEffect {
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  ActivationFacts activation = 2 [(buf.validate.field).required = true];
}

message RequestActivationApprovalRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  RequestActivationApprovalEffect effect = 3 [(buf.validate.field).required = true];
}

enum SiteEffectApprovalState {
  SITE_EFFECT_APPROVAL_STATE_UNSPECIFIED = 0;
  SITE_EFFECT_APPROVAL_STATE_PENDING = 1;
  SITE_EFFECT_APPROVAL_STATE_APPROVED = 2;
  SITE_EFFECT_APPROVAL_STATE_CONSUMED = 3;
}

message RequestActivationApprovalResponse {
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  SiteEffectApprovalState state = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).required = true];
  kokoro.common.v2.CommandReceiptV2 receipt = 4 [(buf.validate.field).required = true];
}

message ApproveAndActivateEffect {
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  string activation_attempt_ref = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  ActivationFacts activation = 3 [(buf.validate.field).required = true];
}

message ApproveAndActivateRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  ApproveAndActivateEffect effect = 3 [(buf.validate.field).required = true];
}

enum SiteActivationState {
  SITE_ACTIVATION_STATE_UNSPECIFIED = 0;
  SITE_ACTIVATION_STATE_PREPARING = 1;
  SITE_ACTIVATION_STATE_PROMOTE_REQUESTED = 2;
  SITE_ACTIVATION_STATE_OBSERVING = 3;
  SITE_ACTIVATION_STATE_POINTER_COMMITTING = 4;
  SITE_ACTIVATION_STATE_DRAINING = 5;
  SITE_ACTIVATION_STATE_SUCCEEDED = 6;
  SITE_ACTIVATION_STATE_FAILED = 7;
  SITE_ACTIVATION_STATE_OUTCOME_UNKNOWN = 8;
}

message ApproveAndActivateResponse {
  string activation_attempt_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
  SiteActivationState state = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  bool replayed = 3;
  kokoro.common.v2.CommandReceiptV2 receipt = 4 [(buf.validate.field).required = true];
  optional uint64 committed_active_pointer_generation = 5;
  ActivationEligibilityEvidenceRefs activation_evidence = 6;
}
