// ModelControlService is the typed operator control plane for the one canonical
// inventory and the Site/product layers built above it. It never executes a model.
service ModelControlService {
  rpc ListInventoryRevisions(ListInventoryRevisionsRequest) returns (ListInventoryRevisionsResponse) {}
  rpc GetInventoryRevision(GetInventoryRevisionRequest) returns (GetInventoryRevisionResponse) {}
  rpc ListInventoryProviders(ListInventoryProvidersRequest) returns (ListInventoryProvidersResponse) {}
  rpc ListInventoryModels(ListInventoryModelsRequest) returns (ListInventoryModelsResponse) {}
  rpc ListInventoryBindings(ListInventoryBindingsRequest) returns (ListInventoryBindingsResponse) {}
  rpc ListInventoryProductRoutes(ListInventoryProductRoutesRequest) returns (ListInventoryProductRoutesResponse) {}
  rpc ListModelOptions(ListModelOptionsRequest) returns (ListModelOptionsResponse) {}
  rpc ListSiteModelPolicies(ListSiteModelPoliciesRequest) returns (ListSiteModelPoliciesResponse) {}
  rpc ListSiteReleaseCatalogs(ListSiteReleaseCatalogsRequest) returns (ListSiteReleaseCatalogsResponse) {}
  rpc GetCommandReceipt(GetCommandReceiptRequest) returns (GetCommandReceiptResponse) {}
  rpc ImportInventory(ImportInventoryRequest) returns (ImportInventoryResponse) {}
  rpc ActivateInventory(ActivateInventoryRequest) returns (ActivateInventoryResponse) {}
  rpc ChangeSitePolicy(ChangeSitePolicyRequest) returns (ChangeSitePolicyResponse) {}
  rpc MaterializeModelOptions(MaterializeModelOptionsRequest) returns (MaterializeModelOptionsResponse) {}
  rpc PublishSiteReleaseCatalog(PublishSiteReleaseCatalogRequest) returns (PublishSiteReleaseCatalogResponse) {}
}

