syntax = "proto3";

package kokoro.platform.credit.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/admin/v2/admin_shared.proto";

// Credit owns this global immutable catalog. Commerce may bind a published
// revision by typed ref/digest, but never authors Credit policy or its digest.
enum CreditProgramExposure {
  CREDIT_PROGRAM_EXPOSURE_UNSPECIFIED = 0;
  CREDIT_PROGRAM_EXPOSURE_INERT = 1;
}
enum CreditProgramBucketClass {
  CREDIT_PROGRAM_BUCKET_CLASS_UNSPECIFIED = 0;
  CREDIT_PROGRAM_BUCKET_CLASS_DAILY = 1;
  CREDIT_PROGRAM_BUCKET_CLASS_PERIOD = 2;
  CREDIT_PROGRAM_BUCKET_CLASS_PERMANENT = 3;
}

enum CreditProgramRolloverPolicy {
  CREDIT_PROGRAM_ROLLOVER_POLICY_UNSPECIFIED = 0;
  // Launch programs never carry an expired daily/period balance into the next window.
  CREDIT_PROGRAM_ROLLOVER_POLICY_NONE = 1;
}

message CreditProgramScopePolicy {
  uint32 policy_version = 1 [(buf.validate.field).uint32.const = 1];
  repeated string surface_refs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    unique: true
    items: {string: {pattern: "^[a-z0-9][a-z0-9._:-]{0,255}$"}}
  }];
  repeated string capability_keys = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    unique: true
    items: {string: {pattern: "^[a-z0-9][a-z0-9._:-]{0,255}$"}}
  }];
  repeated string agent_refs = 4 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {string: {min_len: 1 max_len: 256}}
  }];
  bool allow_unattributed_agent = 5;
}

message DailyCreditWindow {
  // IANA time-zone name; Credit validates it against the runtime tz database before publication.
  string calendar_zone = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint32 reset_second_of_day = 2 [(buf.validate.field).uint32.lt = 86400];
  CreditProgramRolloverPolicy rollover = 3 [(buf.validate.field).enum.const = 1];
}

message SubscriptionPeriodCreditWindow {
  // The exact start/end instants come from the committed Commerce SubscriptionTerm owner fact.
  CreditProgramRolloverPolicy rollover = 1 [(buf.validate.field).enum.const = 1];
}

message PermanentCreditWindow {
  optional google.protobuf.Duration expires_after = 1;
}

message CreditGlobalCommandContext {
  option (buf.validate.message).cel = {
    id: "credit.global_command.scope"
    message: "global Credit publication requires exact Global or BreakGlass authority"
    expression: "(has(this.operator.scope.global) && this.operator.environment == this.operator.scope.global.environment && this.operator.region == this.operator.scope.global.region) || (has(this.operator.scope.breakglass) && this.operator.environment == this.operator.scope.breakglass.environment && this.operator.region == this.operator.scope.breakglass.region)"
  };
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext operator = 1 [(buf.validate.field).required = true];
}
message CreditGlobalQueryContext {
  option (buf.validate.message).cel = {
    id: "credit.global_query.scope"
    message: "global Credit query requires exact Global or BreakGlass authority"
    expression: "(has(this.operator.scope.global) && this.operator.environment == this.operator.scope.global.environment && this.operator.region == this.operator.scope.global.region) || (has(this.operator.scope.breakglass) && this.operator.environment == this.operator.scope.breakglass.environment && this.operator.region == this.operator.scope.breakglass.region)"
  };
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext operator = 1 [(buf.validate.field).required = true];
}

message CreditProgramRevisionTarget {
  string program_ref = 1 [(buf.validate.field).string = {pattern: "^credit-program:[a-z][a-z0-9._-]{1,127}$"}];
  uint64 revision = 2 [(buf.validate.field).uint64.gt = 0];
  // Generated by Credit from deterministic known-field bytes of definition.
  string revision_digest = 3 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}
message CreditProgramRevisionIntent {
  string program_ref = 1 [(buf.validate.field).string = {pattern: "^credit-program:[a-z][a-z0-9._-]{1,127}$"}];
  uint64 revision = 2 [(buf.validate.field).uint64.gt = 0];
}
message CreditProgramGrantRule {
  option (buf.validate.message).cel = {
    id: "credit.program.bucket_window"
    message: "the typed window policy must match the bucket class"
    expression: "(this.bucket == 1 && has(this.daily)) || (this.bucket == 2 && has(this.subscription_period)) || (this.bucket == 3 && has(this.permanent))"
  };
  option (buf.validate.message).cel = {
    id: "credit.program.scope_agent"
    message: "a scoped rule either allows unattributed agents or names at least one agent"
    expression: "this.scope.allow_unattributed_agent || this.scope.agent_refs.size() > 0"
  };
  CreditProgramBucketClass bucket = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint64 amount_minor = 2 [(buf.validate.field).uint64.gt = 0];
  uint32 burn_priority = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  string liability_merchant_account_ref = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  CreditProgramScopePolicy scope = 5 [(buf.validate.field).required = true];
  oneof window {
    option (buf.validate.oneof).required = true;
    DailyCreditWindow daily = 6;
    SubscriptionPeriodCreditWindow subscription_period = 7;
    PermanentCreditWindow permanent = 8;
  }
}
message CreditProgramDefinition {
  option (buf.validate.message).cel = {
    id: "credit.program.unique_buckets"
    message: "a Credit Program has at most one rule for each bucket"
    expression: "this.grants.all(x, this.grants.filter(y, y.bucket == x.bucket).size() == 1)"
  };
  string unit = 1 [(buf.validate.field).string = {
    pattern: "^[a-z][a-z0-9._-]{0,63}$"
  }];
  repeated CreditProgramGrantRule grants = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
  }];
  // Maximum outstanding balance from this program_ref on one Credit account,
  // aggregated across every published revision. This is deliberately not a
  // cross-program account ceiling; CreditAccountPolicy owns that separate rule.
  uint64 maximum_program_balance_per_account_minor = 3 [(buf.validate.field).uint64.gt = 0];
  google.protobuf.Duration reservation_ttl = 4 [(buf.validate.field).required = true];
  google.protobuf.Duration reconciliation_grace = 5 [(buf.validate.field).required = true];
  // Burn order is Credit-owned and global across every Program:
  // bucket rank (daily, period, permanent), effective expiry (NULLS LAST),
  // burn_priority, acquired_at, grant_ref. A Program cannot publish a
  // conflicting local permutation.
  bool allow_negative_balance = 7 [(buf.validate.field).bool.const = false];
  string accounting_policy_ref = 8 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
}
message CreditProgramRevisionView {
  CreditProgramRevisionTarget target = 1 [(buf.validate.field).required = true];
  CreditProgramDefinition definition = 2 [(buf.validate.field).required = true];
  CreditProgramExposure exposure = 3 [(buf.validate.field).enum.const = 1];
  google.protobuf.Timestamp published_at = 4 [(buf.validate.field).required = true];
}

message PublishCreditProgramRevisionEffect {
  option (buf.validate.message).cel = {
    id: "credit.program.cas_successor"
    message: "published revision is exactly the next immutable revision"
    expression: "this.target.revision == this.expected_version + 1u"
  };
  CreditProgramRevisionIntent target = 1 [(buf.validate.field).required = true];
  uint64 expected_version = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  CreditProgramDefinition definition = 3 [(buf.validate.field).required = true];
  string reason = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 512
  }];
}
message PublishCreditProgramRevisionRequest {
  CreditGlobalCommandContext authority = 1 [(buf.validate.field).required = true];
  PublishCreditProgramRevisionEffect effect = 2 [(buf.validate.field).required = true];
}
message PublishCreditProgramRevisionResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  CreditProgramRevisionView revision = 2 [(buf.validate.field).required = true];
}

message CreditProgramPageRequest {
  uint32 page_size = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 200
  }];
  optional string page_token = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 2048
  }];
  optional string snapshot_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  optional string snapshot_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}
message CreditProgramPageInfo {
  string snapshot_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string snapshot_digest = 2 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  optional string next_page_token = 3 [(buf.validate.field).string = {
    min_len: 16
    max_len: 2048
  }];
}
message CreditProgramRevisionFilter {
  optional string program_ref = 1 [(buf.validate.field).string = {pattern: "^credit-program:[a-z][a-z0-9._-]{1,127}$"}];
  optional google.protobuf.Timestamp published_after = 2;
  optional google.protobuf.Timestamp published_before = 3;
}
message ListCreditProgramRevisionsRequest {
  CreditGlobalQueryContext authority = 1 [(buf.validate.field).required = true];
  CreditProgramRevisionFilter filter = 2 [(buf.validate.field).required = true];
  CreditProgramPageRequest page = 3 [(buf.validate.field).required = true];
}
message ListCreditProgramRevisionsResponse {
  repeated CreditProgramRevisionView revisions = 1 [(buf.validate.field).repeated.max_items = 200];
  CreditProgramPageInfo page = 2 [(buf.validate.field).required = true];
}
message GetCreditProgramRevisionRequest {
  CreditGlobalQueryContext authority = 1 [(buf.validate.field).required = true];
  CreditProgramRevisionTarget target = 2 [(buf.validate.field).required = true];
}
message GetCreditProgramRevisionResponse {
  CreditProgramRevisionView revision = 1 [(buf.validate.field).required = true];
}
message GetCreditGlobalCommandReceiptRequest {
  CreditGlobalQueryContext authority = 1 [(buf.validate.field).required = true];
  kokoro.common.v2.CommandIdentityV2 original_command = 2 [(buf.validate.field).required = true];
}
message GetCreditGlobalCommandReceiptResponse {
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  optional CreditProgramRevisionView revision = 2;
}
