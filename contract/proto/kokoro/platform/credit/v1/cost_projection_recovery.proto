syntax = "proto3";

package kokoro.platform.credit.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v1/projection_integrity.proto";
import "kokoro/common/v2/command_envelope.proto";
import "kokoro/platform/credit/v1/cost_projection.proto";

// CreditCostProjectionRecoveryService is the Credit-owner read plane used by
// Session for cost-only gap repair and shadow replay. It exposes no Media facts.
// It is callable only after the first cost record delivers owner_recovery_handle;
// before that point Session renders cost pending and no owner chain exists.
service CreditCostProjectionRecoveryService {
  rpc GetProjectionHead(GetProjectionHeadRequest) returns (GetProjectionHeadResponse) {}
  rpc PullProjectionEvents(PullProjectionEventsRequest) returns (PullProjectionEventsResponse) {}
  rpc RefreshProjectionRecoveryAccess(RefreshProjectionRecoveryAccessRequest) returns (RefreshProjectionRecoveryAccessResponse) {}
}

message GetProjectionHeadRequest {
  kokoro.common.v1.ProjectionRecoveryAccessCredential owner_recovery_access = 1 [(buf.validate.field).required = true];
  string binding_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string cost_projection_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 producer_generation = 4 [(buf.validate.field).uint64.gt = 0];
}

message CreditCostProjectionHead {
  string binding_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string cost_projection_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 producer_generation = 3 [(buf.validate.field).uint64.gt = 0];
  uint64 high_watermark = 4 [(buf.validate.field).uint64.gt = 0];
  string head_event_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string head_event_digest = 6 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string head_digest = 7 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  kokoro.common.v1.ProjectionSignature signature = 8 [(buf.validate.field).required = true];
  google.protobuf.Timestamp observed_at = 9 [(buf.validate.field).required = true];
}

message GetProjectionHeadResponse {
  CreditCostProjectionHead head = 1 [(buf.validate.field).required = true];
}

message PullProjectionEventsRequest {
  kokoro.common.v1.ProjectionRecoveryAccessCredential owner_recovery_access = 1 [(buf.validate.field).required = true];
  string binding_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string cost_projection_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 producer_generation = 4 [(buf.validate.field).uint64.gt = 0];
  uint64 after_sequence = 5;
  uint32 limit = 6 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 256
  }];
}

message PullProjectionEventsResponse {
  repeated CreditCostProjectionEventRecord events = 1 [(buf.validate.field).repeated = {max_items: 256}];
  uint64 high_watermark = 2 [(buf.validate.field).uint64.gt = 0];
  string head_event_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string head_event_digest = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  bool has_more = 5;
}

// The refresh grant is accepted only by this effect. Its canonical command
// digest covers the complete typed effect, including expected_generation and
// the exact owner chain identity, so a command identity cannot be rebound.
message RefreshCreditCostProjectionRecoveryAccessEffect {
  string owner_recovery_refresh_grant = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  uint64 expected_generation = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lt: 18446744073709551615
  }];
  string binding_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string cost_projection_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 producer_generation = 5 [(buf.validate.field).uint64.gt = 0];
}

message RefreshProjectionRecoveryAccessRequest {
  kokoro.common.v2.CommandIdentityV2 command = 1 [(buf.validate.field).required = true];
  RefreshCreditCostProjectionRecoveryAccessEffect effect = 2 [(buf.validate.field).required = true];
}

// The owner persists the complete response before commit. A same-identity,
// same-digest replay returns the byte-identical receipt and credential envelope;
// a different digest is rejected without evaluating the stale refresh grant.
message RefreshProjectionRecoveryAccessResponse {
  option (buf.validate.message).cel = {
    id: "projection_recovery_refresh.receipt_operation"
    message: "the receipt belongs to the projection recovery refresh operation"
    expression: "this.receipt.operation == 'RefreshProjectionRecoveryAccess'"
  };
  option (buf.validate.message).cel = {
    id: "projection_recovery_refresh.committed_result"
    message: "only a committed refresh carries exactly the next credential generation"
    expression: "(this.receipt.state == kokoro.common.v2.CommandReceiptStateV2.COMMAND_RECEIPT_STATE_V2_COMMITTED && has(this.owner_recovery_credential) && this.owner_recovery_credential.access.generation == this.expected_generation + 1u) || ((this.receipt.state == kokoro.common.v2.CommandReceiptStateV2.COMMAND_RECEIPT_STATE_V2_REJECTED || this.receipt.state == kokoro.common.v2.CommandReceiptStateV2.COMMAND_RECEIPT_STATE_V2_OUTCOME_UNKNOWN) && !has(this.owner_recovery_credential))"
  };
  kokoro.common.v2.CommandReceiptV2 receipt = 1 [(buf.validate.field).required = true];
  uint64 expected_generation = 2 [(buf.validate.field).uint64 = {
    gt: 0
    lt: 18446744073709551615
  }];
  optional kokoro.common.v1.OwnerProjectionRecoveryCredentialEnvelope owner_recovery_credential = 3;
}
