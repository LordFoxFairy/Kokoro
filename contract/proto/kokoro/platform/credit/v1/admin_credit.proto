message ListCreditGrantsRequest {
  option (buf.validate.message).cel = {
    id: "credit.grants.source_pair"
    message: "source_type and source_ref must be provided together"
    expression: "has(this.source_type) == has(this.source_ref)"
  };
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string credit_account_ref = 3 [(buf.validate.field).string.uuid = true];
  optional string source_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string execution_root_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string page_token = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  uint32 page_size = 7 [(buf.validate.field).uint32.lte = 200];
  optional CreditGrantSourceType source_type = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional string credit_grant_id = 9 [(buf.validate.field).string.uuid = true];
}
message ListCreditGrantsResponse {
  repeated CreditGrantSummary grants = 1 [(buf.validate.field).repeated.max_items = 200];
  optional string next_page_token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  google.protobuf.Timestamp membership_watermark = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp observed_at = 4 [(buf.validate.field).required = true];
}

