enum CreditReconciliationDecision {
  CREDIT_RECONCILIATION_DECISION_UNSPECIFIED = 0;
  CREDIT_RECONCILIATION_DECISION_APPROVE = 1;
  CREDIT_RECONCILIATION_DECISION_REJECT = 2;
}

enum CreditReconciliationExecutionState {
  CREDIT_RECONCILIATION_EXECUTION_STATE_UNSPECIFIED = 0;
  CREDIT_RECONCILIATION_EXECUTION_STATE_QUEUED = 1;
  CREDIT_RECONCILIATION_EXECUTION_STATE_APPLYING = 2;
  CREDIT_RECONCILIATION_EXECUTION_STATE_APPLIED = 3;
  CREDIT_RECONCILIATION_EXECUTION_STATE_FAILED = 4;
  CREDIT_RECONCILIATION_EXECUTION_STATE_OUTCOME_UNKNOWN = 5;
  CREDIT_RECONCILIATION_EXECUTION_STATE_QUARANTINED = 6;
}
enum CreditReconciliationApprovalState {
  CREDIT_RECONCILIATION_APPROVAL_STATE_UNSPECIFIED = 0;
  CREDIT_RECONCILIATION_APPROVAL_STATE_PENDING = 1;
  CREDIT_RECONCILIATION_APPROVAL_STATE_AUTHORIZED = 2;
  CREDIT_RECONCILIATION_APPROVAL_STATE_REJECTED = 3;
  CREDIT_RECONCILIATION_APPROVAL_STATE_EXPIRED = 4;
}

message ConfirmNoUsageAndRelease {
  string absence_evidence_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
