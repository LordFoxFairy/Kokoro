  string finance_evidence_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string finance_evidence_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message QuarantineCreditTransaction {
  string case_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string quarantine_policy_digest = 2 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message CreditReconciliationResolution {
  oneof resolution {
    option (buf.validate.oneof).required = true;
    ConfirmNoUsageAndRelease confirm_no_usage_and_release = 1;
    ConfirmUsageAndSettle confirm_usage_and_settle = 2;
    RetryCreditCommit retry_credit_commit = 3;
    ApplyBalancedJournalCorrection apply_balanced_journal_correction = 4;
    QuarantineCreditTransaction quarantine_credit_transaction = 5;
  }
}

