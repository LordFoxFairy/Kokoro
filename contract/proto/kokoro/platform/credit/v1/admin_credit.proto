  string settlement_evidence_ref = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string settlement_evidence_digest = 4 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

message RetryCreditCommit {
  string execution_ref = 1 [(buf.validate.field).string = {
    min_len: 3
