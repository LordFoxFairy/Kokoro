// AdminCreditService is the typed, read-only operator view over Credit authority facts.
service AdminCreditService {
  rpc PublishCreditProgramRevision(PublishCreditProgramRevisionRequest) returns (PublishCreditProgramRevisionResponse) {}
  rpc ListCreditProgramRevisions(ListCreditProgramRevisionsRequest) returns (ListCreditProgramRevisionsResponse) {}
  rpc GetCreditProgramRevision(GetCreditProgramRevisionRequest) returns (GetCreditProgramRevisionResponse) {}
  rpc GetCreditGlobalCommandReceipt(GetCreditGlobalCommandReceiptRequest) returns (GetCreditGlobalCommandReceiptResponse) {}
  rpc GetSiteCreditSummary(GetSiteCreditSummaryRequest) returns (GetSiteCreditSummaryResponse) {}
  rpc ListCreditAccounts(ListCreditAccountsRequest) returns (ListCreditAccountsResponse) {}
  rpc GetCreditAccount(GetCreditAccountRequest) returns (GetCreditAccountResponse) {}
  rpc ListCreditGrants(ListCreditGrantsRequest) returns (ListCreditGrantsResponse) {}
  rpc ListCreditHolds(ListCreditHoldsRequest) returns (ListCreditHoldsResponse) {}
  rpc ListCreditHoldAllocations(ListCreditHoldAllocationsRequest) returns (ListCreditHoldAllocationsResponse) {}
  rpc ListCreditJournalTransactions(ListCreditJournalTransactionsRequest) returns (ListCreditJournalTransactionsResponse) {}
  rpc ListCreditJournalEntries(ListCreditJournalEntriesRequest) returns (ListCreditJournalEntriesResponse) {}
  rpc ListRatedUsage(ListRatedUsageRequest) returns (ListRatedUsageResponse) {}
  rpc ListRatedUsageSourceAllocations(ListRatedUsageSourceAllocationsRequest) returns (ListRatedUsageSourceAllocationsResponse) {}
  rpc RequestCreditReconciliationResolution(RequestCreditReconciliationResolutionRequest) returns (RequestCreditReconciliationResolutionResponse) {}
  rpc DecideCreditReconciliationResolution(DecideCreditReconciliationResolutionRequest) returns (DecideCreditReconciliationResolutionResponse) {}
  rpc GetCreditReconciliationResolution(GetCreditReconciliationResolutionRequest) returns (GetCreditReconciliationResolutionResponse) {}
}

message CreditSiteQueryContext {
  option (buf.validate.message).cel = {
    id: "credit.site_query.scope"
    message: "middleware-attested scope, environment and region authorize the exact Site"
    expression: "(has(this.operator.scope.site) && this.operator.scope.site.site_ids.exists(s, s == this.site_id) && this.operator.environment == this.operator.scope.site.environment && this.operator.region == this.operator.scope.site.region) || (has(this.operator.scope.global) && this.operator.environment == this.operator.scope.global.environment && this.operator.region == this.operator.scope.global.region) || (has(this.operator.scope.breakglass) && this.operator.environment == this.operator.scope.breakglass.environment && this.operator.region == this.operator.scope.breakglass.region)"
  };
  // Constructed only by verified operator middleware; never decoded from an
  // untrusted caller body by the Credit application handler.
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext operator = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
}

message CreditSiteCommandContext {
  option (buf.validate.message).cel = {
    id: "credit.site_command.scope"
    message: "middleware-attested scope, environment and region authorize the exact Site"
    expression: "(has(this.operator.scope.site) && this.operator.scope.site.site_ids.exists(s, s == this.site_id) && this.operator.environment == this.operator.scope.site.environment && this.operator.region == this.operator.scope.site.region) || (has(this.operator.scope.global) && this.operator.environment == this.operator.scope.global.environment && this.operator.region == this.operator.scope.global.region) || (has(this.operator.scope.breakglass) && this.operator.environment == this.operator.scope.breakglass.environment && this.operator.region == this.operator.scope.breakglass.region)"
  };
  // Middleware-attested output. The command provider recomputes the complete
  // typed Effect envelope before any Credit UoW is opened.
  kokoro.platform.admin.v2.AuthenticatedOperatorCommandContext operator = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
}

