message CreditReconciliationApprovalView {
  option (buf.validate.message).cel = {
    id: "credit.reconciliation_approval.lifecycle"
    message: "approve and enqueue are one atomic persisted transition"
    expression: "(this.state == 1 && !has(this.decision) && !has(this.execution_intent)) || (this.state == 2 && has(this.decision) && this.decision.decision == 1 && has(this.execution_intent)) || (this.state == 3 && has(this.decision) && this.decision.decision == 2 && !has(this.execution_intent)) || (this.state == 4 && !has(this.execution_intent))"
  };
  option (buf.validate.message).cel = {
    id: "credit.reconciliation_approval.four_eyes"
    message: "maker and checker must be different actors"
    expression: "!has(this.decision) || this.request.maker_actor_ref != this.decision.checker_actor_ref"
  };
  string approval_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 approval_version = 2 [(buf.validate.field).uint64.gt = 0];
  CreditReconciliationApprovalState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CreditReconciliationApprovalRequestFact request = 4 [(buf.validate.field).required = true];
  optional CreditReconciliationApprovalDecisionFact decision = 5;
  optional CreditReconciliationExecutionIntentFact execution_intent = 6;
}

