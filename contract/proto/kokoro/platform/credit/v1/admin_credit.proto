    min_len: 1
    max_len: 64
  }];
  string business_operation_key = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  CreditJournalOperationKind operation_kind = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint32 entry_count = 7 [(buf.validate.field).uint32 = {
    gte: 2
    lte: 512
  }];
  optional string reversal_of_transaction_ref = 8 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp occurred_at = 9 [(buf.validate.field).required = true];
  google.protobuf.Timestamp created_at = 10 [(buf.validate.field).required = true];
}

message CreditJournalEntrySummary {
  string site_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string journal_transaction_ref = 2 [(buf.validate.field).string.uuid = true];
  uint32 entry_ordinal = 3;
  string credit_account_ref = 4 [(buf.validate.field).string.uuid = true];
  string unit = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  CreditJournalEntrySide entry_side = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  CreditJournalAccountType account_type = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string amount = 8 [(buf.validate.field).string = {pattern: "^[1-9][0-9]{0,37}$"}];
  string credit_grant_id = 9 [(buf.validate.field).string.uuid = true];
  optional string credit_hold_ref = 10 [(buf.validate.field).string.uuid = true];
  CreditGrantSourceType source_type = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string source_ref = 12 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string execution_root_ref = 13 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  google.protobuf.Timestamp created_at = 14 [(buf.validate.field).required = true];
}

