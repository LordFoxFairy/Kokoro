    max_len: 128
  }];
  string rated_usage_ref = 2 [(buf.validate.field).string.uuid = true];
  string authorization_segment_ref = 3 [(buf.validate.field).string.uuid = true];
  string closure_ref = 4 [(buf.validate.field).string.uuid = true];
  string settlement_ref = 5 [(buf.validate.field).string.uuid = true];
  string evidence_ref = 6 [(buf.validate.field).string.uuid = true];
  string attempt_ref = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
