  string credit_grant_id = 4 [(buf.validate.field).string.uuid = true];
  CreditUsageSourceDirection direction = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string amount = 6 [(buf.validate.field).string = {pattern: "^[1-9][0-9]{0,37}$"}];
  uint32 allocation_ordinal = 7;
}

message GetSiteCreditSummaryRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}
message GetSiteCreditSummaryResponse {
  SiteCreditSummary summary = 1 [(buf.validate.field).required = true];
}

message ListCreditAccountsRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext context = 1 [(buf.validate.field).required = true];
  string site_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  optional string billing_account_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string page_token = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  uint32 page_size = 5 [(buf.validate.field).uint32.lte = 200];
}
message ListCreditAccountsResponse {
  repeated CreditAccountSummary accounts = 1 [(buf.validate.field).repeated.max_items = 200];
  optional string next_page_token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  google.protobuf.Timestamp membership_watermark = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp observed_at = 4 [(buf.validate.field).required = true];
}

message GetCreditAccountRequest {
  kokoro.platform.admin.v2.AuthenticatedOperatorQueryContext context = 1 [(buf.validate.field).required = true];
