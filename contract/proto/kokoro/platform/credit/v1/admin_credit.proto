  CreditReconciliationApprovalView approval = 2 [(buf.validate.field).required = true];
  optional CreditReconciliationExecutionResult execution = 3;
}

message CreditReconciliationExecutionResult {
  option (buf.validate.message).cel = {
    id: "credit.reconciliation.result_shape"
    message: "applied financial transitions carry before, after and balanced Journal evidence"
    expression: "((this.state in [3, 6]) && has(this.before) && has(this.after) && has(this.adopted_resolution) && this.before.platform_transaction_ref == this.after.platform_transaction_ref && this.after.version == this.before.version + 1u && !has(this.outcome_unknown)) || (this.state == 5 && !has(this.after) && has(this.outcome_unknown)) || (this.state in [1, 2, 4] && !has(this.after) && !has(this.outcome_unknown))"
  };
  string resolution_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 resolution_version = 2 [(buf.validate.field).uint64.gt = 0];
  CreditReconciliationExecutionState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional CreditTransactionSnapshot before = 4;
  optional CreditTransactionSnapshot after = 5;
  optional string journal_transaction_ref = 6 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  optional string journal_transaction_digest = 7 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  string evidence_digest = 8 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  optional string reconciliation_case_ref = 9 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string executor_workload_ref = 10 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string executor_attestation_digest = 11 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
  google.protobuf.Timestamp updated_at = 12 [(buf.validate.field).required = true];
  optional CreditReconciliationResolution adopted_resolution = 13;
  optional CreditReconciliationOutcomeUnknown outcome_unknown = 14;
  optional CreditTransactionState final_transaction_state = 15 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message CreditReconciliationOutcomeUnknown {
  string secondary_case_ref = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string transaction_ref = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  uint64 expected_transaction_version = 3 [(buf.validate.field).uint64.gt = 0];
  string uncertain_execution_ref = 4 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string uncertainty_evidence_digest = 5 [(buf.validate.field).string = {pattern: "^sha256:[0-9a-f]{64}$"}];
}

