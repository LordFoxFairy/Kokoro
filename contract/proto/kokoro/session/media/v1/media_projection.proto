// Every direct command and recovery returns this single closed result union.
// The symbolic enum mapping is compiled and executed by the pinned Protovalidate gate.
message ProjectionCommandResolution {
  option (buf.validate.message).cel = {
    id: "projection_command_resolution.accepted_result_matches_command_kind"
    message: "an accepted command resolution returns exactly the result arm for the recorded command kind"
    expression: "(has(this.receipt.accepted) && ((this.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_ISSUE_MEDIA_PROJECTION_RESERVATION && has(this.issue_result)) || (this.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_BIND_MEDIA_PROJECTION_TARGET && has(this.bind_result)) || (this.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_CREATE_REPLACEMENT_MEDIA_PROJECTION_BINDING && has(this.replacement_result)) || (this.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_REFRESH_MEDIA_PROJECTION_ACCESS && has(this.refresh_media_result)) || (this.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_REFRESH_CREDIT_COST_PROJECTION_ACCESS && has(this.refresh_credit_result)))) || (!has(this.receipt.accepted) && !has(this.issue_result) && !has(this.bind_result) && !has(this.replacement_result) && !has(this.refresh_media_result) && !has(this.refresh_credit_result))"
  };
  ProjectionCommandReceipt receipt = 1 [(buf.validate.field).required = true];
  oneof result {
    IssueMediaProjectionReservationAcceptedResult issue_result = 2;
    BindMediaProjectionTargetAcceptedResult bind_result = 3;
    CreateReplacementMediaProjectionBindingAcceptedResult replacement_result = 4;
    RefreshMediaProjectionAccessAcceptedResult refresh_media_result = 5;
    RefreshCreditProjectionAccessAcceptedResult refresh_credit_result = 6;
  }
}

message IssueMediaProjectionReservationResponse {
  option (buf.validate.message).cel = {
    id: "projection_command.issue_receipt_kind"
    message: "the issue RPC returns only an issue command receipt"
    expression: "(has(this.resolution.receipt.accepted) && this.resolution.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_ISSUE_MEDIA_PROJECTION_RESERVATION) || (has(this.resolution.receipt.rejected) && this.resolution.receipt.rejected.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_ISSUE_MEDIA_PROJECTION_RESERVATION) || (has(this.resolution.receipt.outcome_unknown) && this.resolution.receipt.outcome_unknown.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_ISSUE_MEDIA_PROJECTION_RESERVATION)"
  };
  ProjectionCommandResolution resolution = 1 [(buf.validate.field).required = true];
}

message BindMediaProjectionTargetResponse {
  option (buf.validate.message).cel = {
    id: "projection_command.bind_receipt_kind"
    message: "the bind RPC returns only a bind command receipt"
    expression: "(has(this.resolution.receipt.accepted) && this.resolution.receipt.accepted.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_BIND_MEDIA_PROJECTION_TARGET) || (has(this.resolution.receipt.rejected) && this.resolution.receipt.rejected.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_BIND_MEDIA_PROJECTION_TARGET) || (has(this.resolution.receipt.outcome_unknown) && this.resolution.receipt.outcome_unknown.command_kind == kokoro.session.media.v1.ProjectionCommandKind.PROJECTION_COMMAND_KIND_BIND_MEDIA_PROJECTION_TARGET)"
  };
