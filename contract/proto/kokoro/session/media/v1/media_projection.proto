// Refresh replaces only these capabilities, never the immutable record. This
// signed Media-owned record is the sole operation/candidate/artifact fact from
// which Session may build or advance a Chat projection part.
message MediaProjectionDeliveryEnvelope {
  string media_projection_handle = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  string owner_recovery_handle = 2 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  kokoro.platform.media.v1.MediaProjectionEventRecord record = 3 [(buf.validate.field).required = true];
}

// Refresh replaces only these capabilities, never the immutable cost record.
message CreditCostProjectionDeliveryEnvelope {
  string cost_projection_handle = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  string owner_recovery_handle = 2 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  kokoro.platform.credit.v1.CreditCostProjectionEventRecord record = 3 [(buf.validate.field).required = true];
}

// A recovered effect never replays the original bearer bytes. When the effect
// committed, Session rotates a fresh envelope and reports the old generation's
// overlap/invalidation state explicitly.
message ProjectionCredentialRotation {
  option (buf.validate.message).cel = {
    id: "projection_credentials.previous_generation_state"
    message: "the first envelope has no predecessor; later envelopes either invalidate it or bound its overlap"
    expression: "(this.envelope_generation == 1u && !has(this.previous_credentials_valid_until) && !this.previous_credentials_invalidated) || (this.envelope_generation > 1u && (this.previous_credentials_invalidated != has(this.previous_credentials_valid_until)))"
  };
  uint64 envelope_generation = 1 [(buf.validate.field).uint64.gt = 0];
  google.protobuf.Timestamp previous_credentials_valid_until = 2;
  bool previous_credentials_invalidated = 3;
}

enum ProjectionCommandRecoveryAction {
  PROJECTION_COMMAND_RECOVERY_ACTION_UNSPECIFIED = 0;
  PROJECTION_COMMAND_RECOVERY_ACTION_NONE = 1;
  PROJECTION_COMMAND_RECOVERY_ACTION_RECOVER_COMMAND = 2;
  PROJECTION_COMMAND_RECOVERY_ACTION_CONTACT_SUPPORT = 3;
}

enum ProjectionCommandKind {
  PROJECTION_COMMAND_KIND_UNSPECIFIED = 0;
  PROJECTION_COMMAND_KIND_ISSUE_MEDIA_PROJECTION_RESERVATION = 1;
  PROJECTION_COMMAND_KIND_BIND_MEDIA_PROJECTION_TARGET = 2;
  PROJECTION_COMMAND_KIND_CREATE_REPLACEMENT_MEDIA_PROJECTION_BINDING = 3;
  PROJECTION_COMMAND_KIND_REFRESH_MEDIA_PROJECTION_ACCESS = 4;
  PROJECTION_COMMAND_KIND_REFRESH_CREDIT_COST_PROJECTION_ACCESS = 5;
}

// This taxonomy intentionally has the same closed members as the Media-owned
// durable and public projections. Session may redact a safe message, but it may
// not invent a new failure class while translating a signed producer fact.
enum MediaProjectionFailureCode {
  MEDIA_PROJECTION_FAILURE_CODE_UNSPECIFIED = 0;
  MEDIA_PROJECTION_FAILURE_CODE_INPUT_REJECTED = 1;
  MEDIA_PROJECTION_FAILURE_CODE_POLICY_REJECTED = 2;
  MEDIA_PROJECTION_FAILURE_CODE_CREDIT_REJECTED = 3;
  MEDIA_PROJECTION_FAILURE_CODE_GENERATION_FAILED = 4;
  MEDIA_PROJECTION_FAILURE_CODE_VALIDATION_FAILED = 5;
  MEDIA_PROJECTION_FAILURE_CODE_TEMPORARILY_UNAVAILABLE = 6;
  MEDIA_PROJECTION_FAILURE_CODE_OUTCOME_UNKNOWN = 7;
  MEDIA_PROJECTION_FAILURE_CODE_ARTIFACT_RESTRICTED = 8;
  MEDIA_PROJECTION_FAILURE_CODE_ARTIFACT_UNAVAILABLE = 9;
}

enum MediaProjectionRetryClass {
  MEDIA_PROJECTION_RETRY_CLASS_UNSPECIFIED = 0;
  MEDIA_PROJECTION_RETRY_CLASS_NEVER = 1;
  MEDIA_PROJECTION_RETRY_CLASS_AFTER_DELAY = 2;
  MEDIA_PROJECTION_RETRY_CLASS_AFTER_USER_ACTION = 3;
  MEDIA_PROJECTION_RETRY_CLASS_RECONCILE_RECEIPT = 4;
}

