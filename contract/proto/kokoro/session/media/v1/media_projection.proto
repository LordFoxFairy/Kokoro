// Refresh replaces only this delivery envelope. The nested record ref, digest,
// sequence, predecessor and owner signature remain byte-identical on replay.
// Delivers the immutable Media-owned first event together with rotating
// Session-targeted capabilities that are intentionally excluded from it.
message MediaProjectionBindingCommittedDeliveryEnvelope {
  string pending_media_projection_handle = 1 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  string owner_recovery_handle = 2 [(buf.validate.field).string = {
    min_len: 32
    max_len: 8192
  }];
  kokoro.platform.media.v1.MediaProjectionBindingCommittedRecord record = 3 [(buf.validate.field).required = true];
}

