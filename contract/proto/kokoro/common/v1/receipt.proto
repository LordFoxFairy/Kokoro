syntax = "proto3";

package kokoro.common.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "kokoro/common/v1/error.proto";

enum CommandDigestAlgorithm {
  COMMAND_DIGEST_ALGORITHM_UNSPECIFIED = 0;
  // SHA-256(type_name + NUL + canonical known-field protobuf bytes), encoded as lowercase hex.
  // The method-specific Effect message is normalized before serialization, contains no maps,
  // and is serialized in ascending field-number order with unknown fields discarded.
  COMMAND_DIGEST_ALGORITHM_SHA256_PROTOBUF_V1 = 1;
}

message CommandIdentity {
  string command_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string idempotency_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  CommandDigestAlgorithm digest_algorithm = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string request_digest = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

enum CommandReceiptState {
  COMMAND_RECEIPT_STATE_UNSPECIFIED = 0;
  COMMAND_RECEIPT_STATE_ACCEPTED = 1;
  COMMAND_RECEIPT_STATE_COMMITTED = 2;
  COMMAND_RECEIPT_STATE_REJECTED = 3;
  COMMAND_RECEIPT_STATE_OUTCOME_UNKNOWN = 4;
}

message CommandReceipt {
  CommandIdentity identity = 1 [(buf.validate.field).required = true];
  string operation = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  CommandReceiptState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  google.protobuf.Timestamp recorded_at = 4 [(buf.validate.field).required = true];
  optional KokoroErrorDetail error = 5;
}
