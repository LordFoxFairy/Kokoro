    ToolStartedOutputV2 tool_started = 4;
    ToolFinishedOutputV2 tool_finished = 5;
    PlanProgressOutputV2 plan_progress = 6;
    SubagentProgressOutputV2 subagent_progress = 7;
    MediaOperationReferenceOutputV2 media_operation_reference = 8;
    NoticeOutputV2 notice = 9;
    ErrorOutputV2 error = 10;
  }
}

