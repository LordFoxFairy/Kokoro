syntax = "proto3";

package kokoro.agent.execution.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Agent owns immutable execution facts. V2 hard-cuts the V1 per-action owner
// event into one atomic, ordered Interaction group revision envelope.
service AgentExecutionEvidenceService {
  rpc PullDurableExecutionEvidence(PullDurableExecutionEvidenceRequest) returns (PullDurableExecutionEvidenceResponse) {}
  rpc GetDurableExecutionEvidence(GetDurableExecutionEvidenceRequest) returns (GetDurableExecutionEvidenceResponse) {}
  rpc GetRunDurableCheckpoint(GetRunDurableCheckpointRequest) returns (GetRunDurableCheckpointResponse) {}
  rpc PullDurableOutputRecords(PullDurableOutputRecordsRequest) returns (PullDurableOutputRecordsResponse) {}
}

enum DurableExecutionEvidenceKindV2 {
  DURABLE_EXECUTION_EVIDENCE_KIND_V2_UNSPECIFIED = 0;
  DURABLE_EXECUTION_EVIDENCE_KIND_V2_RUN_STARTED = 1;
  DURABLE_EXECUTION_EVIDENCE_KIND_V2_INTERACTION_GROUP_REVISION = 2;
  DURABLE_EXECUTION_EVIDENCE_KIND_V2_RUN_OWNER_COMPLETED = 3;
  DURABLE_EXECUTION_EVIDENCE_KIND_V2_RUN_COMPLETED = 4;
  DURABLE_EXECUTION_EVIDENCE_KIND_V2_RUN_FAILED = 5;
}

message DurableExecutionCanonicalPayloadV2 {
  oneof payload {
    option (buf.validate.oneof).required = true;

    RunStartedEvidenceV2 run_started = 1;
    InteractionGroupRevisionEvidenceV2 interaction_group_revision = 2;
    RunOwnerCompletedEvidenceV2 run_owner_completed = 3;
    RunCompletedEvidenceV2 run_completed = 4;
    RunFailedEvidenceV2 run_failed = 5;
  }
}

message RunStartedEvidenceV2 {}

enum InteractionKindV2 {
  INTERACTION_KIND_V2_UNSPECIFIED = 0;
  INTERACTION_KIND_V2_APPROVAL = 1;
  INTERACTION_KIND_V2_QUESTION = 2;
  INTERACTION_KIND_V2_STRUCTURED_INPUT = 3;
  INTERACTION_KIND_V2_RESULT_REVIEW = 4;
  INTERACTION_KIND_V2_PLAN = 5;
}

enum InteractionRevisionStateV2 {
  INTERACTION_REVISION_STATE_V2_UNSPECIFIED = 0;
  INTERACTION_REVISION_STATE_V2_PENDING = 1;
  INTERACTION_REVISION_STATE_V2_RESUME_PERSISTED = 2;
  INTERACTION_REVISION_STATE_V2_APPLYING = 3;
  INTERACTION_REVISION_STATE_V2_APPLIED = 4;
  INTERACTION_REVISION_STATE_V2_OUTCOME_UNKNOWN = 5;
  INTERACTION_REVISION_STATE_V2_RESOLVED = 6;
  INTERACTION_REVISION_STATE_V2_SUPERSEDED_BY_REVISION = 7;
  INTERACTION_REVISION_STATE_V2_CANCELED = 8;
  INTERACTION_REVISION_STATE_V2_CLOSED_BY_TERMINAL = 9;
}

enum InteractionDecisionKindV2 {
  INTERACTION_DECISION_KIND_V2_UNSPECIFIED = 0;
  INTERACTION_DECISION_KIND_V2_APPROVE = 1;
  INTERACTION_DECISION_KIND_V2_EDIT = 2;
  INTERACTION_DECISION_KIND_V2_REJECT = 3;
  INTERACTION_DECISION_KIND_V2_RESPOND = 4;
  INTERACTION_DECISION_KIND_V2_SUBMIT = 5;
}

message InteractionOwnerRevisionRefV2 {
  string interaction_owner_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 owner_revision = 2 [(buf.validate.field).uint64.gt = 0];
}

message InteractionRiskSummaryV2 {
  string level = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string source = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
}

message SafeInteractionPromptV2 {
  option (buf.validate.message).cel = {
    id: "interaction_prompt.input_schema_pair"
    message: "input schema ref and safe schema bytes are an atomic pair"
    expression: "has(this.input_schema_ref) == has(this.safe_input_schema_json)"
  };
  string title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
  }];
  string description = 2 [(buf.validate.field).string.max_bytes = 4096];
  optional InteractionRiskSummaryV2 risk = 3;
  optional bytes safe_request_json = 4 [(buf.validate.field).bytes.max_len = 16384];
  optional string input_schema_ref = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional bytes safe_input_schema_json = 6 [(buf.validate.field).bytes.max_len = 16384];
  optional string safe_validation_error = 7 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
  optional google.protobuf.Timestamp deadline = 8;
}

message ApprovalPresentationV2 {
  option (buf.validate.message).cel = {
    id: "approval_presentation.allowed_actions"
    message: "approval actions are limited to approve, edit, or reject"
    expression: "this.allowed_decisions.all(d, d == 1 || d == 2 || d == 3)"
  };
  SafeInteractionPromptV2 prompt = 1 [(buf.validate.field).required = true];
  repeated InteractionDecisionKindV2 allowed_decisions = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}

message QuestionPresentationV2 {
  option (buf.validate.message).cel = {
    id: "question_presentation.allowed_actions"
    message: "question actions are limited to reject or respond"
    expression: "this.allowed_decisions.all(d, d == 3 || d == 4)"
  };
  SafeInteractionPromptV2 prompt = 1 [(buf.validate.field).required = true];
  repeated InteractionDecisionKindV2 allowed_decisions = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}

message StructuredInputPresentationV2 {
  option (buf.validate.message).cel = {
    id: "structured_input_presentation.allowed_actions"
    message: "structured input actions are limited to reject or submit"
    expression: "this.allowed_decisions.all(d, d == 3 || d == 5)"
  };
  SafeInteractionPromptV2 prompt = 1 [(buf.validate.field).required = true];
  repeated InteractionDecisionKindV2 allowed_decisions = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}

message ResultReviewPresentationV2 {
  option (buf.validate.message).cel = {
    id: "result_review_presentation.allowed_actions"
    message: "result review actions are limited to approve, edit, or reject"
    expression: "this.allowed_decisions.all(d, d == 1 || d == 2 || d == 3)"
  };
  SafeInteractionPromptV2 prompt = 1 [(buf.validate.field).required = true];
  string safe_result_preview = 2 [(buf.validate.field).string.max_bytes = 16384];
  repeated InteractionDecisionKindV2 allowed_decisions = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}

enum PlanStepStatusV2 {
  PLAN_STEP_STATUS_V2_UNSPECIFIED = 0;
  PLAN_STEP_STATUS_V2_PENDING = 1;
  PLAN_STEP_STATUS_V2_IN_PROGRESS = 2;
  PLAN_STEP_STATUS_V2_COMPLETED = 3;
}

message PlanStepV2 {
  string step_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 1024
  }];
  PlanStepStatusV2 status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message PlanPresentationV2 {
  option (buf.validate.message).cel = {
    id: "plan_presentation.allowed_actions"
    message: "plan actions are limited to approve or reject"
    expression: "this.allowed_decisions.all(d, d == 1 || d == 3)"
  };
  string summary = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
  repeated PlanStepV2 steps = 2 [(buf.validate.field).repeated.max_items = 256];
  repeated InteractionDecisionKindV2 allowed_decisions = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2
    unique: true
    items: {
