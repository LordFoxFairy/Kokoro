}

message InteractionPresentationV2 {
  oneof presentation {
    option (buf.validate.oneof).required = true;

    ApprovalPresentationV2 approval = 1;
    QuestionPresentationV2 question = 2;
    StructuredInputPresentationV2 structured_input = 3;
    ResultReviewPresentationV2 result_review = 4;
    PlanPresentationV2 plan = 5;
  }
}

message InteractionOwnerRevisionEvidenceV2 {
  option (buf.validate.message).cel = {
    id: "interaction_owner.predecessor_pair"
    message: "predecessor event ref and evidence digest are an atomic pair"
    expression: "has(this.predecessor_projection_event_ref) == has(this.predecessor_evidence_sha256)"
  };
  option (buf.validate.message).cel = {
    id: "interaction_owner.predecessor_revision"
    message: "revision one has no predecessor; every successor names the exact predecessor"
    expression: "(this.owner_revision == 1u && !has(this.predecessor_projection_event_ref)) || (this.owner_revision > 1u && has(this.predecessor_projection_event_ref))"
  };
  option (buf.validate.message).cel = {
    id: "interaction_owner.group_identity"
    message: "a member belongs to one explicit positive group revision and frame"
    expression: "this.decision_group_ref != '' && this.decision_group_revision > 0u && this.pending_frame_digest.matches('^[0-9a-f]{64}$')"
  };
  option (buf.validate.message).cel = {
    id: "interaction_owner.required_membership"
    message: "the required owner revision vector is unique and contains this exact revision"
    expression: "this.required_owner_revision_refs.exists(r, r.interaction_owner_ref == this.interaction_owner_ref && r.owner_revision == this.owner_revision) && this.required_owner_revision_refs.all(r, this.required_owner_revision_refs.filter(n, n.interaction_owner_ref == r.interaction_owner_ref && n.owner_revision == r.owner_revision).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "interaction_owner.presentation_kind"
    message: "the closed presentation arm matches the declared interaction kind"
    expression: "(this.interaction_kind == 1 && has(this.presentation.approval)) || (this.interaction_kind == 2 && has(this.presentation.question)) || (this.interaction_kind == 3 && has(this.presentation.structured_input)) || (this.interaction_kind == 4 && has(this.presentation.result_review)) || (this.interaction_kind == 5 && has(this.presentation.plan))"
  };
  string interaction_owner_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 owner_revision = 2 [(buf.validate.field).uint64.gt = 0];
  string projection_event_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string predecessor_projection_event_ref = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional string predecessor_evidence_sha256 = 5 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string projection_payload_sha256 = 6 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  InteractionKindV2 interaction_kind = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string application_request_ref = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string decision_group_ref = 9 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 decision_group_revision = 10 [(buf.validate.field).uint64.gt = 0];
  uint32 group_member_ordinal = 11 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 64
  }];
  repeated InteractionOwnerRevisionRefV2 required_owner_revision_refs = 12 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  string pending_frame_digest = 13 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  InteractionPresentationV2 presentation = 14 [(buf.validate.field).required = true];
  InteractionRevisionStateV2 state = 15 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message InteractionGroupRevisionEvidenceV2 {
  option (buf.validate.message).cel = {
    id: "interaction_group.member_ordinals"
    message: "member ordinals are unique and cover the exact contiguous range one through N"
    expression: "this.members.all(m, m.group_member_ordinal <= uint(this.members.size()) && this.members.filter(n, n.group_member_ordinal == m.group_member_ordinal).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "interaction_group.member_group_identity"
    message: "every member is bound to this exact group revision and pending frame"
    expression: "this.members.all(m, m.decision_group_ref == this.decision_group_ref && m.decision_group_revision == this.decision_group_revision && m.pending_frame_digest == this.pending_frame_digest)"
  };
  option (buf.validate.message).cel = {
    id: "interaction_group.required_vector"
    message: "every member commits to the exact ordered group member vector"
    expression: "this.members.all(m, m.required_owner_revision_refs.map(r, r.interaction_owner_ref + ':' + string(r.owner_revision)) == this.members.map(n, n.interaction_owner_ref + ':' + string(n.owner_revision)))"
  };
  string decision_group_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 decision_group_revision = 2 [(buf.validate.field).uint64.gt = 0];
  string group_projection_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string pending_frame_digest = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string member_vector_sha256 = 5 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  repeated InteractionOwnerRevisionEvidenceV2 members = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
}

