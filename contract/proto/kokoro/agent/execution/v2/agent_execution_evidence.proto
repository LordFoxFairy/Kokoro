    min_len: 1
    max_len: 128
  }];
  string message = 3 [(buf.validate.field).string.max_bytes = 4096];
  uint64 output_high_watermark = 4;
  string output_digest_sha256 = 5 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

