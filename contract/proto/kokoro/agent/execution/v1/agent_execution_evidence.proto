syntax = "proto3";

package kokoro.agent.execution.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Agent is the sole authority for immutable durable execution facts. Session
// and Platform consume this read-only boundary for reconciliation. The service
// never accepts or returns Site, project, user or namespace business identity.
service AgentExecutionEvidenceService {
  rpc PullDurableExecutionEvidence(PullDurableExecutionEvidenceRequest) returns (PullDurableExecutionEvidenceResponse) {}
  rpc GetDurableExecutionEvidence(GetDurableExecutionEvidenceRequest) returns (GetDurableExecutionEvidenceResponse) {}
  rpc GetRunDurableCheckpoint(GetRunDurableCheckpointRequest) returns (GetRunDurableCheckpointResponse) {}
  rpc PullDurableOutputRecords(PullDurableOutputRecordsRequest) returns (PullDurableOutputRecordsResponse) {}
}

enum DurableExecutionEvidenceKind {
  DURABLE_EXECUTION_EVIDENCE_KIND_UNSPECIFIED = 0;
  DURABLE_EXECUTION_EVIDENCE_KIND_RUN_STARTED = 1;
  DURABLE_EXECUTION_EVIDENCE_KIND_ACTION_OWNER = 2;
  DURABLE_EXECUTION_EVIDENCE_KIND_PLAN_OWNER = 3;
  DURABLE_EXECUTION_EVIDENCE_KIND_RUN_OWNER_COMPLETED = 4;
  DURABLE_EXECUTION_EVIDENCE_KIND_RUN_COMPLETED = 5;
  DURABLE_EXECUTION_EVIDENCE_KIND_RUN_FAILED = 6;
}

// canonical_payload is the deterministic protobuf serialization of exactly
// this message. Consumers must parse this V1 oneof before projecting facts;
// opaque or ad-hoc JSON parsing is not part of the contract.
message DurableExecutionCanonicalPayloadV1 {
  oneof payload {
    option (buf.validate.oneof).required = true;

    RunStartedEvidenceV1 run_started = 1;
    ActionOwnerEvidenceV1 action_owner = 2;
    PlanOwnerEvidenceV1 plan_owner = 3;
    RunOwnerCompletedEvidenceV1 run_owner_completed = 4;
    RunCompletedEvidenceV1 run_completed = 5;
    RunFailedEvidenceV1 run_failed = 6;
  }
}

message RunStartedEvidenceV1 {}

enum ActionAwaitingKindV1 {
  ACTION_AWAITING_KIND_V1_UNSPECIFIED = 0;
  ACTION_AWAITING_KIND_V1_TOOL_APPROVAL = 1;
  ACTION_AWAITING_KIND_V1_ASK_USER_QUESTION = 2;
  ACTION_AWAITING_KIND_V1_RESULT_REVIEW = 3;
  ACTION_AWAITING_KIND_V1_INPUT = 4;
}

enum ActionDecisionV1 {
  ACTION_DECISION_V1_UNSPECIFIED = 0;
  ACTION_DECISION_V1_APPROVE = 1;
  ACTION_DECISION_V1_EDIT = 2;
  ACTION_DECISION_V1_REJECT = 3;
  ACTION_DECISION_V1_RESPOND = 4;
  ACTION_DECISION_V1_SUBMIT = 5;
}

message ActionRiskSummaryV1 {
  string level = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string source = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

message ActionOwnerEvidenceV1 {
  string owner_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 owner_version = 2 [(buf.validate.field).uint64.const = 1];
  string segment_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string action_name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  ActionAwaitingKindV1 awaiting_kind = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // SHA-256 of the canonical full Agent action-owner event payload. Session
  // can compare its durable raw event without this boundary re-publishing args.
  string action_payload_sha256 = 6 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string description = 7 [(buf.validate.field).string.max_len = 4096];
  repeated ActionDecisionV1 allowed_decisions = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 5
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
  repeated string pending_owner_refs = 9 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  bool editable = 10;
  optional ActionRiskSummaryV1 risk = 11;
  // These are bounded canonical JSON objects produced by Agent's redaction
  // policy. They are presentation facts, never executable tool arguments.
  optional bytes safe_request_json = 12 [(buf.validate.field).bytes.max_len = 16384];
  optional string input_schema_ref = 13 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional bytes safe_input_schema_json = 14 [(buf.validate.field).bytes.max_len = 16384];
  // Present only for result-review owners and already bounded/redacted by Agent.
  optional string safe_result_preview = 15 [(buf.validate.field).string.max_len = 16384];
}

enum PlanStepStatusV1 {
  PLAN_STEP_STATUS_V1_UNSPECIFIED = 0;
  PLAN_STEP_STATUS_V1_PENDING = 1;
  PLAN_STEP_STATUS_V1_IN_PROGRESS = 2;
  PLAN_STEP_STATUS_V1_COMPLETED = 3;
}

enum PlanDecisionV1 {
  PLAN_DECISION_V1_UNSPECIFIED = 0;
  PLAN_DECISION_V1_ACCEPT = 1;
  PLAN_DECISION_V1_REJECT = 2;
}

message PlanStepV1 {
  string step_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  PlanStepStatusV1 status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message PlanOwnerEvidenceV1 {
  string owner_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 owner_version = 2 [(buf.validate.field).uint64.gt = 0];
  string segment_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // SHA-256 of the canonical full Agent plan-owner event payload.
  string proposal_payload_sha256 = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  string summary = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  repeated PlanStepV1 steps = 6 [(buf.validate.field).repeated = {max_items: 256}];
  repeated PlanDecisionV1 allowed_decisions = 7 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: 0
      }
    }
  }];
}

message RunOwnerCompletedEvidenceV1 {
  string execution_context_anchor = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string execution_context_digest = 2 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  uint64 owner_revision = 3 [(buf.validate.field).uint64.gt = 0];
}

enum RunCompletedEvidenceStatus {
  RUN_COMPLETED_EVIDENCE_STATUS_UNSPECIFIED = 0;
  RUN_COMPLETED_EVIDENCE_STATUS_COMPLETED = 1;
  RUN_COMPLETED_EVIDENCE_STATUS_CANCELLED = 2;
}

message RunCompletedEvidenceV1 {
  RunCompletedEvidenceStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Presence is unified: absent means no usage fact; present always carries
  // both non-negative counters, matching Agent RunCompletedPayload exactly.
  TokenUsageEvidenceV1 token_usage = 2;
  // Independent per-run output cursor. Zero means the run produced no output;
  // output_digest_sha256 is chainN at this watermark (chain0 when zero).
  uint64 output_high_watermark = 3;
  string output_digest_sha256 = 4 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

message TokenUsageEvidenceV1 {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
}

message RunFailedEvidenceV1 {
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string error_kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string message = 3 [(buf.validate.field).string.max_len = 4096];
  // Terminal output evidence is recorded even when execution fails;
  // output_digest_sha256 is chainN at this watermark (chain0 when zero).
  uint64 output_high_watermark = 4;
  string output_digest_sha256 = 5 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
}

// canonical_payload is the deterministic protobuf serialization of exactly
// this message. Safe summaries and previews are already redacted for display.
message DurableOutputPayloadV1 {
  oneof payload {
    option (buf.validate.oneof).required = true;

    TextDeltaOutputV1 text_delta = 1;
    TextSnapshotOutputV1 text_snapshot = 2;
    SafeReasoningSummaryOutputV1 safe_reasoning_summary = 3;
    ToolStartedOutputV1 tool_started = 4;
    ToolFinishedOutputV1 tool_finished = 5;
    PlanProgressOutputV1 plan_progress = 6;
    SubagentProgressOutputV1 subagent_progress = 7;
    MediaOperationReferenceOutputV1 media_operation_reference = 8;
    NoticeOutputV1 notice = 9;
    ErrorOutputV1 error = 10;
  }
}

message TextDeltaOutputV1 {
  string part_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string delta = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 16384
  }];
}

message TextSnapshotOutputV1 {
  string part_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string text = 2 [(buf.validate.field).string.max_bytes = 61440];
  // Zero means no replacement. Otherwise this is the greatest earlier
  // output_seq replaced by this snapshot and is less than its record's seq.
  uint64 replaces_through_output_seq = 3;
}

message SafeReasoningSummaryOutputV1 {
  string part_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // Policy-approved summary only; never hidden chain-of-thought or provider-internal material.
  string safe_summary = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 8192
  }];
}

message ToolStartedOutputV1 {
  string tool_call_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string tool_label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  optional bytes redacted_input_summary_json = 3 [(buf.validate.field).bytes.max_len = 16384];
}

message ToolFinishedOutputV1 {
  string tool_call_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string safe_result_preview = 2 [(buf.validate.field).string = {max_bytes: 16384}];
  bool is_error = 3;
  bool truncated = 4;
}

message PlanProgressOutputV1 {
  string plan_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string safe_summary = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
  repeated PlanStepV1 steps = 3 [(buf.validate.field).repeated.max_items = 256];
}

enum SubagentProgressStatusV1 {
  SUBAGENT_PROGRESS_STATUS_V1_UNSPECIFIED = 0;
  SUBAGENT_PROGRESS_STATUS_V1_PENDING = 1;
  SUBAGENT_PROGRESS_STATUS_V1_RUNNING = 2;
  SUBAGENT_PROGRESS_STATUS_V1_COMPLETED = 3;
  SUBAGENT_PROGRESS_STATUS_V1_FAILED = 4;
  SUBAGENT_PROGRESS_STATUS_V1_CANCELED = 5;
}

message SubagentProgressOutputV1 {
  string subagent_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  SubagentProgressStatusV1 status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional string safe_summary = 3 [(buf.validate.field).string.max_bytes = 4096];
}

// Narrative pointer only. Agent does not own Media/Artifact display state;
// Session joins this stable slot to the signed Media owner projection.
message MediaOperationReferenceOutputV1 {
  string stable_output_slot_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string agent_media_command_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string operation_ref = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

enum NoticeSeverityV1 {
  NOTICE_SEVERITY_V1_UNSPECIFIED = 0;
  NOTICE_SEVERITY_V1_INFO = 1;
  NOTICE_SEVERITY_V1_WARNING = 2;
}

enum OutputRetryClassV1 {
  OUTPUT_RETRY_CLASS_V1_UNSPECIFIED = 0;
  OUTPUT_RETRY_CLASS_V1_NEVER = 1;
  OUTPUT_RETRY_CLASS_V1_IMMEDIATE = 2;
  OUTPUT_RETRY_CLASS_V1_AFTER_DELAY = 3;
  OUTPUT_RETRY_CLASS_V1_AFTER_USER_ACTION = 4;
  OUTPUT_RETRY_CLASS_V1_RECONCILE_RECEIPT = 5;
}

message NoticeOutputV1 {
  string notice_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string message = 3 [(buf.validate.field).string.max_bytes = 4096];
  NoticeSeverityV1 severity = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional OutputRetryClassV1 retry_class = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message ErrorOutputV1 {
  string error_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string message = 3 [(buf.validate.field).string.max_bytes = 4096];
  OutputRetryClassV1 retry_class = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

// output_seq is an append-only per-run sequence independent of lifecycle
// durable_seq. The terminal digest chain is frozen as follows:
// chain0 = SHA256('kokoro-output-chain-v1\0' || UTF8(run_id))
// chainN = SHA256(prev || UINT64_BE(output_seq) || HEX_DECODE(payload_sha256))
message DurableOutputRecord {
  string output_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 output_version = 2 [(buf.validate.field).uint64.const = 1];
  string run_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 output_seq = 4 [(buf.validate.field).uint64.gt = 0];
  bytes canonical_payload = 5 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 65536
  }];
  string payload_sha256 = 6 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  google.protobuf.Timestamp recorded_at = 7 [(buf.validate.field).required = true];
  string producer_instance_ref = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 producer_generation = 9 [(buf.validate.field).uint64.gt = 0];
}

message PullDurableOutputRecordsRequest {
  string run_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Exclusive per-run cursor. Zero starts at the first output record.
  uint64 after_output_seq = 2;
  uint32 page_size = 3 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 64
  }];
}

message PullDurableOutputRecordsResponse {
  repeated DurableOutputRecord records = 1 [(buf.validate.field).repeated.max_items = 64];
  optional uint64 next_after_output_seq = 2 [(buf.validate.field).uint64.gt = 0];
  bool has_more = 3;
}

message DurableExecutionEvidence {
  string evidence_ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 evidence_version = 2 [(buf.validate.field).uint64.const = 1];
  string run_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 durable_seq = 4 [(buf.validate.field).uint64.gt = 0];
  string event_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  DurableExecutionEvidenceKind kind = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  bytes canonical_payload = 7 [(buf.validate.field).bytes = {max_len: 65536}];
  string payload_sha256 = 8 [(buf.validate.field).string = {
    len: 64
    pattern: "^[0-9a-f]{64}$"
  }];
  google.protobuf.Timestamp recorded_at = 9 [(buf.validate.field).required = true];
  string producer_instance_ref = 10 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  uint64 producer_generation = 11 [(buf.validate.field).uint64.gt = 0];
}

message PullDurableExecutionEvidenceRequest {
  string run_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Exclusive per-run cursor. Zero starts at the first durable evidence row.
  uint64 after_durable_seq = 2;
  uint32 page_size = 3 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 256
  }];
}

message PullDurableExecutionEvidenceResponse {
  repeated DurableExecutionEvidence evidence = 1 [(buf.validate.field).repeated.max_items = 256];
  optional uint64 next_after_durable_seq = 2 [(buf.validate.field).uint64.gt = 0];
  bool has_more = 3;
}

message GetDurableExecutionEvidenceRequest {
  string run_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string evidence_ref = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message DurableExecutionEvidenceNotFound {}

message GetDurableExecutionEvidenceResponse {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    DurableExecutionEvidence evidence = 1;
    DurableExecutionEvidenceNotFound not_found = 2;
  }
}

message GetRunDurableCheckpointRequest {
  string run_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetRunDurableCheckpointResponse {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    DurableExecutionEvidence evidence = 1;
    DurableExecutionEvidenceNotFound not_found = 2;
  }
}
