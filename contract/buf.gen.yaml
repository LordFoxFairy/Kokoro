version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: ../kokoro-platform/kokoro-platform-admin/src/generated/contracts
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - local: protoc-gen-es
    out: ../kokoro-web/apps/admin/lib/generated/contracts
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
