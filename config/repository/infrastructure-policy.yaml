{
  "schemaVersion": 1,
  "authority": {
    "projectName": "kokoro-infra",
    "composeFile": "docker-compose.infra.yml",
    "siteScoped": false,
    "environmentScopePattern": "^(?:dev|staging|production|ci-[a-z0-9](?:[a-z0-9-]{0,22}[a-z0-9])?)$",
    "forbiddenScopePrefixes": ["site-", "site_", "tenant-", "tenant_", "workspace-", "workspace_"],
    "networkNameTemplate": "${KOKORO_NETWORK:-kokoro-net}",
    "volumeNameTemplate": "{resourcePrefix}-{service}",
    "resourcePrefixes": {
      "dev": "kokoro-infra_kokoro"
    },
    "defaultResourcePrefixTemplate": "kokoro-infra-{scope}"
  },
  "profiles": {
    "platform": ["mysql", "postgres"],
    "postgres-transition": ["postgres"],
    "runtime": ["redis", "mongo"],
    "storage": ["minio"],
    "model": ["litellm"],
    "full": ["mysql", "postgres", "redis", "mongo", "minio", "litellm"]
  },
  "databaseAuthority": {
    "phase": "postgres-primary",
    "canonicalService": "postgres",
    "compatibilityServices": ["mysql"],
    "activationAuthorized": true,
    "preservedServices": ["redis", "mongo", "minio", "litellm"],
    "rollback": {
      "preservePostgresVolume": true,
      "preserveCompatibilityMysqlVolume": true,
      "recreatePreservedServices": false
    }
  },
  "restartPolicy": {
    "development": "no",
    "ci": "no",
    "production": "unless-stopped"
  },
  "testScope": {
    "prefix": "kokoro_test_",
    "mysqlContexts": ["site", "user", "model", "credit", "payment", "admin"],
    "postgresContexts": ["platform", "session"],
    "postgresRolesByContext": {
      "platform": ["api", "worker", "admin", "migrator", "test"],
      "session": ["api", "worker", "migrator", "test"]
    },
    "mongoContexts": ["agent", "session", "hub"],
    "redisDatabaseMin": 8,
    "redisDatabaseMax": 15,
    "redisExclusiveLease": true,
    "minioBucketSuffix": "runtime"
  },
  "cleanup": {
    "localDownRemovesVolumes": false,
    "requiresEndpointFingerprint": true,
    "requiresLeaseToken": true,
    "allowsSystemPrune": false,
    "allowsVolumePrune": false,
    "forbiddenDockerOperations": ["compose down --volumes", "system prune", "volume rm", "image rm", "--remove-orphans"]
  }
}
