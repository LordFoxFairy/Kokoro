# kokoro-agent 统一配置树（KOKORO_AGENT_CONFIG 指向本文件）。
# 全部键可省（省=内置默认）；env 同名键覆盖此处；凭据 env-only（写这里会 fail-loud）。
model:
  openai_base_url: https://open.bigmodel.cn/api/paas/v4
  openai_reasoning: true
  disable_streaming: false
stream:
  redis_url: redis://127.0.0.1:6379/0
storage:
  database_url: postgresql://127.0.0.1/postgres
  database_schema: kokoro_agent
ledger:
  lease_ttl_s: 30
sandbox:
  local_shell:
    root: /data/workspace
    inherit_env: false
    timeout: 120
    max_output_bytes: 100000
  docker:
    image: python:3.12-slim
    ttl: 1800
  e2b:
    timeout: 1800
  custom:
    factory: my_pkg.sandbox:make_backend
    config: ./custom-backend.yaml
workspace_config: ./workspace.yaml
mcp:
  config: ./mcp.yaml
  egress_mode: strict
web_tools:
  fetch_allow_private: false
  search:
    provider: searxng
    url: http://127.0.0.1:8080
subagents:
  builtin: [web-researcher]
limits:
  lease_heartbeat_s: 30
  recursion_limit: 100
  drain_timeout_s: 60
  run_token_budget: 0
retention:
  events_ttl_s: 0
  run_ttl_s: 0
