# Kokoro 每环境唯一 Infra authority。
# 正式生命周期入口：node scripts/infra/manager.mjs；不要手写 -p、volume 名或第二套 stateful compose。
# profiles: platform=postgres, runtime=redis+mongo, storage=minio, model=litellm；full 由 manager 组合。
# mysql-compat 只允许显式恢复本地旧容器；它不属于 Platform/full 默认路径。

name: kokoro-infra

services:
  mysql:
    # Explicit local compatibility service; never selected by platform/full.
    image: mysql:8.4@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
    profiles: [mysql-compat]
    labels:
      io.kokoro.infra.scope: "${KOKORO_INFRA_ENVIRONMENT_SCOPE:-dev}"
      io.kokoro.infra.profile: "mysql-compat"
      io.kokoro.infra.data-marker: "mysql-data-v1"
      io.kokoro.infra.auth-marker: "${KOKORO_MYSQL_AUTH_MARKER:-mysql-auth-v1}"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-kokoro}"
      MYSQL_USER: "${MYSQL_USER:-kokoro}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:${KOKORO_MYSQL_PORT:-3307}:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["mysql-data:/var/lib/mysql"]
    restart: "${KOKORO_INFRA_RESTART_POLICY:-no}"

  postgres:
    # postgres:18.4, Platform/Session primary authority pinned 2026-07-28
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    profiles: [platform, postgres-transition]
    labels:
      io.kokoro.infra.scope: "${KOKORO_INFRA_ENVIRONMENT_SCOPE:-dev}"
      io.kokoro.infra.profile: "platform"
      io.kokoro.infra.data-marker: "postgres-data-v1"
      io.kokoro.infra.auth-marker: "${KOKORO_POSTGRES_AUTH_MARKER:-postgres-auth-v1}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      PGDATA: "/var/lib/postgresql/18/docker"
    ports: ["127.0.0.1:${KOKORO_POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["postgres-data:/var/lib/postgresql"]
    restart: "${KOKORO_INFRA_RESTART_POLICY:-no}"

  redis:
    # redis:7, pinned 2026-07-27
    image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    profiles: [runtime]
    labels:
      io.kokoro.infra.scope: "${KOKORO_INFRA_ENVIRONMENT_SCOPE:-dev}"
      io.kokoro.infra.profile: "runtime"
      io.kokoro.infra.data-marker: "redis-data-v1"
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${KOKORO_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: ["redis-data:/data"]
    restart: "${KOKORO_INFRA_RESTART_POLICY:-no}"

  mongo:
    # mongo:7, pinned 2026-07-27. Agent durable evidence commits its run outbox and
    # owner fact atomically, so even the single-node development authority must run
    # as a replica set (Mongo transactions are unavailable in standalone mode).
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    profiles: [runtime]
    labels:
      io.kokoro.infra.scope: "${KOKORO_INFRA_ENVIRONMENT_SCOPE:-dev}"
      io.kokoro.infra.profile: "runtime"
      io.kokoro.infra.data-marker: "mongo-data-v1"
    command: ["mongod", "--replSet", "kokoro-rs", "--bind_ip_all"]
    ports: ["127.0.0.1:${KOKORO_MONGO_PORT:-27017}:27017"]
    healthcheck:
      # The first probe initializes the one-member set; later probes require a
      # writable primary. The canonical member hostname is resolvable by every
      # service on kokoro-net. Host clients use directConnection=true.
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --host 127.0.0.1 --eval
          'try { rs.status().myState === 1 ? 1 : 0 }
          catch (error) { rs.initiate({_id:"kokoro-rs",members:[{_id:0,host:"mongo:27017"}]}).ok }'
          | grep -q '^1$'
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["mongo-data:/data/db"]
    restart: "${KOKORO_INFRA_RESTART_POLICY:-no}"

  minio:
    # minio/minio immutable image digest, pinned 2026-07-27
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [storage]
    labels:
      io.kokoro.infra.scope: "${KOKORO_INFRA_ENVIRONMENT_SCOPE:-dev}"
      io.kokoro.infra.profile: "storage"
      io.kokoro.infra.data-marker: "minio-data-v1"
      io.kokoro.infra.auth-marker: "${KOKORO_MINIO_AUTH_MARKER:-minio-auth-v1}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    command: ["server", "/data", "--address", ":9100", "--console-address", ":9101"]
    ports:
      - "127.0.0.1:${KOKORO_MINIO_PORT:-9100}:9100"
      - "127.0.0.1:${KOKORO_MINIO_CONSOLE_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9100/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["minio-data:/data"]
    restart: "${KOKORO_INFRA_RESTART_POLICY:-no}"

  litellm:
    # ghcr.io/berriai/litellm:main-stable, pinned 2026-07-27
    image: ghcr.io/berriai/litellm:main-stable@sha256:47afa74b495c802317712e5b8c8a65e7ca30c96636e9b618a5f8130eec72a8ee
    profiles: [model]
    labels:
      io.kokoro.infra.scope: "${KOKORO_INFRA_ENVIRONMENT_SCOPE:-dev}"
      io.kokoro.infra.profile: "model"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"
      OPENAI_COMPAT_API_KEY: "${OPENAI_COMPAT_API_KEY:-}"
      CLAUDE_CODE_MODEL: "${CLAUDE_CODE_MODEL:-}"
      CLAUDE_CODE_BASE_URL: "${CLAUDE_CODE_BASE_URL:-}"
      CLAUDE_CODE_API_KEY: "${CLAUDE_CODE_API_KEY:-}"
    ports: ["127.0.0.1:${KOKORO_LITELLM_PORT:-4000}:4000"]
    volumes:
      - "${KOKORO_LITELLM_CONFIG:-./config/infra/litellm.config.example.yaml}:/app/config.yaml:ro"
    command: ["--config=/app/config.yaml"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: "${KOKORO_INFRA_RESTART_POLICY:-no}"

volumes:
  mysql-data:
    name: "${KOKORO_INFRA_SCOPE:-kokoro-infra_kokoro}-mysql"
    labels:
      io.kokoro.infra.data-marker: "mysql-data-v1"
  postgres-data:
    name: "${KOKORO_INFRA_SCOPE:-kokoro-infra_kokoro}-postgres"
    labels:
      io.kokoro.infra.data-marker: "postgres-data-v1"
  redis-data:
    name: "${KOKORO_INFRA_SCOPE:-kokoro-infra_kokoro}-redis"
    labels:
      io.kokoro.infra.data-marker: "redis-data-v1"
  mongo-data:
    name: "${KOKORO_INFRA_SCOPE:-kokoro-infra_kokoro}-mongo"
    labels:
      io.kokoro.infra.data-marker: "mongo-data-v1"
  minio-data:
    name: "${KOKORO_INFRA_SCOPE:-kokoro-infra_kokoro}-minio"
    labels:
      io.kokoro.infra.data-marker: "minio-data-v1"

networks:
  default:
    name: "${KOKORO_NETWORK:-kokoro-net}"
