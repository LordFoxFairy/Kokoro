name: Federated Contract

# Root verifies the exact four gitlinks recorded by this commit. Child repositories retain their own CI and locks.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate private submodule token
        env:
          KOKORO_SUBMODULE_TOKEN: ${{ secrets.KOKORO_SUBMODULE_TOKEN }}
        run: |
          if [ -z "$KOKORO_SUBMODULE_TOKEN" ]; then
            echo "::error::Configure KOKORO_SUBMODULE_TOKEN with read-only access to the four private kokoro-* repositories."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Required because all four sibling submodule repositories are private.
          token: ${{ secrets.KOKORO_SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: enable pinned package managers
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: install root-only contract tooling
        run: |
          uv sync --locked
          pnpm --dir contract install --frozen-lockfile
      - name: install exact child locks for compatibility execution
        run: |
          uv sync --project kokoro-agent --locked
          npm ci --prefix kokoro-session
          pnpm --dir kokoro-platform install --frozen-lockfile
          pnpm --dir kokoro-web install --frozen-lockfile
      - name: verify exact federated pins and recoverable refs
        run: node scripts/repository/verify-federated-repositories.mjs --tree head --remote
      - name: contract byte check
        run: uv run python contract/check.py
      - name: generator and contract tests
        run: uv run pytest contract/tests -q
      - name: standard protobuf contract gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir contract run buf:format:check
          pnpm --dir contract run buf:lint
          node scripts/repository/check-generated-contracts.mjs
          if git ls-tree -r --name-only origin/main -- contract/proto | grep -q '\.proto$'; then
            pnpm --dir contract exec buf breaking --against '../.git#branch=origin/main,subdir=contract'
          else
            echo 'Buf breaking baseline bootstrap: origin/main has no contract/proto files yet.'
          fi
      - name: boundary registry gate
        run: |
          node --test scripts/contract/check-boundary-registry.test.mjs scripts/contract/check-boundary-coverage.test.mjs
          node scripts/contract/check-boundary-registry.mjs
          node scripts/contract/check-boundary-coverage.mjs
      - name: admin browser contract gate
        run: |
          uv run --locked python -m pytest scripts/contract/test_check_admin_openapi.py scripts/contract/test_admin_browser_public_shapes.py -q
          uv run --locked python scripts/contract/check_admin_openapi.py
          uv run --locked python -m pytest scripts/contract/test_check_admin_browser_schemas.py -q
          uv run --locked python scripts/contract/check_admin_browser_schemas.py
      - name: GA isolation gate
        run: |
          uv run --locked python -m pytest scripts/architecture/test_check_ga_isolation.py -q
          uv run --locked python scripts/architecture/check_ga_isolation.py
      - name: architecture governance gates
        run: |
          node --test scripts/architecture/*.test.mjs
          node scripts/architecture/check-index-coverage.ts
          node scripts/architecture/check-dependencies.ts
          node scripts/architecture/check-site-scope-planes.mjs
          node scripts/architecture/check-service-contract-imports.mjs
      - name: repository governance tests
        run: node --test scripts/repository/*.test.mjs scripts/compatibility/*.test.mjs scripts/foundation/check-evidence.test.mjs
      - name: non-container infrastructure contracts
        run: node --test scripts/infra/*.test.mjs
      - name: Python compatibility adapter tests
        run: uv run --locked pytest scripts/compatibility/test_*.py -q
      - name: pinned runtime compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp deploy/.env.example tmp/ci-infra.env
          printf '%s\n' \
            'OPENAI_API_KEY=ci-openai-not-real' \
            'ANTHROPIC_API_KEY=ci-anthropic-not-real' \
            'OPENAI_COMPAT_BASE_URL=http://127.0.0.1:9/v1' \
            'OPENAI_COMPAT_API_KEY=ci-compatible-not-real' \
            'KOKORO_LITELLM_CONFIG=./config/infra/litellm.config.example.yaml' \
            >> tmp/ci-infra.env

          cleanup() {
            set +e
            node scripts/infra/manager.mjs stop --profiles full --scope ci-federated --mode ci --infra-env-file tmp/ci-infra.env
            mapfile -t containers < <(docker ps -aq --filter label=com.docker.compose.project=kokoro-infra)
            if (( ${#containers[@]} > 0 )); then
              docker rm "${containers[@]}"
            fi
            rm -f tmp/ci-infra.env
          }
          trap cleanup EXIT INT TERM

          node scripts/infra/manager.mjs ensure --profiles full --scope ci-federated --mode ci --infra-env-file tmp/ci-infra.env
          node scripts/repository/run-pinned-compatibility.mjs \
            --matrix config/repository/compatibility-matrix.json \
            --tree head \
            --infra-env-file tmp/ci-infra.env \
            --evidence tmp/federated-compatibility.json
