name: Contract

# This commit verifies Root-owned source only. Cross-repository generated
# consumers are promoted and checked after their independently reviewed SHAs
# exist; CI never substitutes mutable sibling branches for those candidates.
on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --group dev
      - run: cmp docs/superpowers/specs/2026-08-14-slice-a-contract-manifest.yaml contract/slice-a-contract-manifest.yaml
      - run: uv run --frozen python scripts/contract/render_slice_a.py --manifest contract/slice-a-contract-manifest.yaml --check
      - run: pnpm exec buf format --diff --exit-code contract/proto
      - run: pnpm exec buf lint contract
      - run: pnpm exec buf breaking contract --against contract/breaking/slice-a-v1.binpb
      - run: pnpm exec redocly lint contract/openapi/slice-a-web-v1.yaml
      - run: uv run --frozen pytest contract/tests scripts/contract/tests -q
