# Kokoro 单机全栈生产编排（上线基线）。
# 用法：cp deploy/.env.example deploy/.env && 填值 && docker compose -f docker-compose.prod.yml up -d --build
# 所有 secret/DB/base-url/密钥经 deploy/.env 注入（env_file），不落本文件字面。
# 服务间用 compose 服务名 DNS 互访（http://kokoro-user:4211 等，见 deploy/.env）。
# 存储（workspace/deliveries/hub 包体）用共享本地卷 kokoro-workspace（单机口径）。
# 迁移：migrate 一次性服务跑完 prisma migrate deploy 后，各平台服务才启动。
# 首启后需一次性 provisioning（RS256 密钥 / 首个 admin operator / 站点 seed），见 deploy/README.md。

x-platform-build: &platform-build
  build:
    context: ./kokoro-platform
    dockerfile: deploy/docker/Dockerfile
  env_file: [./deploy/.env]
  restart: unless-stopped

services:
  # ---- 基础设施 ----
  mysql:
    image: mysql:8.4
    env_file: [./deploy/.env]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["kokoro-mysql:/var/lib/mysql"]
    restart: unless-stopped

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["kokoro-mongo:/data/db"]
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: ["kokoro-redis:/data"]
    restart: unless-stopped

  minio:
    image: minio/minio
    env_file: [./deploy/.env]
    command: ["server", "/data", "--address", ":9100", "--console-address", ":9101"]
    volumes: ["kokoro-minio:/data"]
    restart: unless-stopped

  # ---- 一次性迁移：跑完各平台 DB 的 prisma migrate deploy 才放行平台服务 ----
  migrate:
    <<: *platform-build
    restart: "no"
    command: ["pnpm", "-r", "db:migrate"]
    depends_on:
      mysql: { condition: service_healthy }

  # ---- 平台服务（同镜像，KOKORO_SERVICE_PACKAGE 选包）----
  kokoro-site:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/site" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["4201:4201"]

  kokoro-user:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/user" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["4211:4211"]

  kokoro-model:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/model" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["4221:4221"]

  kokoro-credit:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/credit" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["4231:4231"]

  kokoro-payment:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/payment" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["4241:4241"]

  kokoro-hub:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/hub" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
    volumes:
      - kokoro-workspace:/data/workspace
      - ./deploy/storage.prod.yaml:/app/storage.yaml:ro
    ports: ["4251:4251"]

  kokoro-platform-admin:
    <<: *platform-build
    environment: { KOKORO_SERVICE_PACKAGE: "@kokoro/platform-admin" }
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["4290:4290"]

  # ---- 应用层（各子仓独立镜像）----
  kokoro-session:
    build:
      context: ./kokoro-session
    env_file: [./deploy/.env]
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      kokoro-user: { condition: service_started }
    volumes:
      - kokoro-workspace:/data/workspace
      - ./deploy/storage.prod.yaml:/app/storage.yaml:ro
    ports: ["3900:3900"]
    restart: unless-stopped

  kokoro-agent:
    build:
      context: ./kokoro-agent
    env_file: [./deploy/.env]
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      litellm: { condition: service_started }
    volumes:
      - kokoro-workspace:/data/workspace
      - ./deploy/storage.prod.yaml:/app/storage.yaml:ro
    restart: unless-stopped

  kokoro-web:
    build:
      context: ./kokoro-web
    env_file: [./deploy/.env]
    depends_on:
      kokoro-session: { condition: service_started }
      kokoro-user: { condition: service_started }
    ports: ["3000:3000"]
    restart: unless-stopped

  # ---- 模型网关 ----
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    env_file: [./deploy/.env]
    volumes:
      - ./kokoro-platform/kokoro-litellm/config/litellm.config.example.yaml:/app/config.yaml:ro
    command: ["--config=/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health/liveliness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  kokoro-mysql:
  kokoro-mongo:
  kokoro-redis:
  kokoro-minio:
  kokoro-workspace:
