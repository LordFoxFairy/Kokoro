{
  "artifact": "slice-a-contract-manifest",
  "version": 1,
  "status": "reviewed-frozen",
  "authority": "machine",
  "rules": {
    "fieldLabels": [
      "required",
      "optional",
      "repeated"
    ],
    "agentEventSequence": "AgentEvent.seq starts at 1 and is globally monotonic for the entire agent_run; lease epoch is fence evidence only and never resets seq. Emit from a stale epoch is rejected. ReadRunEvidence.after_seq and AckProjection.projected_seq use this global cursor; Ack stores projected_epoch and rejects stale epoch or seq regression.",
    "projectionConsumers": {
      "sliceA": [
        "chat"
      ],
      "semantics": "AckProjection is authenticated as Chat and consumer_key must equal chat. Empty or unknown values fail INVALID_ARGUMENT before any agent_projection_ack row is read or written; future consumers require a manifest allowlist revision."
    },
    "uuid": "canonical lowercase string",
    "digest": "64 lowercase hex sha256",
    "timestamp": "google.protobuf.Timestamp / RFC3339",
    "rpcMetadata": [
      "authorization: Bearer <workload-token>",
      "x-kokoro-request-id"
    ],
    "userRpcMetadata": "x-kokoro-user-authorization: Bearer <iam-access-jwt>",
    "accessJwt": {
      "header": {
        "alg": "RS256",
        "typ": "JWT",
        "kid": "nonempty active JWKS key id"
      },
      "claims": {
        "iss": "kokoro-iam",
        "aud": "kokoro-user-backend",
        "sub": "canonical principal UUID",
        "site_id": "canonical Site UUID",
        "organization_id": "canonical Organization UUID",
        "auth_session_id": "canonical IAM auth-session UUID",
        "iat": "NumericDate",
        "exp": "NumericDate"
      },
      "nbf": "absent",
      "maxTtlSeconds": 900,
      "clockSkewSeconds": 30,
      "validation": "Chat and IAM reject any non-RS256 alg, missing/unknown kid, invalid signature, wrong typ/iss/aud, expired or future-issued token, overlong TTL or malformed UUID claim. IAM additionally proves the auth session is active and bound to the same principal/Site/Organization; Chat derives ActorContext only from a successful IAM Authorize response, never from unverified claims."
    },
    "streamAuthorizationExpiry": "Chat closes StreamConversationEvents no later than access JWT exp + 30-second clock skew and emits zero frames after that deadline. Web refreshes the sealed IAM session and reconnects from the last committed seq; membership revocation exposure is therefore bounded by the 900-second JWT TTL plus skew.",
    "cookieSecurity": "Secure is mandatory outside the exact loopback fixture runtime; fixture may omit Secure only on http://127.0.0.1 and tests reject any non-loopback exception",
    "sessionCookiePolicy": {
      "maxAgeSeconds": 2592000,
      "semantics": "kokoro_session Max-Age = max(0, min(refresh_expires_at - now, 2592000)); exact cap is 30 days and has no second runtime configuration key."
    },
    "errorTransport": "grpc status plus serialized kokoro.common.v1.ErrorDetail in kokoro-error-bin",
    "controlDecisionPayloadSchemasByKind": {
      "approve": {
        "additionalProperties": false,
        "required": [],
        "properties": [
          {
            "name": "args",
            "type": "json-object",
            "optional": true,
            "maxBytes": 65536
          }
        ]
      },
      "edit": {
        "additionalProperties": false,
        "required": [
          "args"
        ],
        "properties": [
          {
            "name": "args",
            "type": "json-object",
            "maxBytes": 65536
          }
        ]
      },
      "reject": {
        "additionalProperties": false,
        "required": [],
        "properties": [
          {
            "name": "reason",
            "type": "string",
            "optional": true,
            "maxLength": 4096
          }
        ]
      },
      "respond": {
        "additionalProperties": false,
        "required": [
          "response"
        ],
        "properties": [
          {
            "name": "response",
            "type": "string",
            "minLength": 1,
            "maxLength": 65536
          }
        ]
      },
      "submit": {
        "additionalProperties": false,
        "required": [
          "value"
        ],
        "properties": [
          {
            "name": "value",
            "type": "json-object",
            "maxBytes": 65536
          }
        ]
      }
    },
    "controlDecisionValidation": "Chat validates the discriminated payload, canonicalizes payload_json bytes and Agent validates the same schema again before resume",
    "magicLinkRedirect": "Browser sends no redirect URI. BFF constructs HTTPS canonical active Site host + fixed /api/auth/callback; IAM revalidates active Site domain and exact callback path",
    "magicLinkNonceDerivation": "BFF derives state_key=HKDF-SHA256(contents of KOKORO_WEB_SESSION_KEY_FILE (mounted web.session-key), info=UTF8(kokoro.magic-state.v1)), then nonce=base64url(HMAC-SHA256(state_key, UUID_BYTES(site_id) || UUID_BYTES(command_id))); retry with the same Idempotency-Key derives the same 32-byte nonce even if the first response is lost",
    "magicLinkNonceBinding": "BFF hashes kokoro_auth_nonce and sends nonce_digest on both RequestMagicLink and ConsumeMagicLink; IAM stores and constant-time compares it before single consume",
    "authCommandIdentity": {
      "consumeMagicLink": {
        "commandId": "UUIDv5(site_id, UTF8(consume-magic-link\n) || ASCII_HEX(SHA256(token)))",
        "requestDigest": "SHA256(canonical_json({site_id, token_digest, nonce_digest}))"
      },
      "refreshSession": {
        "commandId": "unpredictable UUID refresh_command_id sealed in the Web envelope and reused until a response is delivered",
        "requestDigest": "SHA256(canonical_json({site_id, auth_session_id, old_refresh_token_digest}))",
        "rotation": "after a delivered success, Web seals a fresh random refresh_command_id with the successor token; old token with missing/different command id triggers family revoke"
      },
      "logout": {
        "commandId": "UUIDv5(auth_session_id, UTF8(logout))",
        "requestDigest": "SHA256(canonical_json({auth_session_id, refresh_token_digest}))"
      }
    },
    "authReceiptRecovery": "Refresh tokens are deterministically derived from the IAM refresh-derivation key, auth_session_id and family_generation; SQL stores only SHA-256. Same command+digest rereads the same session and re-derives the identical successor refresh token; access JWT may be freshly signed for that session. Plaintext tokens never appear in SQL/logs; digest drift conflicts.",
    "submitDefaults": {
      "requested_model_label": "default",
      "requested_agent_key": "general",
      "semantics": "Chat resolves omitted values before persistence and launch digest; Chat rejects invalid syntax, while syntactically valid unknown model/preset is deterministically rejected by Agent admission and converged by Chat"
    },
    "firstConversationTitle": {
      "algorithm": "After validating nonempty content, title = Array.from(content).slice(0, 80).join(\"\"): first 80 Unicode code points, no trimming and no fallback.",
      "idempotency": "CreateConversation and SubmitMessage use distinct stable bounded opaque browser keys; each retry reuses its original key and canonical digest."
    },
    "snapshotMaterialization": {
      "session.created": "chat_conversation owner fact; no MessagePart",
      "run.created": "chat_run_launch plus synthesized/projected RunView; no MessagePart",
      "message.user": "user Message plus TEXT MessagePart with the exact browser payload",
      "message.delta": "append assistant TEXT MessagePart payload in producer-seq order",
      "message.completed": "update assistant Message/part terminal status",
      "thinking.delta": "append THINKING MessagePart payload in producer-seq order",
      "tool.invoked": "upsert TOOL_CALL MessagePart by tool_call_id",
      "tool.output.delta": "append TOOL_RESULT MessagePart payload by tool_call_id",
      "tool.awaiting_approval": "persist complete chat_interaction payload and mark the matching TOOL_CALL pending",
      "tool.returned": "finalize TOOL_RESULT MessagePart and matching TOOL_CALL status",
      "delivery.created": "append DELIVERY MessagePart containing the exact browser payload",
      "todo.updated": "replace the run-scoped TODO MessagePart with the exact ordered browser payload",
      "subagent.started": "upsert SUBAGENT MessagePart by subagent_id",
      "subagent.finished": "finalize SUBAGENT MessagePart by subagent_id",
      "subagent.thinking.delta": "append thinking content to SUBAGENT MessagePart by subagent_id",
      "subagent.text.delta": "append text content to SUBAGENT MessagePart by subagent_id",
      "subagent.text.completed": "finalize subagent text in SUBAGENT MessagePart by subagent_id",
      "subagent.tool.invoked": "upsert nested tool fact in SUBAGENT MessagePart by subagent_id/tool_call_id",
      "subagent.tool.returned": "finalize nested tool fact in SUBAGENT MessagePart by subagent_id/tool_call_id",
      "run.completed": "finalize chat_run_view and assistant Message; no new MessagePart",
      "run.failed": "finalize chat_run_view and assistant Message with failure; no new MessagePart",
      "retentionRule": "A stream row is deletable only after its mapped owner facts commit and snapshot watermark is at least that seq. Unknown or not-yet-materialized kinds are retained, never silently dropped."
    },
    "paginationDefaults": {
      "listConversationsLimit": 50,
      "semantics": "When the browser omits limit, the Web BFF sends PageRequest.limit=50; explicit values remain bounded to 1..100."
    },
    "capabilitySliceASelectors": "requested_selectors must be empty; any nonempty selector is deterministic AGENT_ADMISSION_REJECTED, never silently discarded into the empty snapshot",
    "browserIdempotency": "For pre-auth RequestMagicLink, BFF derives UUIDv5 command_id from resolved site_id + operation_id + bounded opaque Idempotency-Key. For authenticated Conversation mutations it derives UUIDv5 from organization_id + operation_id + key. In both cases BFF computes canonical request_digest and rejects browser digest.",
    "projectionNack": {
      "requestFields": [
        "rejected_seq",
        "rejection_code"
      ],
      "responseFields": [
        "stored_rejected_seq",
        "stored_rejection_code"
      ],
      "presence": "both-absent-positive-or-both-present-nack",
      "rejectedSeq": {
        "minimum": 1,
        "relation": "projected_seq + 1"
      },
      "rejectionCode": {
        "encoding": "UTF-8",
        "nonblank": true,
        "maxBytes": 128
      },
      "watermarkSemantics": "projected_seq remains the last successfully persisted positive watermark; epoch belongs to that watermark except for the explicit zero-watermark rule; rejected event lookup is run-global by agent_run_id plus rejected_seq and validates stored epoch",
      "zeroWatermarkEpoch": "rejected event epoch when projected_seq == 0 and no positive event exists",
      "durableEcho": "first or exact-replay NACK returns both stored fields exactly equal to immutable rejection evidence; different seq/code conflicts",
      "compatibility": "old server ignores request fields 6-7 and sees only last-good watermark; old response omits fields 3-4; absent/mismatched echo retains quarantine and exact retry",
      "errorMapping": {
        "invalidShape": {
          "grpc": "INVALID_ARGUMENT",
          "code": "ERROR_CODE_INVALID_ARGUMENT",
          "retryable": false
        },
        "runMissing": {
          "grpc": "NOT_FOUND",
          "code": "ERROR_CODE_NOT_FOUND",
          "retryable": false
        },
        "bearerInvalid": {
          "grpc": "UNAUTHENTICATED",
          "code": "ERROR_CODE_UNAUTHENTICATED",
          "retryable": false
        },
        "eventUnavailable": {
          "grpc": "FAILED_PRECONDITION",
          "code": "ERROR_CODE_PRECONDITION_FAILED",
          "retryable": true
        },
        "dependencyUnavailable": {
          "grpc": "UNAVAILABLE",
          "code": "ERROR_CODE_DEPENDENCY_UNAVAILABLE",
          "retryable": true
        },
        "staleFence": {
          "grpc": "ABORTED",
          "code": "ERROR_CODE_STALE_GENERATION",
          "retryable": true
        },
        "firstRejectionConflict": {
          "grpc": "ALREADY_EXISTS",
          "code": "ERROR_CODE_CONFLICT",
          "retryable": false
        },
        "internal": {
          "grpc": "INTERNAL",
          "code": "ERROR_CODE_INTERNAL",
          "retryable": false
        }
      },
      "errorDetail": {
        "requestId": "echo validated nonblank request_id on every error",
        "message": {
          "maxBytes": 512,
          "internal": "redacted"
        },
        "staleFenceCurrentGeneration": "required"
      }
    }
  },
