[project]
name = "kokoro-root-contract-tooling"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "grpcio-tools==1.76.0",
  "protobuf==6.33.6",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["contract/tests", "scripts/contract/tests"]
