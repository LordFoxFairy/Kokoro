[project]
name = "kokoro-root-tooling"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.uv]
# 锁定制品来源用：uv 把 constraint-dependencies 记进 lock manifest，
# 移除它们会让 `uv lock --check` 要求重新解析，所以这些约束必须常驻。
constraint-dependencies = [
  "colorama==0.4.6",
  "iniconfig==2.3.0",
  "packaging==26.2",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "pytest==9.0.2",
  "pyyaml==6.0.3",
]
package = false

# 声明官方源为默认制品来源。
# 注意（uv 0.10.4 实测）：本声明**不**覆盖 user-level `~/.config/uv/uv.toml` 里
# `default = true` 的 index —— 用户级配置优先。所以在配了镜像的机器上重新解析时，
# 必须显式 `UV_NO_CONFIG=1 uv lock`，否则 URL 会被改写回镜像。本声明只在
# 没有冲突用户配置的机器（含 CI）上生效。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
