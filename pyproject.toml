[project]
name = "kokoro-root-tooling"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.uv]
# 锁定制品来源用：uv 把 constraint-dependencies 记进 lock manifest，
# 移除它们会让 `uv lock --check` 要求重新解析，所以这些约束必须常驻。
constraint-dependencies = [
  "colorama==0.4.6",
  "iniconfig==2.3.0",
  "packaging==26.2",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "pytest==9.0.2",
  "pyyaml==6.0.3",
]
package = false

# 显式声明官方源：uv 的仓内声明优先于开发机 user-level 配置。
# 没有它时，制品 URL 取决于谁最后跑的 uv lock。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
