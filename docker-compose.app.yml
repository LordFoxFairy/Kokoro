# Kokoro latest-only application topology.
#
# Infrastructure is owned by docker-compose.infra.yml and joined through kokoro-net. This file
# contains no database, cache, object-store, or model-provider containers. Platform's immutable
# image is selected only through deploy/docker/runtime-entrypoint.mjs. A generated Site project is
# promoted as its own image; Root never builds a Site from the kokoro-web factory repository.

name: kokoro-app

x-platform-build: &platform-build
  image: ${KOKORO_PLATFORM_IMAGE:-kokoro-platform:latest}
  build:
    context: ./kokoro-platform
    dockerfile: deploy/docker/Dockerfile
  networks: [default]
  restart: unless-stopped

x-platform-database: &platform-database
  PLATFORM_DATABASE_EXPECTED_DATABASE: ${PLATFORM_DATABASE_EXPECTED_DATABASE:-kokoro_platform}
  PLATFORM_DATABASE_MIGRATOR_ROLE: ${PLATFORM_DATABASE_MIGRATOR_ROLE:-platform_migrator}
  PLATFORM_DATABASE_API_ROLE: ${PLATFORM_DATABASE_API_ROLE:-platform_api}
  PLATFORM_DATABASE_ADMISSION_ROLE: ${PLATFORM_DATABASE_ADMISSION_ROLE:-platform_admission}
  PLATFORM_DATABASE_AUTHORIZATION_ROLE: ${PLATFORM_DATABASE_AUTHORIZATION_ROLE:-platform_authorization}
  PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE: ${PLATFORM_DATABASE_ASSET_DATA_PLANE_ROLE:-platform_asset_data_plane}
  PLATFORM_DATABASE_MODEL_GATEWAY_ROLE: ${PLATFORM_DATABASE_MODEL_GATEWAY_ROLE:-platform_model_gateway}
  PLATFORM_DATABASE_WORKER_ROLE: ${PLATFORM_DATABASE_WORKER_ROLE:-platform_worker}
  PLATFORM_DATABASE_ADMIN_ROLE: ${PLATFORM_DATABASE_ADMIN_ROLE:-platform_admin}

x-session-build: &session-build
  image: ${KOKORO_SESSION_IMAGE:-kokoro-session:latest}
  build:
    context: ./kokoro-session
  networks: [default]
  restart: unless-stopped

x-agent-build: &agent-build
  image: ${KOKORO_AGENT_IMAGE:-kokoro-agent:latest}
  build:
    context: ./kokoro-agent
  networks: [default]
  restart: unless-stopped

services:
  platform-migrator:
    <<: *platform-build
    restart: "no"
    env_file:
      - path: ${KOKORO_PLATFORM_MIGRATOR_ENV_FILE:-./deploy/env/platform-migrator.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-migrator
      PLATFORM_DATABASE_CREDENTIAL_CLASS: migrator
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_MIGRATOR:?DATABASE_URL_PLATFORM_MIGRATOR is required}

  # Fresh-install only. This is deliberately excluded from the long-running runtime set and from
  # normal upgrades: the database owner function seals itself after installing the first governors.
  platform-admin-bootstrap:
    <<: *platform-build
    restart: "no"
    user: "${KOKORO_ADMIN_AUTHORITY_BOOTSTRAP_UID:-1000}:${KOKORO_ADMIN_AUTHORITY_BOOTSTRAP_GID:-1000}"
    command:
      - node
      - --conditions=kokoro-runtime
      - dist/src/process/admin-authority-bootstrap.js
      - --file
      - /run/secrets/kokoro/admin-authority-bootstrap.json
    env_file:
      - path: ${KOKORO_PLATFORM_MIGRATOR_ENV_FILE:-./deploy/env/platform-migrator.env}
        required: false
    environment:
      <<: *platform-database
      PLATFORM_DATABASE_CREDENTIAL_CLASS: migrator
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_MIGRATOR:?DATABASE_URL_PLATFORM_MIGRATOR is required}
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_ADMIN_AUTHORITY_BOOTSTRAP_FILE:-./deploy/secrets/admin-authority-bootstrap.json}:/run/secrets/kokoro/admin-authority-bootstrap.json:ro

  platform-api:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_API_ENV_FILE:-./deploy/env/platform-api.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-api
      PLATFORM_DATABASE_CREDENTIAL_CLASS: api
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_API:?DATABASE_URL_PLATFORM_API is required}
      PLATFORM_API_PORT: "4100"
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-api:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${PLATFORM_API_HOST_PORT:-4100}:4100"]

  platform-admission:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_ADMISSION_ENV_FILE:-./deploy/env/platform-admission.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-admission
      PLATFORM_DATABASE_CREDENTIAL_CLASS: admission
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ADMISSION:?DATABASE_URL_PLATFORM_ADMISSION is required}
      PLATFORM_ADMISSION_PORT: "4244"
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-admission:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${PLATFORM_ADMISSION_HOST_PORT:-4244}:4244"]

  platform-authorization:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_AUTHORIZATION_ENV_FILE:-./deploy/env/platform-authorization.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-authorization
      PLATFORM_DATABASE_CREDENTIAL_CLASS: authorization
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_AUTHORIZATION:?DATABASE_URL_PLATFORM_AUTHORIZATION is required}
      PLATFORM_AUTHORIZATION_PORT: "4143"
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-authorization:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${PLATFORM_AUTHORIZATION_HOST_PORT:-4143}:4143"]

  platform-asset-data-plane:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_ASSET_DATA_PLANE_ENV_FILE:-./deploy/env/platform-asset-data-plane.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-asset-data-plane
      PLATFORM_DATABASE_CREDENTIAL_CLASS: asset-data-plane
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ASSET_DATA_PLANE:?DATABASE_URL_PLATFORM_ASSET_DATA_PLANE is required}
      PLATFORM_ASSET_DATA_PLANE_PORT: "4246"
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-asset-data-plane:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${PLATFORM_ASSET_DATA_PLANE_HOST_PORT:-4246}:4246"]

  platform-model-gateway:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_MODEL_GATEWAY_ENV_FILE:-./deploy/env/platform-model-gateway.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-model-gateway
      PLATFORM_DATABASE_CREDENTIAL_CLASS: model-gateway
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_MODEL_GATEWAY:?DATABASE_URL_PLATFORM_MODEL_GATEWAY is required}
      PLATFORM_MODEL_GATEWAY_PORT: "4247"
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-model-gateway:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${PLATFORM_MODEL_GATEWAY_HOST_PORT:-4247}:4247"]

  platform-worker:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_WORKER_ENV_FILE:-./deploy/env/platform-worker.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-worker
      PLATFORM_DATABASE_CREDENTIAL_CLASS: worker
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_WORKER:?DATABASE_URL_PLATFORM_WORKER is required}
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-worker:/run/secrets/kokoro:ro

  platform-admin:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_PLATFORM_ADMIN_ENV_FILE:-./deploy/env/platform-admin.env}
        required: false
    environment:
      <<: *platform-database
      KOKORO_SERVICE_PACKAGE: platform-admin
      PLATFORM_DATABASE_CREDENTIAL_CLASS: admin
      DATABASE_URL_PLATFORM: ${DATABASE_URL_PLATFORM_ADMIN:?DATABASE_URL_PLATFORM_ADMIN is required}
      PLATFORM_ADMIN_PORT: "4101"
      PLATFORM_SITE_RELEASE_CERTIFICATION_KEYS_FILE: ${PLATFORM_SITE_RELEASE_CERTIFICATION_KEYS_FILE:-/run/secrets/kokoro/site-release-certification-keys.json}
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/platform-admin:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${PLATFORM_ADMIN_HOST_PORT:-4101}:4101"]

  workspace-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/workspace/workspace && chown -R 1001:999 /data/workspace"]
    volumes: ["kokoro-workspace:/data/workspace"]
    networks: [default]
    restart: "no"

  kokoro-hub:
    <<: *platform-build
    env_file:
      - path: ${KOKORO_HUB_HTTP_ENV_FILE:-./deploy/env/hub-http.env}
        required: false
    environment:
      KOKORO_SERVICE_PACKAGE: "@kokoro/hub"
      KOKORO_HUB_PORT: "4251"
    depends_on:
      platform-migrator: { condition: service_completed_successfully }
      workspace-init: { condition: service_completed_successfully }
    volumes:
      - kokoro-workspace:/data/workspace
      - ${KOKORO_STORAGE_FILE:-./deploy/storage.yaml}:/app/storage.yaml:ro
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/hub-http:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${KOKORO_HUB_HOST_PORT:-4251}:4251"]

  kokoro-hub-runtime:
    <<: *platform-build
    command: ["node", "--conditions=kokoro-runtime", "kokoro-hub/dist/interfaces/connect/main.js"]
    env_file:
      - path: ${KOKORO_HUB_RUNTIME_ENV_FILE:-./deploy/env/hub-runtime.env}
        required: false
    environment:
      KOKORO_HUB_CONNECT_PORT: "4252"
    depends_on:
      platform-admission: { condition: service_started }
      workspace-init: { condition: service_completed_successfully }
    volumes:
      - kokoro-workspace:/data/workspace
      - ${KOKORO_STORAGE_FILE:-./deploy/storage.yaml}:/app/storage.yaml:ro
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/hub-runtime:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${KOKORO_HUB_RUNTIME_HOST_PORT:-4252}:4252"]

  kokoro-agent-evidence:
    <<: *agent-build
    command: ["uv", "run", "--no-sync", "kokoro-agent-evidence"]
    env_file:
      - path: ${KOKORO_AGENT_EVIDENCE_ENV_FILE:-./deploy/env/agent-evidence.env}
        required: false
    environment:
      KOKORO_AGENT_EVIDENCE_HOST: 0.0.0.0
      KOKORO_AGENT_EVIDENCE_PORT: "8443"
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/agent-evidence:/run/secrets/kokoro:ro
    ports: ["127.0.0.1:${KOKORO_AGENT_EVIDENCE_HOST_PORT:-8443}:8443"]

  kokoro-session:
    <<: *session-build
    env_file:
      - path: ${KOKORO_SESSION_ENV_FILE:-./deploy/env/session.env}
        required: false
    environment:
      KOKORO_SESSION_PORT: "3900"
      KOKORO_SESSION_OWNER_AUTHORITY_PORT: "3901"
    depends_on:
      platform-admission: { condition: service_started }
      platform-authorization: { condition: service_started }
      kokoro-agent-evidence: { condition: service_started }
      workspace-init: { condition: service_completed_successfully }
    volumes:
      - kokoro-workspace:/data/workspace
      - ${KOKORO_STORAGE_FILE:-./deploy/storage.yaml}:/app/storage.yaml:ro
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/session:/run/secrets/kokoro:ro
    ports:
      - "127.0.0.1:${KOKORO_SESSION_HOST_PORT:-3900}:3900"
      - "127.0.0.1:${KOKORO_SESSION_OWNER_AUTHORITY_HOST_PORT:-3901}:3901"

  kokoro-agent-worker:
    <<: *agent-build
    env_file:
      - path: ${KOKORO_AGENT_WORKER_ENV_FILE:-./deploy/env/agent-worker.env}
        required: false
    depends_on:
      platform-model-gateway: { condition: service_started }
      kokoro-hub-runtime: { condition: service_started }
      workspace-init: { condition: service_completed_successfully }
    volumes:
      - kokoro-workspace:/data/workspace
      - ${KOKORO_STORAGE_FILE:-./deploy/storage.yaml}:/app/storage.yaml:ro
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/agent-worker:/run/secrets/kokoro:ro

  kokoro-site-release:
    image: ${KOKORO_SITE_IMAGE:-kokoro-reference-site:latest}
    env_file:
      - path: ${KOKORO_SITE_ENV_FILE:-./deploy/env/site-release.env}
        required: false
    networks: [default]
    depends_on:
      platform-api: { condition: service_started }
      platform-asset-data-plane: { condition: service_started }
      kokoro-session: { condition: service_started }
    volumes:
      - ${KOKORO_SECRETS_DIR:-./deploy/secrets}/site-release:/run/secrets/kokoro:ro
    ports: ["${KOKORO_SITE_HOST_PORT:-3000}:3000"]
    restart: unless-stopped

networks:
  default:
    external: true
    name: ${KOKORO_NETWORK:-kokoro-net}

volumes:
  kokoro-workspace:
