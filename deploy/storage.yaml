# 工作区/交付物/hub 包体存储配置（单机口径：共享本地卷 kokoro-workspace 挂在 /data/workspace）。
# session/agent/hub 经 KOKORO_WORKSPACE_CONFIG=/app/storage.yaml 读取本文件（compose 只读挂载）。
# 多机/横向扩展时改为 S3（minio 已在编排），把 type 换 s3 + 填 bucket/endpoint/凭据。
workspace:
  type: local
  root: /data/workspace/workspace
deliveries:
  type: local
  root: /data/workspace/deliveries
hub:
  type: local
  root: /data/workspace/hub-packages
