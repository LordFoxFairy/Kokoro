# Kokoro 应用层（k8s）：session / agent / web。各子仓独立镜像；一律 envFrom kokoro-env 连基建/平台。
# workspace 用 RWX PVC 共享给 hub（见 platform.yaml）/session/agent；storage.yaml 经 ConfigMap 挂 /app/storage.yaml。
# ---------------------------------------------------------------- 共享工作区 PVC（RWX：多 pod 同挂）
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: kokoro-workspace }
spec:
  accessModes: ["ReadWriteMany"] # 需 RWX 存储类（如 nfs/cephfs/efs）；单机可用 hostPath PV 或 local-path+单节点
  resources: { requests: { storage: 20Gi } }
# ---------------------------------------------------------------- session
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-session }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-session } }
  template:
    metadata: { labels: { app: kokoro-session } }
    spec:
      containers:
        - name: app
          image: kokoro-kokoro-session:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: kokoro-env } }]
          ports: [{ containerPort: 3900 }]
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-session }
spec: { selector: { app: kokoro-session }, ports: [{ port: 3900, targetPort: 3900 }] }
# ---------------------------------------------------------------- agent（worker，无 Service）
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-agent } }
  template:
    metadata: { labels: { app: kokoro-agent } }
    spec:
      containers:
        - name: app
          image: kokoro-kokoro-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: kokoro-env } }]
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
# ---------------------------------------------------------------- web
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-web }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-web } }
  template:
    metadata: { labels: { app: kokoro-web } }
    spec:
      containers:
        - name: app
          image: kokoro-kokoro-web:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: kokoro-env } }]
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-web }
spec: { selector: { app: kokoro-web }, ports: [{ port: 3000, targetPort: 3000 }] }
# ---------------------------------------------------------------- web Ingress（按需改 host/ingressClassName）
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kokoro-web
  annotations:
    # 站点解析按 Host：真实域名替换下方 host（与 KOKORO_WEB_ORIGIN/站点 seed 对齐）。
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  rules:
    - host: kokoro.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kokoro-web
                port: { number: 3000 }
