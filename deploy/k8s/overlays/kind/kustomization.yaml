# 本地 kind 集群 overlay：单节点 + local-path storage（仅 RWO）。
# 把 workspace 从 RWX 降为 RWO —— kind 单节点上 hub/session/agent 同调度到该节点，RWO(单节点多 pod)可共享。
# 真云集群用 base（RWX PVC，接 nfs/cephfs/efs）。
# 用法：kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s/overlays/kind | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: PersistentVolumeClaim
      name: kokoro-workspace
    patch: |
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteOnce
