# Latest Platform topology. Every process gets its own environment Secret and file Secret; no
# runtime Pod receives the migrator credential. The ConfigMap contains only non-secret role names.
apiVersion: apps/v1
kind: Deployment
metadata: { name: platform-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: platform-api } }
  template:
    metadata: { labels: { app: platform-api } }
    spec:
      containers:
        - name: platform-api
          image: kokoro-platform:latest
          envFrom:
            - configMapRef: { name: platform-runtime }
            - secretRef: { name: platform-api-environment }
          env:
            - { name: KOKORO_SERVICE_PACKAGE, value: platform-api }
            - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: api }
            - { name: PLATFORM_API_PORT, value: "4100" }
          ports: [{ name: https, containerPort: 4100 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: https, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{ name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }]
      volumes: [{ name: secrets, secret: { secretName: platform-api-files } }]
---
apiVersion: v1
kind: Service
metadata: { name: platform-api }
spec:
  selector: { app: platform-api }
  ports: [{ name: https, port: 4100, targetPort: https }]
---
