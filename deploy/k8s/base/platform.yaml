apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-hub } }
  template:
    metadata: { labels: { app: kokoro-hub } }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kokoro-hub
          image: kokoro-platform:latest
          envFrom: [{ secretRef: { name: hub-http-environment } }]
          env:
            - { name: KOKORO_SERVICE_PACKAGE, value: "@kokoro/hub" }
            - { name: KOKORO_HUB_PORT, value: "4251" }
          ports: [{ name: http, containerPort: 4251 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
            - { name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
        - { name: secrets, secret: { secretName: hub-http-files } }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-hub }
spec:
  selector: { app: kokoro-hub }
  ports: [{ name: http, port: 4251, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-hub-runtime }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-hub-runtime } }
  template:
    metadata: { labels: { app: kokoro-hub-runtime } }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kokoro-hub-runtime
          image: kokoro-platform:latest
          command: ["node", "--conditions=kokoro-runtime", "kokoro-hub/dist/interfaces/connect/main.js"]
          envFrom: [{ secretRef: { name: hub-runtime-environment } }]
          env: [{ name: KOKORO_HUB_CONNECT_PORT, value: "4252" }]
          ports: [{ name: connect, containerPort: 4252 }]
          readinessProbe: { tcpSocket: { port: connect }, initialDelaySeconds: 5, periodSeconds: 10 }
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
            - { name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
        - { name: secrets, secret: { secretName: hub-runtime-files } }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-hub-runtime }
spec:
  selector: { app: kokoro-hub-runtime }
  ports: [{ name: connect, port: 4252, targetPort: connect }]
