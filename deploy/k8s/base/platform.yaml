# ---------------------------------------------------------------- hub（挂 workspace + storage.yaml）
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-hub } }
  template:
    metadata: { labels: { app: kokoro-hub } }
    spec:
      containers:
        - name: app
          image: kokoro-platform:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: KOKORO_SERVICE_PACKAGE, value: "@kokoro/hub" }]
          envFrom: [{ secretRef: { name: kokoro-env } }]
          ports: [{ containerPort: 4251 }]
          readinessProbe: { httpGet: { path: /healthz, port: 4251 }, initialDelaySeconds: 10, periodSeconds: 10 }
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-hub }
spec: { selector: { app: kokoro-hub }, ports: [{ port: 4251, targetPort: 4251 }] }
