# Kokoro 平台层（k8s）：7 服务共用同一镜像 kokoro-platform:latest，靠 KOKORO_SERVICE_PACKAGE 选包。
# 一律 envFrom kokoro-env（= compose 的 env_file，单源 deploy/.env.prod）连基建/互访。
# Service 名 = env URL 主机名（kokoro-user / kokoro-site / …），故 DATABASE_URL / *_BASE_URL 原样可用。
# ---------------------------------------------------------------- site
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-site }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-site } }
  template:
    metadata: { labels: { app: kokoro-site } }
    spec:
      containers:
        - name: app
          image: kokoro-platform:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: KOKORO_SERVICE_PACKAGE, value: "@kokoro/site" }]
          envFrom: [{ secretRef: { name: kokoro-env } }]
          ports: [{ containerPort: 4201 }]
          readinessProbe: { httpGet: { path: /healthz, port: 4201 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-site }
spec: { selector: { app: kokoro-site }, ports: [{ port: 4201, targetPort: 4201 }] }
