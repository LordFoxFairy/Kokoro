# Kokoro provisioning（k8s Jobs）：与 provision.sh 同序 —— migrate → seed（模型/运营/站点/计价/积分包）。
# 全幂等，可重复 apply（同名 Job 需先删旧：kubectl delete job -n kokoro migrate provision）。
# ---------------------------------------------------------------- migrate（一次性迁移）
apiVersion: batch/v1
kind: Job
metadata: { name: migrate }
spec:
  backoffLimit: 6
  template:
    metadata: { labels: { app: migrate } }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting mysql; sleep 2; done"]
      containers:
        - name: migrate
          image: kokoro-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["pnpm", "-r", "db:migrate"]
          envFrom: [{ secretRef: { name: kokoro-env } }]
# ---------------------------------------------------------------- provision RBAC（initContainer 需读 migrate Job 状态）
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: kokoro-provisioner }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: kokoro-provisioner }
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: kokoro-provisioner }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kokoro-provisioner }
subjects:
  - { kind: ServiceAccount, name: kokoro-provisioner }
# ---------------------------------------------------------------- provision（幂等 seed；等 migrate Job 真完成）
---
apiVersion: batch/v1
kind: Job
metadata: { name: provision }
spec:
  backoffLimit: 6
  template:
    metadata: { labels: { app: provision } }
    spec:
      restartPolicy: Never
      serviceAccountName: kokoro-provisioner
      # 等 migrate Job 完成（全平台迁移就绪）——平台 healthz 不 gate DB,故必须等 Job 而非端口。
      initContainers:
        - name: wait-migrate
          image: bitnami/kubectl:latest
          command: ["kubectl", "wait", "--for=condition=complete", "--timeout=900s", "job/migrate"]
      containers:
        - name: provision
          image: kokoro-platform:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: kokoro-env } }]
          command:
            - sh
            - -c
            - >
              pnpm --filter @kokoro/model seed:builtin &&
              pnpm --filter @kokoro/platform-admin db:seed &&
              pnpm --filter @kokoro/site seed:site &&
              pnpm --filter @kokoro/credit seed:pricing &&
              pnpm --filter @kokoro/payment seed:packs
