# Schema/ACL migration is the only implicit release Job. Business catalog bootstrap goes through
# typed owner APIs and is deliberately not implemented as direct SQL or retired package seeds.
apiVersion: batch/v1
kind: Job
metadata: { name: platform-migrator }
spec:
  backoffLimit: 6
  template:
    metadata: { labels: { app: platform-migrator } }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-postgres
          image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432; do sleep 2; done
      containers:
        - name: platform-migrator
          image: kokoro-platform:latest
          envFrom:
            - configMapRef: { name: platform-runtime }
            - secretRef: { name: platform-migrator-environment }
          env:
            - { name: KOKORO_SERVICE_PACKAGE, value: platform-migrator }
            - { name: PLATFORM_DATABASE_CREDENTIAL_CLASS, value: migrator }
