apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kokoro

resources:
  - namespace.yaml
  - runtime-config.yaml
  - infra.yaml
  - platform.yaml
  - app.yaml
  - jobs.yaml

# Only infrastructure receives the local bring-up env. Application identities use the external,
# workload-specific Secrets documented in deploy/k8s/README.md; this prevents a runtime Pod from
# receiving another process's database or mTLS credential.
secretGenerator:
  - name: kokoro-infra-env
    envs:
      - ../../.env.prod
configMapGenerator:
  - name: kokoro-storage
    files:
      - storage.yaml=../../storage.yaml
  - name: kokoro-litellm-config
    files:
      - config.yaml=../../../kokoro-platform/kokoro-litellm/config/litellm.config.example.yaml

# Stable names keep external Secret references deterministic. Rotate credentials through the
# secret manager and explicitly roll the owning workload.
generatorOptions:
  disableNameSuffixHash: true

# Release overlays must replace these local image names with verified immutable digests.
images:
  - name: kokoro-platform
    newTag: latest
  - name: kokoro-session
    newTag: latest
  - name: kokoro-agent
    newTag: latest
  - name: kokoro-site-release
    newTag: latest
