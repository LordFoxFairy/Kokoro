apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kokoro

resources:
  - namespace.yaml
  - infra.yaml
  - platform.yaml
  - app.yaml
  - jobs.yaml

# 单源：Secret/ConfigMap 直接从 compose 用的同一批文件生成，k8s 与 compose 不各写一份。
# - kokoro-env      ← deploy/.env.prod（gitignored；= compose 的 env_file）
# - kokoro-storage  ← deploy/storage.yaml（挂 /app/storage.yaml）
# - kokoro-litellm-config ← litellm.config.example.yaml（挂 /app/config.yaml；dev 后端切换档换 dev 配置）
secretGenerator:
  - name: kokoro-env
    envs:
      - ../../.env.prod
configMapGenerator:
  - name: kokoro-storage
    files:
      - storage.yaml=../../storage.yaml
  - name: kokoro-litellm-config
    files:
      - config.yaml=../../../kokoro-platform/kokoro-litellm/config/litellm.config.example.yaml

# 固定名（不加 hash）：与各 manifest 的 envFrom/volume 引用对齐，也便于手动 kubectl。
# 代价：改 Secret/ConfigMap 后需手动 rollout restart（见 README）。
generatorOptions:
  disableNameSuffixHash: true

# 镜像 tag 统一 latest；接真实集群时把 newName 改成你的 registry（如 registry.example.com/kokoro-platform）。
images:
  - name: kokoro-platform
    newTag: latest
  - name: kokoro-kokoro-session
    newTag: latest
  - name: kokoro-kokoro-agent
    newTag: latest
  - name: kokoro-kokoro-web
    newTag: latest
