# Application processes from independent child artifacts. A Site release is an immutable image
# produced by its generated Site repository; kokoro-web remains the factory, not a shared runtime.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: kokoro-workspace }
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-session }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-session } }
  template:
    metadata: { labels: { app: kokoro-session } }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kokoro-session
          image: kokoro-session:latest
          envFrom: [{ secretRef: { name: session-environment } }]
          env:
            - { name: KOKORO_SESSION_PORT, value: "3900" }
            - { name: KOKORO_SESSION_OWNER_AUTHORITY_PORT, value: "3901" }
            - { name: KOKORO_SESSION_PROBE_HOST, value: "0.0.0.0" }
            - { name: KOKORO_SESSION_PROBE_PORT, value: "3902" }
          ports:
            - { name: browser, containerPort: 3900 }
            - { name: owner-authority, containerPort: 3901 }
            - { name: probe, containerPort: 3902 }
          startupProbe:
            httpGet: { path: /healthz, port: probe }
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: probe }
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: probe }
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
            - { name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
        - { name: secrets, secret: { secretName: session-files } }
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-session }
spec:
  selector: { app: kokoro-session }
  ports:
    - { name: browser, port: 3900, targetPort: browser }
    - { name: owner-authority, port: 3901, targetPort: owner-authority }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-agent-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-agent-worker } }
  template:
    metadata: { labels: { app: kokoro-agent-worker } }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kokoro-agent-worker
          image: kokoro-agent:latest
          envFrom: [{ secretRef: { name: agent-worker-environment } }]
          volumeMounts:
            - { name: workspace, mountPath: /data/workspace }
            - { name: storage, mountPath: /app/storage.yaml, subPath: storage.yaml }
            - { name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: kokoro-workspace } }
        - { name: storage, configMap: { name: kokoro-storage } }
        - { name: secrets, secret: { secretName: agent-worker-files } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-agent-evidence }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-agent-evidence } }
  template:
    metadata: { labels: { app: kokoro-agent-evidence } }
    spec:
      containers:
        - name: kokoro-agent-evidence
          image: kokoro-agent:latest
          command: ["uv", "run", "--no-sync", "kokoro-agent-evidence"]
          envFrom: [{ secretRef: { name: agent-evidence-environment } }]
          env:
            - { name: KOKORO_AGENT_EVIDENCE_HOST, value: 0.0.0.0 }
            - { name: KOKORO_AGENT_EVIDENCE_PORT, value: "8443" }
          ports: [{ name: connect, containerPort: 8443 }]
          readinessProbe: { tcpSocket: { port: connect }, initialDelaySeconds: 5, periodSeconds: 10 }
          volumeMounts: [{ name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }]
      volumes: [{ name: secrets, secret: { secretName: agent-evidence-files } }]
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-agent-evidence }
spec:
  selector: { app: kokoro-agent-evidence }
  ports: [{ name: connect, port: 8443, targetPort: connect }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kokoro-site-release }
spec:
  replicas: 1
  selector: { matchLabels: { app: kokoro-site-release } }
  template:
    metadata: { labels: { app: kokoro-site-release } }
    spec:
      containers:
        - name: kokoro-site-release
          image: kokoro-site-release:latest
          envFrom: [{ secretRef: { name: site-release-environment } }]
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts: [{ name: secrets, mountPath: /run/secrets/kokoro, readOnly: true }]
      volumes: [{ name: secrets, secret: { secretName: site-release-files } }]
---
apiVersion: v1
kind: Service
metadata: { name: kokoro-site-release }
spec:
  selector: { app: kokoro-site-release }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kokoro-site-release
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  rules:
    - host: kokoro.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kokoro-site-release
                port: { number: 3000 }
