# Kokoro 基建层（k8s）：postgres / redis / mongo / minio / litellm 各一个。与 compose 同一套设计——
# 全局唯一一套基建，上层「拿 Service DNS + env URL」连（Service 名 = env 里的主机名）。
# 单实例 + RWO PVC + Recreate 策略（避免滚更时 RWO 卷抢占死锁）。prod 若用托管云库：删掉对应块，
# 把 workload Secret 里的 URL 指向云地址即可（app 层不变）。
# ---------------------------------------------------------------- postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
          envFrom: [{ secretRef: { name: kokoro-infra-env } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/18/docker }]
          resources:
            requests: { memory: 256Mi }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
# ---------------------------------------------------------------- redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
# ---------------------------------------------------------------- mongo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mongo-data }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
          args: ["mongod", "--replSet", "kokoro-rs", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          lifecycle:
            postStart:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - >-
                    until mongosh --quiet --host 127.0.0.1 --eval
                    'try { quit(rs.status().ok === 1 ? 0 : 1) }
                    catch (error) { quit(rs.initiate({_id:"kokoro-rs",members:[{_id:0,host:"mongo:27017"}]}).ok === 1 ? 0 : 1) }';
                    do sleep 1; done
          readinessProbe:
            exec:
              command:
                - "mongosh"
                - "--quiet"
                - "--host"
                - "127.0.0.1"
                - "--eval"
                - "quit(rs.status().myState === 1 ? 0 : 1)"
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mongo-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: mongo }
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
# ---------------------------------------------------------------- minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: ["server", "/data", "--address", ":9100", "--console-address", ":9101"]
          envFrom: [{ secretRef: { name: kokoro-infra-env } }]
          ports: [{ containerPort: 9100 }, { containerPort: 9101 }]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: minio-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9100, targetPort: 9100 }
    - { name: console, port: 9101, targetPort: 9101 }
# ---------------------------------------------------------------- litellm
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: litellm }
spec:
  replicas: 1
  selector: { matchLabels: { app: litellm } }
  template:
    metadata: { labels: { app: litellm } }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable@sha256:47afa74b495c802317712e5b8c8a65e7ca30c96636e9b618a5f8130eec72a8ee
          args: ["--config=/app/config.yaml"]
          envFrom: [{ secretRef: { name: kokoro-infra-env } }]
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1536Mi }
          ports: [{ containerPort: 4000 }]
          volumeMounts: [{ name: config, mountPath: /app/config.yaml, subPath: config.yaml }]
          readinessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: kokoro-litellm-config }
---
apiVersion: v1
kind: Service
metadata: { name: litellm }
spec:
  selector: { app: litellm }
  ports: [{ port: 4000, targetPort: 4000 }]
